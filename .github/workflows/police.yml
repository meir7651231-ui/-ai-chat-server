# 🛡️ מחצב · CI-עד (PROTOCOL v4 §7.3 · שלב 3 · סבב-3: R3-6.1/6.2/6.4/6.5/6.8/6.9/6.10/6.12/6.14). עד, לא חומה (F/M): non-required, מדווח.
# סביבה נקייה: clone מלא (fetch-depth 0). G0 = המאמת-העצמאי **מכלי הסמן** (T's verify-independent על H — לא כלי-H): הסמן חייב להתקיים
# ולהיות זהה ל-vars.PROTOCOL_GOOD_SHA (מחוץ לריפו) — אחרת אדום, לא דילוג. G8 = Protocol-Ran על כל commit **מאז הסמן** (לא רק הדחיפה) — commit
# שנוצר בלי hooks נשאר אדום עד שהסמן מתקדם מעבר לו. אין cancel-in-progress (כל דחיפה מקבלת עד). Dart מקובע לגרסה המקומית.
name: police-witness
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: police-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  witness:
    name: 🛡️ עד (G0–G10)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      POLICE_GATE_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.7.2'
      - name: כלים (typescript vendored · Dart מקובע כמו מקומית)
        run: |
          cd machtzev && npm ci --no-audit --no-fund
          echo "DART_BIN=$(command -v dart)" >> "$GITHUB_ENV"
          echo "TOOLS=node $(node -v) · dart $(dart --version 2>&1 | head -1)" >> "$GITHUB_ENV"
          node -v; dart --version
      - name: סמן + בסיס (הסמן = vars.PROTOCOL_GOOD_SHA; ענף protocol-good-* חייב להצביע עליו)
        id: base
        run: |
          set +e
          EXP='${{ vars.PROTOCOL_GOOD_SHA }}'
          MARKER=$(git for-each-ref --format='%(refname:short) %(objectname)' 'refs/remotes/origin/protocol-good-*' | awk -v e="$EXP" '$2==e {print $1; exit}')
          if [ -z "$EXP" ]; then echo "🚨 vars.PROTOCOL_GOOD_SHA לא מוגדר — הסמן חייב להישמר מחוץ לריפו (R2-1.6 · R3-6.2). הגדר: Settings → Variables → PROTOCOL_GOOD_SHA=<sha הסמן>"; echo "msha=" >> "$GITHUB_OUTPUT"; MSHA=""
          elif [ -z "$MARKER" ]; then echo "🚨 אף ענף protocol-good-* לא מצביע על vars.PROTOCOL_GOOD_SHA ($EXP) — TAMPER או קידום בלי עדכון-המשתנה"; MSHA=""
          else MSHA="$EXP"; fi
          BEFORE='${{ github.event.before }}'
          if [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then BASE="$BEFORE"
          elif [ -n "$MSHA" ] && git merge-base --is-ancestor "$MSHA" HEAD; then BASE=$(git merge-base "$MSHA" HEAD)
          else BASE=$(git rev-parse HEAD~1); fi
          echo "marker=${MARKER:-}" >> "$GITHUB_OUTPUT"; echo "msha=$MSHA" >> "$GITHUB_OUTPUT"; echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse --short "$BASE") · marker=${MARKER:-❌} ($(printf '%s' "$MSHA" | cut -c1-8))"
      - name: G1 · pins (נגזר ≡ כתוב · 64-hex) — מכסה G4
        run: node machtzev/pins-check.mjs
      - name: G9 · ראצ׳ט-כיוון מול הבסיס (כלי-HEAD; G0 חוזר על זה מכלי-הסמן)
        run: node machtzev/ratchet-direction.mjs "${{ steps.base.outputs.base }}" HEAD
      - name: G8 · Protocol-Ran על כל commit מאז הסמן (לא רק הדחיפה — R3-6.4) · בלי merges (R3-6.5)
        run: |
          FROM='${{ steps.base.outputs.msha }}'; [ -n "$FROM" ] || FROM='${{ steps.base.outputs.base }}'
          MISSING=""
          for c in $(git rev-list --no-merges "$FROM"..HEAD); do
            git log -1 --format=%B "$c" | grep -q '^Protocol-Ran:' || MISSING="$MISSING $(printf '%s' "$c" | cut -c1-8)"
          done
          N=$(git rev-list --no-merges --count "$FROM"..HEAD)
          if [ -n "$MISSING" ]; then echo "🚨 $N commits מאז $(printf '%s' "$FROM" | cut -c1-8) · בלי Protocol-Ran (נוצרו בלי pre-commit):$MISSING"; echo "missing=$MISSING" >> "$GITHUB_ENV"; exit 1; fi
          echo "✓ Protocol-Ran על $N commits מאז $(printf '%s' "$FROM" | cut -c1-8)"
      - name: G3+G7 · truth ≡ index · CLAUDE truth-block · gen-wiring-doc ⇒ diff ריק
        run: |
          node machtzev/truth.mjs --write >/dev/null
          node machtzev/tools/gen-wiring-doc.mjs >/dev/null
          if ! git diff --exit-code --stat -- TRUTH.md WIRING.md CLAUDE.md; then echo "🚨 מסמכים-מחוללים ישנים ב-commit (M1/M2 לא רצו?)"; exit 1; fi
          echo "✓ TRUTH.md · WIRING.md · בלוק-CLAUDE ≡ index"
      - name: G2+G10 · משטרה מלאה (צהוב = אדום · ledger · מס-פרוטוקול)
        id: police
        run: |
          S=$(date +%s); set +e
          CI=true node machtzev/police.mjs > police.log 2>&1; RC=$?; set -e
          T=$(( $(date +%s) - S )); echo "tax=$T" >> "$GITHUB_OUTPUT"; echo "rc=$RC" >> "$GITHUB_OUTPUT"
          grep -E '^(ran|skipped|yellow|failed) |המשטרה' police.log || true
          echo "⏱ מס-פרוטוקול (CI מלא): ${T}s"
          case $RC in 0) ;; 2) echo "🚨 צהוב ב-CI = אדום (כלי חסר בסביבה נקייה — L34)"; tail -40 police.log || true; exit 1;; *) echo "🚨 המשטרה אדומה"; grep -B3 -A12 '^failed ' police.log | head -80 || true; exit 1;; esac
      - name: G8 · dart analyze על new/dart-* (עד בלבד — synth מקמפל)
        continue-on-error: true
        run: |
          for d in new/dart-*; do [ -d "$d" ] && (dart analyze --no-fatal-warnings "$d" | tail -1 || true); done
      - name: G0 · המאמת-העצמאי מכלי הסמן (T's verify-independent על H · ללא קידום · אין דילוג)
        run: |
          MSHA='${{ steps.base.outputs.msha }}'
          [ -n "$MSHA" ] || { echo "🚨 G0: אין סמן מאומת — אין עד עצמאי (R3-6.1)"; exit 1; }
          git worktree add --detach /tmp/T "$MSHA"
          cp -r machtzev/node_modules /tmp/T/machtzev/ 2>/dev/null || true
          set +e
          node /tmp/T/machtzev/verify-independent.mjs "$MSHA" HEAD --repo "$PWD" --report verify.json --expect-sha "$MSHA" > verify.log 2>&1; RC=$?
          set -e
          grep -vE '^(ran|  ✅|✓) ' verify.log | tail -30 || true
          [ -f verify.json ] && node -e 'const r=require("./verify.json");console.log("verdict:",r.verdict);for(const[k,v]of Object.entries(r.steps||{}))console.log(" ",k,"→",JSON.stringify(v).slice(0,200))' || true
          case $RC in 0) echo "✅ ירוק — מועמד-לקידום (הקידום = ack-בעלים + עדכון vars.PROTOCOL_GOOD_SHA + ה-Routine)";; 2) echo "🚨 צהוב/לא-מוכח ב-CI = אדום (R3-6.8)"; exit 1;; 1) echo "🚨 אדום — החלשה מול הסמן"; exit 1;; *) echo "🚨 TAMPER"; exit 1;; esac
      - name: סיכום (ערוץ-הדיווח = job summary)
        if: always()
        run: |
          {
            echo "## 🛡️ מחצב · עד"
            echo "- HEAD \`$(git rev-parse --short HEAD)\` · base \`$(git rev-parse --short '${{ steps.base.outputs.base }}' 2>/dev/null || echo '?')\` · סמן \`${{ steps.base.outputs.marker }}\` · $TOOLS"
            echo "- משטרה: rc=${{ steps.police.outputs.rc }} · מס-פרוטוקול ${{ steps.police.outputs.tax }}s"
            [ -f verify.json ] && echo "- מאמת (מכלי-הסמן): $(node -e 'console.log(require("./verify.json").verdict)' 2>/dev/null || echo '?')" || echo "- מאמת: לא רץ"
            [ -n "${missing:-}" ] && echo "- 🚨 commits בלי Protocol-Ran מאז הסמן:${missing}" || true
            echo '```'; grep -E '^(failed|yellow) |המשטרה' police.log 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
