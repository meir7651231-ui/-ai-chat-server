# step 1 (one-tree-one-version): every commit runs the gates; a tagged ship builds the signed APK.
# What changed from the old workflow: it ran only on android/** (so a commit that replaced the APK
# itself ran nothing), it installed gradle from apt instead of using a pinned wrapper, and its
# keystore step carried `if: env.KS != ''` — a condition on a variable defined inside the same step,
# which is always false, so the release was never actually signed with the real key.
name: liba
on:
  push:
    branches: [liba-android, main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # the ubuntu runner ships an Android SDK; android-actions/setup-android's sdkmanager failed on it
      - name: apksigner from the runner's SDK (for the apk-hash gate)
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "APKSIGNER=$BT/apksigner" >> "$GITHUB_ENV"; echo "apksigner: $BT"
      - name: Playwright browser for the pinned version (package.json)
        run: npx playwright install --with-deps chromium
      - name: כל השערים
        run: node gates/run.mjs

  # step test-gate-real: every bug in tests/mutate.mjs must be caught, or nothing ships
  mutate:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: מוטציות
        run: |
          git config --global user.email ci@liba && git config --global user.name ci
          LIBA_MUT_WT="$RUNNER_TEMP/mut" node tests/mutate.mjs

  build:
    runs-on: ubuntu-latest
    needs: [gates, mutate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - name: Keystore from secrets
        id: ks
        env:
          KS: ${{ secrets.LIBA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LIBA_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.LIBA_KEY_PASS }}
        run: |
          if [ -z "$KS" ]; then
            # no signing secrets on GitHub: the signed build happens on the machine that holds the key
            # (ship/release.mjs). Here we still prove every commit compiles - that is not skipped.
            echo "::notice::אין סודות חתימה ב-GitHub. כאן נבדקת קומפילציה בלבד; השילוח החתום נעשה דרך ship/release.mjs"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p android/keys
          printf '%s' "$KS" | base64 -d > android/keys/liba.jks
          printf 'storeFile=keys/liba.jks\nstorePassword=%s\nkeyAlias=liba\nkeyPassword=%s\n' "$KS_PASS" "$KEY_PASS" > android/keys/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: קומפילציה (בלי מפתח)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug -q --console=plain

      - name: בנייה ואימות חותם
        if: steps.ks.outputs.signed == 'true'
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKSIGNER="$BT/apksigner" AAPT2="$BT/aapt2" node ship/release.mjs --verify

      - name: ניקוי חומר חתימה
        if: always()
        run: rm -rf android/keys

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.signed == 'true'
        with: { name: liba-apk, path: android/app/build/outputs/apk/release/*.apk }
