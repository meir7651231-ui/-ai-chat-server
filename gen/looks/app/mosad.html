<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מוסד — מערכת הניהול</title>
<meta name="description" content="מערכת ניהול למוסד: 12 אגפים, מחסן נתונים אחד, והאפיון עצמו בתוך המסכים.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Suez+One&display=swap">
<style>
/* ====== הבסיס המשותף: טוקנים · איפוס · שלד · רכיבי-על ====== */
:root{
 --bg:#fbfbfa;--card:#fff;--sunk:#f4f3f0;--raise:#ebe9e5;--ink:#37352F;--mut:#6b675e;--faint:#8a857b;
 --hair:rgba(0,0,0,.1);--acc:#2560D0;--acc-soft:#eaf1fe;--on-acc:#fff;--ok:#12703d;--ok-soft:#e3f3ea;
 --warn:#8a5e00;--warn-soft:#fbf0d8;--err:#a8281a;--err-soft:#fbe7e4;
 --c1:#2560D0;--c1-soft:#eaf1fe;--c2:#12703d;--c2-soft:#e3f3ea;--c3:#8a5e00;--c3-soft:#fbf0d8;
 --c4:#6a3fc0;--c4-soft:#f0ebfb;--c5:#a8281a;--c5-soft:#fbe7e4;--c6:#0c6570;--c6-soft:#e2f2f4;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
 --r:16px;--rs:10px;--row:44px;--barh:56px;--dir:-1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0d0d0f;--card:#161619;--sunk:#1c1c20;--raise:#26262b;--ink:#ECE9E2;--mut:#a8a299;--faint:#8b857c;
 --hair:rgba(236,233,226,.14);--acc:#7FA6F5;--acc-soft:#1a2436;--on-acc:#0B0B0D;--ok:#5cd79b;--ok-soft:#14261d;
 --warn:#e8bd5c;--warn-soft:#2a2318;--err:#f08d80;--err-soft:#2c1a17;
 --c1:#7FA6F5;--c1-soft:#1a2436;--c2:#5cd79b;--c2-soft:#14261d;--c3:#e8bd5c;--c3-soft:#2a2318;
 --c4:#b79bf0;--c4-soft:#221c32;--c5:#f08d80;--c5-soft:#2c1a17;--c6:#63c6d2;--c6-soft:#152628;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d0d0f;--card:#161619;--sunk:#1c1c20;--raise:#26262b;--ink:#ECE9E2;--mut:#a8a299;--faint:#8b857c;--hair:rgba(236,233,226,.14);--acc:#7FA6F5;--acc-soft:#1a2436;--on-acc:#0B0B0D;--ok:#5cd79b;--ok-soft:#14261d;--warn:#e8bd5c;--warn-soft:#2a2318;--err:#f08d80;--err-soft:#2c1a17;--c1:#7FA6F5;--c1-soft:#1a2436;--c2:#5cd79b;--c2-soft:#14261d;--c3:#e8bd5c;--c3-soft:#2a2318;--c4:#b79bf0;--c4-soft:#221c32;--c5:#f08d80;--c5-soft:#2c1a17;--c6:#63c6d2;--c6-soft:#152628;color-scheme:dark}
:root[data-density=compact]{--s3:9px;--s4:12px;--s5:16px;--s6:22px;--row:36px}

*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Heebo,Arial,sans-serif;letter-spacing:0}
bdi{unicode-bidi:isolate}.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance}p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.skip{position:absolute;inset-inline-start:-9999px;top:0;background:var(--acc);color:var(--on-acc);
 padding:var(--s2) var(--s4);border-radius:var(--rs);z-index:99;text-decoration:none}
.skip:focus{inset-inline-start:var(--s4);top:var(--s2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- סרגל עליון ---- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:var(--s3);
 padding:var(--s2) var(--s4);background:var(--card);border-block-end:1px solid var(--hair);min-height:var(--barh);flex-wrap:wrap}
.topbar .brand{text-decoration:none;font:800 17px Heebo;white-space:nowrap}
.topbar .find{flex:1;min-width:min(100%,220px);display:flex;align-items:center;gap:var(--s2);
 border:1px solid var(--hair);background:var(--sunk);border-radius:999px;padding:8px var(--s4);
 font-size:13.5px;color:var(--mut);min-height:40px;text-align:start}
.topbar .find:hover{border-color:var(--acc);color:var(--acc)}
.topbar .find kbd{margin-inline-start:auto;font:600 11px ui-monospace,monospace;background:var(--card);
 border:1px solid var(--hair);border-radius:5px;padding:2px 6px;color:var(--mut)}
.tabs{display:flex;gap:2px;overflow-x:auto;order:3;width:100%;padding-bottom:2px}
.tabs a{display:flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--mut);
 padding:7px 12px;border-radius:999px;font-size:13.5px}
.tabs a:hover{background:var(--sunk);color:var(--ink)}
.tabs a[aria-current=page]{background:var(--acc-soft);color:var(--acc);font-weight:700}
.tabs i{font-style:normal;opacity:.8}
.tools{display:flex;gap:var(--s2);align-items:center}
.tools select{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:7px 11px;font-size:13px;min-height:38px}
.tbtn{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--mut);min-height:38px}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
.themeSw{display:flex;gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.themeSw button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;border-radius:999px;
 padding:6px 11px;font-size:12.5px;color:var(--mut);min-height:34px}
.themeSw button i{font-style:normal;font-size:12px}
.themeSw button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px var(--hair)}
@media(max-width:620px){.themeSw button span,.themeSw button{font-size:0}.themeSw button i{font-size:14px}}

#app{display:block;min-height:70vh}
#app:focus{outline:none}
.pad{padding:var(--s4);max-width:1240px;margin-inline:auto}
.pad.narrow{max-width:900px}
.sp{flex:1}

/* ---- רכיבים משותפים ---- */
.lk{color:var(--acc);text-decoration:none}
.lk:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--card);
 border-radius:var(--rs);padding:8px 14px;font-size:13.5px;min-height:40px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.btn.pri:hover{color:var(--on-acc)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--mut)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;flex:none}
.av.more{background:var(--sunk);color:var(--mut);width:30px;height:30px;font-size:11px}
.masked{color:var(--mut);letter-spacing:.12em}
.s{font-size:13px;color:var(--mut)}
.ui-empty{padding:var(--s4);color:var(--mut);font-size:13.5px;background:var(--sunk);border-radius:var(--rs);text-align:center}

.kpi{display:inline-flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.kpi>b{font:800 20px Heebo;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi>span{font-size:12.5px;color:var(--mut)}
.kpi .why{border:1px solid var(--hair);background:transparent;color:var(--mut);border-radius:50%;
 width:17px;height:17px;min-height:0;padding:0;font:700 10px Heebo;line-height:1}
.kpi .why:hover{border-color:var(--acc);color:var(--acc)}

.ui-bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:auto}
.ui-bars i{flex:1;background:var(--acc-soft);border-radius:3px 3px 0 0;position:relative}
.ui-bars i.low{background:var(--err-soft)}
.ui-bars i b{position:absolute;inset-inline:0;bottom:calc(100% + 2px);text-align:center;font:700 9px Heebo;color:var(--mut)}
.ui-bars i u{position:absolute;inset-inline:0;top:calc(100% + 2px);text-align:center;font:500 9px Heebo;color:var(--mut);text-decoration:none}
.ui-track{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;position:relative}
.ui-track i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}

/* ---- פלטת-הפקודות ---- */
.pal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);display:grid;place-items:start center;padding-top:10vh}
.pal[hidden]{display:none}
.palbox{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);width:min(660px,94vw);
 box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.palbox input{width:100%;border:0;border-block-end:1px solid var(--hair);padding:var(--s4);font-size:16px;outline:0;background:var(--card)}
#palr{max-height:52vh;overflow:auto;padding:var(--s2)}
#palr li{display:flex;align-items:baseline;gap:var(--s3);padding:9px var(--s3);border-radius:var(--rs);cursor:pointer}
#palr li[aria-selected=true]{background:var(--acc-soft)}
#palr .t{font-weight:600;font-size:14.5px}
#palr .s{font-size:12.5px;color:var(--mut)}
#palr .none{color:var(--mut);font-size:13.5px;justify-content:center}
.palfoot{padding:var(--s2) var(--s4);border-block-start:1px solid var(--hair);font-size:12px;color:var(--mut);background:var(--sunk)}

/* ---- דיאלוג · הודעה ---- */
.ui-dialog{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:var(--s4)}
.ui-dialog .sheet{background:var(--card);border-radius:var(--r);width:min(520px,94vw);max-height:84vh;overflow:auto;
 box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ui-dialog .dh{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-block-end:1px solid var(--hair)}
.ui-dialog .dh h2{font-size:16px;flex:1}
.ui-dialog .x{border:0;background:var(--sunk);border-radius:8px;width:30px;height:30px}
.ui-dialog .db{padding:var(--s4);font-size:14px;line-height:1.7}
.ui-dialog .da{padding:var(--s3) var(--s4);border-block-start:1px solid var(--hair);display:flex;gap:var(--s2);justify-content:flex-end}
.dtext{margin-bottom:var(--s2)}
.dnote{font-size:12.5px;color:var(--mut);margin-top:var(--s3)}
.rule{background:var(--err-soft);color:var(--err);border-radius:var(--rs);padding:var(--s3);font-weight:600}
.ui-toast{position:fixed;inset-inline-start:var(--s4);bottom:var(--s4);z-index:95;background:var(--ink);color:var(--bg);
 border-radius:999px;padding:11px var(--s4);display:flex;align-items:center;gap:var(--s3);font-size:13.5px;
 box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(560px,92vw)}
.ui-toast button{background:transparent;border:0;color:var(--bg);text-decoration:underline;font-weight:700;padding:0;min-height:0}
.deny{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:var(--s4);margin-top:var(--s4);font-size:14px;line-height:1.8}
.deny .dnote{color:inherit;opacity:.85}

/* ---- תיקים ---- */
.dossier{max-width:1060px;margin-inline:auto;padding:var(--s4) var(--s4) var(--s7)}
.dhead{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;padding-bottom:var(--s4);border-block-end:1px solid var(--hair)}
.dhead .who{flex:1;min-width:200px}
.dhead h1{font-size:24px}
.dhead .who p{font-size:13.5px;color:var(--mut);margin-top:3px}
.dstats{display:flex;gap:var(--s5);flex-wrap:wrap}
.dstats .kpi{flex-direction:column;align-items:flex-start;gap:0}
.dtabs{display:flex;gap:var(--s2);flex-wrap:wrap;padding:var(--s3) 0;position:sticky;top:var(--barh);background:var(--bg);z-index:20}
.dtabs a{font-size:13px;color:var(--mut);text-decoration:none;background:var(--sunk);border-radius:999px;padding:6px 13px}
.dtabs a:hover{background:var(--acc-soft);color:var(--acc)}
.dsec{padding:var(--s5) 0;border-block-end:1px solid var(--hair)}
.dsec>h2{font-size:17px;display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3)}
.dsec .dep{font-size:11.5px;font-weight:400;color:var(--mut);background:var(--sunk);border-radius:999px;padding:2px 9px}
.dsec h3{font-size:13.5px;color:var(--mut);font-weight:600;margin-bottom:var(--s2)}
.two2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s5)}
table.mini{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.mini caption{text-align:start;font-size:12.5px;color:var(--mut);padding-bottom:var(--s2)}
table.mini th{text-align:start;font-weight:400;padding:7px 0;border-block-end:1px solid var(--hair);color:var(--ink)}
table.mini td{text-align:end;padding:7px 0;border-block-end:1px solid var(--hair);font-variant-numeric:tabular-nums;color:var(--ink)}
table.mini .minus td{color:var(--ok)}
table.mini .tot th,table.mini .tot td{font-weight:800;border-block-end:0;padding-top:10px}
.mlist li{display:flex;align-items:baseline;gap:var(--s3);padding:9px 0;border-block-end:1px solid var(--hair);font-size:13.5px}
.mlist .n{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:600}
.mlist .ago{font-size:12px;color:var(--mut);white-space:nowrap}
.dacts{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.kidcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s2)}
.kidcard{display:flex;gap:var(--s3);align-items:center;padding:var(--s3);background:var(--card);
 border:1px solid var(--hair);border-radius:12px;text-decoration:none;color:inherit}
.kidcard:hover{border-color:var(--acc)}
.kidcard b{font-size:14px;display:block}
.kidcard span{font-size:11.5px;color:var(--mut);display:block}
.big2{font:800 22px Heebo}
.tline li{display:flex;gap:var(--s3);align-items:baseline;padding:9px 0 9px var(--s4);border-inline-start:2px solid var(--hair);
 margin-inline-start:6px;font-size:13.5px;position:relative}
.tline li::before{content:'';position:absolute;inset-inline-start:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--raise)}
.tline b{font-weight:700}
.tline span{color:var(--mut)}
.attrow{display:flex;gap:var(--s2);flex-wrap:wrap}
.attday{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;font-size:16px;font-weight:700}
.attday b{display:block;font-size:11px;font-weight:600;opacity:.75}
.attday.y{background:var(--ok-soft);color:var(--ok)}
.attday.n{background:var(--err-soft);color:var(--err)}
.flow{display:flex;gap:4px;flex-wrap:wrap}
.flow li{font-size:12px;background:var(--sunk);color:var(--mut);border-radius:999px;padding:5px 12px}
.flow li.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.rulelist li{font-size:13px;color:var(--err);background:var(--err-soft);border-radius:8px;padding:6px 11px;margin-bottom:5px}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.fld{background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:12.5px}
.fld i{display:block;font-style:normal;font-size:10.5px;color:var(--mut)}

/* ---- יומן · אפיון ---- */
.logl li{display:flex;gap:var(--s3);align-items:center;padding:11px 0;border-block-end:1px solid var(--hair);font-size:13.5px;flex-wrap:wrap}
.logl .w{flex:1;min-width:180px;font-weight:600}
.logl .d{font-size:11.5px;background:var(--sunk);color:var(--mut);border-radius:999px;padding:2px 9px}
.logl .t{font-size:12px;color:var(--mut)}
.logl .done{color:var(--mut)}
#sq{width:100%;border:1px solid var(--hair);background:var(--card);border-radius:12px;padding:11px var(--s4);
 font-size:15px;margin:var(--s4) 0;min-height:44px;outline:0}
#sq:focus{border-color:var(--acc)}
.specd{margin-bottom:var(--s5)}
.specd>h2{font-size:16px;display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.specd>h2 span{font-size:11.5px;font-weight:400;color:var(--mut)}
.spece{border:1px solid var(--hair);border-radius:var(--rs);margin-bottom:5px;background:var(--card)}
.spece summary{cursor:pointer;padding:10px var(--s3);font-size:14px;font-weight:600;display:flex;gap:var(--s2);align-items:baseline}
.spece summary span{font-size:11.5px;font-weight:400;color:var(--mut);margin-inline-start:auto}
.spece[open]{border-color:var(--acc)}
.spece .mo{font-size:12.5px;color:var(--mut);padding:0 var(--s3) var(--s2)}
.spece .flow,.spece .rulelist,.spece .fieldgrid{margin:0 var(--s3) var(--s3)}

/* ---- מצבים פר-מסך שנשארו גלובליים ---- */
#app[data-v=hatzer]{background:#0e1113;color:#f2efe9;min-height:100vh}
#app[data-v=ksafim]{background:var(--raise)}
.moment{font-size:12.5px;color:var(--mut);max-width:60ch}
.rules{margin-top:var(--s5);background:var(--sunk);border-radius:var(--r);padding:var(--s4)}
.rules h3{font-size:13.5px;margin-bottom:var(--s2)}
.rules li{font-size:13px;color:var(--err);background:var(--err-soft);border-radius:8px;padding:6px 11px;margin-bottom:5px}

@media print{.topbar,.pal,.ui-toast,.dtabs,.dacts{display:none!important}body{background:#fff}}
@media(max-width:700px){.topbar .find kbd{display:none}.dstats{gap:var(--s4)}}

/* ===== anashim.css ===== */
/* אנשים — טבלה דינמית.
   המידות נמדדו מ-Atlassian Design System: שורה 48 · כותרת 653 12/16
   מעל קו 2px · ריפוד 4/8/4/0 · אפס קו בין שורות (הגובה מפריד) ·
   טעינה ב-20% שקיפות במקום שלד. הצבעים הם של האפליקציה.          */
#app[data-v=anashim] .hd{position:sticky;top:0;z-index:30;background:var(--bg);border-block-end:1px solid var(--hair);
 padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
#app[data-v=anashim] .hd h1{font-size:19px}
#app[data-v=anashim] .hd .cnt{font-size:12.5px;color:var(--mut)}
#app[data-v=anashim] .hd .cnt2{font-size:12.5px;color:var(--mut);margin-inline-start:auto;
 font-variant-numeric:tabular-nums;white-space:nowrap}
#app[data-v=anashim] .hd input,#app[data-v=anashim] .hd select{border:1px solid var(--hair);background:var(--card);color:var(--ink);
 border-radius:var(--rs);padding:8px var(--s3);font-size:14px;outline:0;min-height:36px}
#app[data-v=anashim] .hd input{min-width:min(100%,220px)}
#app[data-v=anashim] .hd input:focus,#app[data-v=anashim] .hd select:focus{border-color:var(--acc)}
#app[data-v=anashim] .gh{border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:var(--rs);
 padding:0 var(--s3);font:400 13.5px/1 Heebo;min-height:36px}
#app[data-v=anashim] .gh:hover{background:var(--sunk)}
#app[data-v=anashim] .gh.sm{min-height:30px;font-size:12.5px;color:var(--mut);padding:0 10px}
#app[data-v=anashim] .gh.sm:hover{color:var(--err);border-color:var(--err)}
#app[data-v=anashim] .gh[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
#app[data-v=anashim] .hid{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

const HMONTH = ['תשרי', 'חשון', 'כסלו', 'טבת', 'שבט', 'אדר', 'ניסן', 'אייר', 'סיון', 'תמוז', 'אב', 'אלול'];
const HDAY = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ז׳', 'ח׳', 'ט׳', 'י׳', 'י״א', 'י״ב', 'י״ג', 'י״ד', 'ט״ו', 'ט״ז', 'י״ז', 'י״ח', 'י״ט', 'כ׳', 'כ״א', 'כ״ב', 'כ״ג', 'כ״ד', 'כ״ה', 'כ״ו', 'כ״ז', 'כ״ח', 'כ״ט', 'ל׳'];

/* התעריפון — הבסיס לכל חיוב. שינוי כאן מזיז את כל המספרים במערכת. */
const TARIFF = { tuition: 6000, bus: 900, books: 225, year: 'תשפ״ז' };
const DISCOUNTS = [0, 0, 0, 10, 10, 15, 15, 15, 21, 35];

const DB = {
  tariff: TARIFF, hmonths: HMONTH,
  today: { hd: 'ד׳ תשרי', hy: 'תשפ״ז', dow: 'יום שלישי' },
  people: [], families: [], students: [], classes: [], staff: [], payments: [],
  donors: [], donations: [], campaigns: [], budget: [], seats: [], minyanim: [],
  yahrzeits: [], queue: [], loans: [], routes: [], calls: [], proposals: [],
  groups: [], messages: [], log: [],
};

/* ---------- בניית העולם ---------- */
function build() {
  R = seed(20260915);
  let pid = 0;
  const person = (o) => { const p = { id: 'p' + pid++, ...o }; DB.people.push(p); return p; };

  /* 12 כיתות */
  CLASSES.forEach((n, i) => DB.classes.push({ id: 'c' + i, name: n, room: 'חדר ' + (10 + i), rebbe: null, students: [] }));

  /* 44 עובדים */
  const STAFF_ROLES = [['מגיד שיעור', 12], ['מלמד', 10], ['משגיח', 3], ['מזכירות', 4], ['מטבח', 5], ['אחזקה', 3], ['נהג', 4], ['הנהלה', 3]];
  STAFF_ROLES.forEach(([role, n]) => {
    for (let i = 0; i < n; i++) {
      const p = person({ first: pk(MALE), last: pk(LAST), city: pk(CITY), kind: 'עובד' });
      const absent = chance(0.07) ? pk(['חופשה', 'מחלה']) : null;
      DB.staff.push({
        id: 't' + DB.staff.length, personId: p.id, role, absent, sub: null,
        since: rn(1, 22) + ' שנים', phone: '0' + rn(50, 58) + '-' + rn(200, 999) + '-' + rn(1000, 9999),
        shifts: [],
      });
    }
  });
  /* משבצות היום — נגזרות מהתפקיד, לא נכתבות ביד */
  const SHIFT = {
    'מגיד שיעור': [['08:00', '12:20', 'סדר א׳'], ['13:45', '16:10', 'סדר ב׳']],
    'מלמד': [['08:00', '12:20', 'סדר א׳'], ['13:45', '15:20', 'חזרה']],
    'משגיח': [['06:20', '09:00', 'שחרית'], ['12:20', '13:45', 'סעודה'], ['19:00', '21:30', 'סדר ערב']],
    'מזכירות': [['08:00', '15:00', 'משרד']],
    'מטבח': [['05:30', '14:00', 'בוקר וצהריים'], ['17:00', '20:00', 'ערב']],
    'אחזקה': [['07:00', '16:00', 'אחזקה']],
    'נהג': [['07:00', '08:30', 'איסוף'], ['16:00', '17:30', 'פיזור']],
    'הנהלה': [['08:30', '17:00', 'משרד']],
  };
  DB.staff.forEach(s => { s.shifts = s.absent ? [] : SHIFT[s.role].map(x => x.slice()); });
  DB.classes.forEach((c, i) => { const t = DB.staff[i]; c.rebbe = t.id; t.classId = c.id; });
  /* מחליף למי שנעדר — רק אם יש פנוי באותו תפקיד */
  DB.staff.filter(s => s.absent).forEach(s => {
    const free = DB.staff.find(x => !x.absent && x.role === s.role && !x.subFor);
    if (free && chance(0.7)) { s.sub = free.id; free.subFor = s.id; free.shifts = [['08:00', '16:00', 'במקום ' + nameOf(s.personId)]]; }
  });

  /* 168 משפחות · 412 תלמידים */
  const FAMS = 168;
  for (let i = 0; i < FAMS; i++) {
    const last = LAST[i % LAST.length] + (i >= LAST.length ? ' ' + MALE[i % 7][0] + '׳' : '');
    const head = person({ first: pk(MALE), last, city: pk(CITY), kind: 'הורה' });
    const spouse = person({ first: pk(FEM), last, city: head.city, kind: 'הורה' });
    const f = {
      id: 'f' + i, name: 'משפחת ' + last, city: head.city, head: head.id, spouse: spouse.id,
      phone: '0' + rn(50, 58) + '-' + rn(200, 999) + '-' + rn(1000, 9999),
      kids: [], discount: pk(DISCOUNTS), hok: chance(0.62), seat: null, loan: null, donor: null,
      note: '',
    };
    head.familyId = spouse.familyId = f.id;
    DB.families.push(f);
  }
  /* התלמידים מחולקים למשפחות עד 412 בדיוק */
  let sid = 0;
  while (sid < 412) {
    const f = DB.families[sid % FAMS];
    if (f.kids.length >= 5) { sid++; continue; }
    const p = person({ first: pk(MALE), last: f.name.replace('משפחת ', ''), city: f.city, kind: 'תלמיד', familyId: f.id });
    const cls = DB.classes[rn(0, 11)];
    const st = {
      id: 's' + sid, personId: p.id, familyId: f.id, classId: cls.id,
      att: Array.from({ length: 5 }, () => chance(0.93)),
      note: chance(0.1) ? pk(['איחורים חוזרים', 'מצטיין בעיון', 'זקוק לחיזוק בחשבון', 'חבר טוב לכיתה']) : '',
      routeId: null, stopIdx: 0,
    };
    p.studentId = st.id; f.kids.push(st.id); cls.students.push(st.id);
    DB.students.push(st); sid++;
  }

  /* חיובים — נגזרים מהתעריפון ומההנחה; אין שדה «יתרה» שנכתב ביד */
  DB.families.forEach(f => {
    f.paid = 0;
    const due = charged(f);
    const ratio = f.hok ? (0.55 + R() * 0.45) : (0.15 + R() * 0.75);
    f.paid = Math.round(due * ratio / 100) * 100;
  });

  /* תשלומים אחרונים */
  for (let i = 0; i < 48; i++) {
    const f = pk(DB.families);
    DB.payments.push({ id: 'y' + i, familyId: f.id, amount: rn(3, 40) * 100, method: pk(['הוראת קבע', 'המחאה', 'אשראי', 'מזומן', 'העברה']), ago: i });
  }

  /* מגביות ותרומות */
  DB.campaigns.push({ id: 'k0', name: 'בניין בית המדרש', goal: 2400000, open: true, miles: [[25, 'יסודות'], [50, 'שלד'], [75, 'גג'], [100, 'סיום']] });
  DB.campaigns.push({ id: 'k1', name: 'קמחא דפסחא', goal: 240000, open: false, miles: [] });
  DB.campaigns.push({ id: 'k2', name: 'דינר תשפ״ו', goal: 1000000, open: false, miles: [] });
  const AMB = 5;
  for (let i = 0; i < 180; i++) {
    const inFam = i < 60 ? DB.families[rn(0, FAMS - 1)] : null;
    const p = inFam ? DB.people.find(x => x.id === inFam.head) : person({ first: pk(MALE), last: pk(LAST), city: pk(CITY), kind: 'תורם' });
    const d = { id: 'd' + i, personId: p.id, city: p.city, amb: i < AMB ? 'a' + i : (chance(0.55) ? 'a' + rn(0, AMB - 1) : null), anon: chance(0.12) };
    if (inFam) inFam.donor = d.id;
    p.donorId = d.id;
    DB.donors.push(d);
  }
  /* התפלגות התרומות: הרבה קטנות, מעט גדולות — אחרת המגבית «עוברת» את היעד שלה */
  const AMOUNTS = [360, 360, 500, 500, 1000, 1000, 1800, 1800, 3600, 3600, 5400, 5400, 10000, 18000, 25000, 36000];
  for (let i = 0; i < 260; i++) {
    const dn = pk(DB.donors);
    DB.donations.push({
      id: 'n' + i, donorId: dn.id, amount: i === 0 ? 180000 : pk(AMOUNTS),   // מתנת-הפתיחה של הפרנס
      campaignId: chance(0.72) ? 'k0' : pk(['k1', 'k2']),
      amb: dn.amb, ago: i, method: pk(['העברה', 'אשראי', 'המחאה', 'מזומן']),
    });
  }
  DB.ambassadors = Array.from({ length: AMB }, (_, i) => ({ id: 'a' + i, personId: DB.donors[i].personId, goal: [700000, 500000, 250000, 200000, 150000][i] }));

  /* תקציב — הביצוע נגזר מהחודשים */
  [['שכר מלמדים וצוות חינוכי', 1180], ['מטבח וסעודות', 312], ['הסעות', 196], ['אחזקת מבנה וחשמל', 168],
  ['ספרים וציוד לימודי', 84], ['פנימייה', 126], ['משרד, ביטוח ורואה חשבון', 64], ['בית המדרש ואירועים', 20]]
    .forEach(([n, plan], i) => {
      const months = HMONTH.map((_, m) => m === 11 ? 0 : Math.round(plan / 11 * (0.75 + R() * 0.55)));
      DB.budget.push({ id: 'b' + i, name: n, plan, months });
    });

  /* בית המדרש — 72 מקומות, חלקם משויכים למשפחות */
  for (let r = 0; r < 6; r++) for (let c = 0; c < 12; c++) {
    const edge = c === 0 || c === 11;
    const st = edge ? 'שמור' : chance(0.42) ? 'קבוע' : chance(0.45) ? 'מושכר' : 'פנוי';
    const s = { id: 'q' + (r * 12 + c), row: r, col: c, status: st, familyId: null, price: st === 'מושכר' ? 2400 : 0 };
    if (st === 'קבוע' || st === 'מושכר') { const f = DB.families[rn(0, FAMS - 1)]; if (!f.seat) { f.seat = s.id; s.familyId = f.id; } else s.status = 'פנוי'; }
    DB.seats.push(s);
  }
  [['05:40', 'ותיקין', 'עזרה מזרחית'], ['06:20', 'שחרית · מניין ב׳', 'האולם הגדול'], ['07:15', 'שחרית · מניין ג׳', 'האולם הגדול'],
  ['08:00', 'שיעור דף היומי', 'בית המדרש'], ['13:45', 'מנחה גדולה', 'האולם הגדול'], ['16:30', 'שיעור הלכה', 'חדר עיון'],
  ['18:52', 'שקיעה', ''], ['19:10', 'מנחה ומעריב', 'האולם הגדול'], ['20:30', 'סדר ערב', 'בית המדרש']]
    .forEach(([t, n, w], i) => DB.minyanim.push({ id: 'm' + i, time: t, name: n, where: w, count: w ? rn(18, 120) : 0 }));
  for (let i = 0; i < 9; i++) {
    const f = DB.families[rn(0, FAMS - 1)];
    DB.yahrzeits.push({ id: 'z' + i, name: (chance(0.5) ? 'ר׳ ' + pk(MALE) + ' בן ר׳ ' + pk(MALE) : 'מרת ' + pk(FEM) + ' בת ר׳ ' + pk(MALE)), day: pk(HDAY) + ' תשרי', familyId: f.id });
  }

  /* החצר — תור קבלת קהל */
  for (let i = 0; i < 14; i++) {
    const f = DB.families[rn(0, FAMS - 1)];
    DB.queue.push({ id: 'u' + i, no: 47 + i, familyId: f.id, reason: pk(['קוויטל', 'קוויטל · ברכה לרפואה', 'שידוך', 'עניין הוועד', 'בקשת הנחה', 'הודעה אישית']), state: i === 0 ? 'inside' : 'wait', mins: i === 0 ? 4 : null });
  }

  /* חסד — השלבים, הערבים והאיסורים מגיעים מהאפיון (SPEC), לא מהדמיון */
  const LFLOW = ['בקשה', 'ועדה', 'אושר', 'ניתן', 'בהחזר', 'נפרע'];
  for (let i = 0; i < 26; i++) {
    const f = DB.families[rn(0, FAMS - 1)];
    /* בקשה אחת תמיד נכנסת בלי ערבים — כדי שהכלל «הלוואה בלי שני ערבים» יהיה נראה ובדיק */
    const stage = i === 0 ? 'בקשה' : i < 5 ? LFLOW[rn(0, 1)] : i < 8 ? LFLOW[rn(2, 3)] : i < 23 ? 'בהחזר' : chance(0.5) ? 'באיחור' : 'נפרע';
    const total = rn(4, 36) * 1000;
    const inst = rn(12, 36);
    const started = ['בהחזר', 'באיחור', 'נפרע'].includes(stage);
    const l = {
      id: 'l' + i, familyId: f.id, amount: total,
      purpose: pk(['חתונה', 'הוצאות רפואיות', 'שכר לימוד', 'תיקון רכב', 'שיפוץ דירה', 'מעבר דירה', 'הוצאות חג', 'ציוד לימודי']),
      stage, guarantors: i === 0 ? 0 : stage === 'בקשה' ? rn(1, 2) : 2, installments: inst,
      paid: stage === 'נפרע' ? inst : started ? rn(1, inst - 1) : 0,
      late: stage === 'באיחור' ? rn(2, 4) : 0, days: rn(0, 14),
    };
    if (!f.loan) f.loan = l.id;
    DB.loans.push(l);
  }

  /* תפעול — קווים, נהגים מתוך הצוות, נוסעים מתוך התלמידים */
  const drivers = DB.staff.filter(s => s.role === 'נהג');
  [['קו 1 · ירושלים מרכז', [['גאולה', '07:00'], ['מאה שערים', '07:08'], ['בר אילן', '07:17'], ['רמות ג׳', '07:29'], ['המוסד', '07:45']]],
  ['קו 2 · בית שמש', [['רמב״ש א׳', '06:40'], ['רמב״ש ב׳', '06:48'], ['נהר הירדן', '06:56'], ['המוסד', '07:40']]],
  ['קו 3 · ביתר', [['גבעה א׳', '06:50'], ['גבעה ב׳', '06:58'], ['המוסד', '07:42']]],
  ['קו 4 · מודיעין עילית', [['קרית ספר', '06:45'], ['גרין פארק', '06:55'], ['המוסד', '07:38']]],
  ['קו 5 · בני ברק', [['רבי עקיבא', '06:35'], ['חזון איש', '06:44'], ['המוסד', '07:35']]],
  ['קו 6 · פנימייה · פיזור', [['המוסד', '16:10'], ['רמות', '16:32'], ['גאולה', '16:48'], ['בית שמש', '17:20']]]]
    .forEach(([name, stops], i) => {
      DB.routes.push({ id: 'r' + i, name, driver: i === 3 ? null : (drivers[i % drivers.length] || {}).id || null, stops: stops.map(([n, t]) => ({ name: n, time: t, riders: [] })), at: i < 3 ? [rn(0, stops.length - 2), R()] : null });
    });
  DB.students.forEach(st => {
    if (!chance(0.63)) return;
    const r = DB.routes[rn(0, 4)];
    const k = rn(0, r.stops.length - 2);
    st.routeId = r.id; st.stopIdx = k; r.stops[k].riders.push(st.id);
  });
  [['דוד חם לא עובד · פנימייה קומה ב׳', 'דחוף', 2], ['נזילה במטבח · מתחת לכיור', 'דחוף', 1],
  ['תאורה בחדר 14', 'רגיל', 4], ['דלת הכיתה לא ננעלת', 'רגיל', 6], ['צביעת מסדרון מזרחי', 'כשיתאפשר', 21]]
    .forEach(([t, sev, days], i) => DB.calls.push({ id: 'v' + i, text: t, sev, days, owner: i < 2 ? DB.staff.find(s => s.role === 'אחזקה').id : null }));

  /* שידוכים */
  const CRIT = ['חוג', 'לימוד אחרי החתונה', 'מגורים', 'גיל', 'השכלה', 'תמיכת ההורים', 'בריאות', 'מכרים משותפים'];
  const PSTAGES = stagesOf('שידוכים', 'הצעה');
  for (let i = 0; i < 31; i++) {
    const a = DB.families[rn(0, FAMS - 1)], b = DB.families[rn(0, FAMS - 1)];
    DB.proposals.push({
      id: 'o' + i, a: a.id, b: b.id, stage: PSTAGES[rn(0, PSTAGES.length - 1)],
      crit: CRIT.map(c => ({ k: c, ok: chance(0.82) ? 'yes' : 'part' })), days: rn(1, 60),
    });
  }

  /* תקשורת */
  [['הורי כיתה ז׳', null], ['כל ההורים', null], ['צוות חינוכי', null], ['תורמים · פרנסים', null], ['ועד ההורים', null]]
    .forEach(([n], i) => DB.groups.push({ id: 'g' + i, name: n }));
  DB.groups[0].count = DB.students.filter(s => s.classId === 'c8' || s.classId === 'c9').length;
  DB.groups[1].count = DB.families.length;
  DB.groups[2].count = DB.staff.filter(s => ['מגיד שיעור', 'מלמד', 'משגיח'].includes(s.role)).length;
  DB.groups[3].count = DB.donors.length;
  DB.groups[4].count = 9;
  [['תזכורת תשלום · כיתה ז׳', 31, 2, 'אתמול'], ['ביטול לימודים · סערה', 412, 0, 'לפני 3 ימים'], ['עלון פרשת נצבים', 388, 0, 'לפני שבוע']]
    .forEach(([t, ok, bad, when], i) => DB.messages.push({ id: 'g' + i, text: t, ok, bad, when }));

  /* יומן — נזרע בעבר, וממשיך להיכתב בכל פעולה */
  [['התקבל תשלום', 'גבייה', 'לפני 12 דק׳'], ['נפתחה בקשת הנחה', 'גבייה', 'לפני שעה'],
  ['אושרה הלוואה', 'חסד', 'אתמול'], ['שובץ מחליף לאחזקה', 'צוות', 'אתמול'],
  ['נשלחה תזכורת ל-31 הורים', 'תקשורת', 'אתמול'], ['נסגרה מגבית קמחא דפסחא', 'תרומות', 'לפני שבוע']]
    .forEach(([what, dept, when], i) => DB.log.push({ id: 'e' + i, what, dept, when, who: 'י. מלר', undo: null }));
}

/* ---------- נגזרות ---------- */
const nameOf = (pid) => { const p = DB.people.find(x => x.id === pid); return p ? p.first + ' ' + p.last : '—'; };
const person = (id) => DB.people.find(x => x.id === id);
const fam = (id) => DB.families.find(x => x.id === id);
const stu = (id) => DB.students.find(x => x.id === id);
const cls = (id) => DB.classes.find(x => x.id === id);
const staff = (id) => DB.staff.find(x => x.id === id);
const loan = (id) => DB.loans.find(x => x.id === id);
const route = (id) => DB.routes.find(x => x.id === id);
const seat = (id) => DB.seats.find(x => x.id === id);

/* חיוב משפחה — מהתעריפון, עם ההנחה הגבוהה בלבד (כלל מהאפיון) */
function charged(f) {
  const k = f.kids.length;
  const bus = f.kids.filter(id => stu(id) && stu(id).routeId).length;
  return k * TARIFF.tuition + bus * TARIFF.bus + k * TARIFF.books;
}
const discounted = (f) => Math.round(charged(f) * (1 - f.discount / 100));
const balance = (f) => discounted(f) - f.paid;

const totals = () => {
  let due = 0, paid = 0;
  DB.families.forEach(f => { due += discounted(f); paid += f.paid; });
  return { due, paid, open: due - paid, pct: due ? Math.round(paid / due * 100) : 0 };
};
const lateFamilies = () => DB.families.filter(f => balance(f) > discounted(f) * 0.45 && !f.hok);
const raised = (k) => DB.donations.filter(d => d.campaignId === k).reduce((a, d) => a + d.amount, 0);
const ambRaised = (a) => DB.donations.filter(d => d.amb === a).reduce((s, d) => s + d.amount, 0);
const budgetActual = (b) => b.months.reduce((a, m) => a + m, 0);
const budgetTotals = () => ({ plan: DB.budget.reduce((a, b) => a + b.plan, 0), actual: DB.budget.reduce((a, b) => a + budgetActual(b), 0) });
const LOAN_OPEN = ['ניתן', 'בהחזר', 'באיחור'];
const fund = () => {
  const cap = 742000;
  const live = DB.loans.filter(l => LOAN_OPEN.includes(l.stage));
  const out = live.reduce((a, l) => a + Math.round(l.amount * (1 - l.paid / l.installments)), 0);
  return { cap, out, free: cap - out, active: live.length, late: DB.loans.filter(l => l.stage === 'באיחור').length };
};
const attendanceOf = (classId) => {
  const ss = DB.students.filter(s => s.classId === classId);
  const days = ss.reduce((a, s) => a + s.att.filter(Boolean).length, 0);
  return ss.length ? Math.round(days / (ss.length * 5) * 100) : 0;
};
const presentToday = () => DB.staff.filter(s => !s.absent).length;
const ridersOf = (r) => r.stops.reduce((a, s) => a + s.riders.length, 0);

/* האפיון — 181 ישויות, 1,232 שדות. השלבים והאיסורים למטה הם שלו, לא שלי. */
function entOf(deptName, entName) {
  const d = SPEC.depts.find(x => x.n === deptName);
  return d ? d.e.find(x => x.n === entName) : null;
}
function stagesOf(deptName, entName) { const e = entOf(deptName, entName); return (e && e.st.length) ? e.st : ['נפתח', 'בטיפול', 'נסגר']; }
function forbiddenOf(deptName, entName) { const e = entOf(deptName, entName); return e ? e.fb : []; }
function momentOf(deptName, entName) { const e = entOf(deptName, entName); return e ? e.mo : ''; }
function fieldsOf(deptName, entName) { const e = entOf(deptName, entName); return e ? e.f : []; }
const specCount = () => {
  let ent = 0, fld = 0, st = 0, fb = 0;
  SPEC.depts.forEach(d => d.e.forEach(e => { ent++; fld += e.f.length; st += e.st.length; fb += e.fb.length; }));
  return { dept: SPEC.depts.length, ent, fld, st, fb, roles: SPEC.roles.length };
};

/* ---------- שינוי, ביטול, יומן ---------- */
const listeners = [];
const onChange = (fn) => listeners.push(fn);
let undoStack = [];
function act(label, dept, apply) {
  const undo = apply();
  DB.log.unshift({ id: 'e' + Date.now(), what: label, dept, when: 'עכשיו', who: ROLE.name, undo });
  if (undo) undoStack.push({ label, undo });
  listeners.forEach(f => f(label));
  return label;
}
function undoLast() {
  const u = undoStack.pop(); if (!u) return null;
  u.undo();
  const e = DB.log.find(x => x.undo === u.undo); if (e) { e.what = e.what + ' · בוטל'; e.undo = null; }
  listeners.forEach(f => f('undo'));
  return u.label;
}


/* ===== 10-ui.js ===== */
/* ===========================================================================
   כלי-התצוגה המשותפים. שלושה עקרונות:
   1. כל מספר עובר דרך kpi()/money() — ואיתו ההסבר איך הוא חושב (אין מספר «סתם»).
   2. כסף נחסם לפי תפקיד במקום אחד, לא בכל מסך.
   3. RTL: כל ערך שנקרא משמאל-לימין עטוף ב-bdi.
   =========================================================================== */

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ltr = (s) => '<bdi dir="ltr">' + esc(s) + '</bdi>';
const nis = (n) => '₪' + Math.round(n).toLocaleString('he-IL');
const money = (n) => ROLE.money ? '<bdi dir="ltr">' + nis(n) + '</bdi>' : '<span class="masked" title="הסכומים חסויים לתפקיד ' + ROLE.name + '">•••</span>';
const kmoney = (n) => ROLE.money ? '<bdi dir="ltr">₪' + Math.round(n / 1000).toLocaleString('he-IL') + 'K</bdi>' : '<span class="masked">•••</span>';
const num = (n) => '<bdi dir="ltr">' + Number(n).toLocaleString('he-IL') + '</bdi>';

/* kpi — הערך + מאיפה הוא. הכפתור פותח את החישוב עצמו. */
let DERIVE = {};
let dseq = 0;
function kpi(value, label, how) {
  const id = 'k' + (dseq++);
  DERIVE[id] = how;
  return `<span class="kpi"><b>${value}</b><button class="why" data-why="${id}" aria-label="איך חושב: ${esc(label)}">?</button><span>${esc(label)}</span></span>`;
}
function derive(id) {
  const how = DERIVE[id]; if (!how) return;
  dialog('איך המספר הזה חושב', `<p class="dtext">${how}</p>
    <p class="dnote">כל מספר במערכת נגזר מהמחסן בזמן הצגה. אין מספרים כתובים במסך.</p>`);
}

/* SVG — כל ציור מקבל תווית נגישה ומספרים אמיתיים */
function ring(pct, color, size = 104, thick = 12, label = '') {
  const r = (size - thick) / 2, c = 2 * Math.PI * r, on = Math.max(0, Math.min(100, pct)) / 100 * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label || pct + ' אחוז')}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="${thick}"></circle>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(${color})" stroke-width="${thick}" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${(c - on).toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"></circle></svg>`;
}
function spark(vals, color, label) {
  const max = Math.max(...vals), min = Math.min(...vals), w = 220, h = 60, pad = 4;
  const x = i => 4 + i * ((w - 8) / (vals.length - 1)), y = v => h - pad - (v - min) / (max - min || 1) * (h - pad * 2 - 4);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(label)}" preserveAspectRatio="none">
    <polyline fill="none" stroke="var(${color})" stroke-width="2.5" stroke-linejoin="round" points="${vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"></polyline>
    <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="3.5" fill="var(${color})"></circle></svg>`;
}
function bars(items, label) {
  const max = Math.max(...items.map(i => i[1])) || 1;
  return `<div class="ui-bars" role="img" aria-label="${esc(label)}">${items.map(([k, v, bad]) =>
    `<i class="${bad ? 'low' : ''}" style="height:${Math.max(6, v / max * 100)}%"><b>${v}</b><u>${esc(k)}</u></i>`).join('')}</div>`;
}
function progress(pct, color = '--ok') {
  return `<div class="ui-track"><i style="width:${Math.max(0, Math.min(100, pct))}%;background:var(${color})"></i></div>`;
}
const tag = (t, kind = '') => `<span class="tag ${kind}">${esc(t)}</span>`;
const link = (href, text, cls = '') => `<a class="lk ${cls}" href="#/${href}">${esc(text)}</a>`;
const empty = (msg) => `<p class="ui-empty">${esc(msg)}</p>`;
const initials = (s) => s.replace('משפחת ', '').slice(0, 2);
const colorOf = (id) => 'c' + (1 + (String(id).split('').reduce((a, ch) => a + ch.charCodeAt(0), 0) % 6));
const avatar = (text, id, size = 34) => `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size / 2.7)}px;background:var(--${colorOf(id)}-soft);color:var(--${colorOf(id)})">${esc(initials(text))}</span>`;

/* דיאלוג עם מלכודת-מיקוד ו-Esc */
let lastFocus = null;
function dialog(title, html, actions = '') {
  close();
  lastFocus = document.activeElement;
  const d = document.createElement('div');
  d.className = 'ui-dialog'; d.id = 'dlg';
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgt">
    <div class="dh"><h2 id="dlgt">${esc(title)}</h2><button class="x" aria-label="סגירה">✕</button></div>
    <div class="db">${html}</div>${actions ? `<div class="da">${actions}</div>` : ''}</div>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('.x')) close(); });
  const f = d.querySelectorAll('button,a,input,select,textarea');
  (f[1] || f[0]).focus();
  d.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); return; }
    if (e.key !== 'Tab') return;
    const list = [...d.querySelectorAll('button,a,input,select,textarea')].filter(x => !x.disabled);
    const i = list.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); list[list.length - 1].focus(); }
    else if (!e.shiftKey && i === list.length - 1) { e.preventDefault(); list[0].focus(); }
  });
  function close() { const o = document.getElementById('dlg'); if (o) o.remove(); if (lastFocus) lastFocus.focus(); }
  return close;
}

/* הודעת-פעולה עם «בטל» — כל שינוי במערכת מקבל אחת */
let toastT = null;
function toast(msg, undoable = true) {
  const old = document.getElementById('toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast'; t.className = 'ui-toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undoable ? '<button id="undoBtn">בטל</button>' : ''}`;
  document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 7000);
  const b = document.getElementById('undoBtn');
  if (b) b.onclick = () => { const l = undoLast(); t.remove(); if (l) toast('בוטל: ' + l, false); };
}

/* חסימה לפי כלל מהאפיון — הטקסט הוא של המוסד, לא שלי */
function blocked(rule, dept, ent) {

    והמערכת קוראת אותו משם — הוא לא נכתב בקוד המסך.</p>`);
}

const sortBy = (arr, f, dir = 1) => [...arr].sort((a, b) => (f(a) > f(b) ? 1 : f(a) < f(b) ? -1 : 0) * dir);

        const n = p.first + ' ' + p.last;

      }).map(p => ({ p, name: p.first + ' ' + p.last, kind: p.kind, city: p.city, tieO: tie(p) }))
        .sort((a, b) => (a[AN.key] > b[AN.key] ? 1 : a[AN.key] < b[AN.key] ? -1 : 0) * AN.dir);
    };
    const paint = () => {
      const v = view(), pages = Math.max(1, Math.ceil(v.length / AN.per));
      AN.page = Math.min(Math.max(1, AN.page), pages);
      const slice = v.slice((AN.page - 1) * AN.per, AN.page * AN.per);
      holder.classList.toggle('empty', !v.length);
      cnt.innerHTML = v.length ? `${num(v.length)} · עמוד ${AN.page} מתוך ${pages}` : '0 רשומות';
      tb.innerHTML = slice.map(r => `<tr data-id="${r.p.id}">
        <td><span class="nmc">${avatar(r.name, r.p.id, 36)}<span>${r.tieO.href
          ? `<a class="lk" href="${r.tieO.href}">${esc(r.name)}</a>` : `<b>${esc(r.name)}</b>`}
          ${r.p.left ? `<span class="sub">עזב · ${esc(r.p.left)}</span>` : ''}</span></span></td>
        <td>${tag(r.kind)}</td><td>${esc(r.city)}</td><td>${esc(r.tieO.t)}</td>
        <td class="e">${r.tieO.bal > 0 ? money(r.tieO.bal) : '<span class="sub">—</span>'}</td>
        <td class="e">${r.p.left ? '<span class="sub">ארכיון</span>'
          : `<button class="gh sm" type="button" data-go="${r.p.id}">סימון «עזב»</button>`}</td></tr>`).join('');
      /* עימוד מקוצר */
      const set = { 1: 1, 2: 1 }; set[pages] = 1; set[pages - 1] = 1;
      for (let i = AN.page - 1; i <= AN.page + 1; i++) if (i >= 1 && i <= pages) set[i] = 1;
      let last = 0;
      const out = [`<button type="button" id="prev"${AN.page === 1 ? ' disabled' : ''} aria-label="הקודם">‹</button>`];
      Object.keys(set).map(Number).filter(n => n >= 1 && n <= pages).sort((a, b) => a - b).forEach(n => {
        if (last && n > last + 1) out.push('<span class="gap">…</span>');
        out.push(`<button type="button" data-p="${n}"${n === AN.page ? ' aria-current="page"' : ''}>${n}</button>`);
        last = n;
      });
      out.push(`<button type="button" id="next"${AN.page === pages ? ' disabled' : ''} aria-label="הבא">›</button>`);
      pg.innerHTML = out.join('');
      /* שחזור מיקוד אחרי ש-act() בנה את המסך מחדש */
      if (AN.focus != null) {
        const rows = tb.children;
        let t = null;
        if (rows.length) {
          const i = Math.min(AN.focus, rows.length - 1);
          for (let k = i; k >= 0 && !t; k--) t = rows[k].querySelector('[data-go]');
          for (let k = i; k < rows.length && !t; k++) t = rows[k].querySelector('[data-go]');
        }
        (t || document.getElementById('q')).focus();
        AN.focus = null;
      }
    };
    /* המצב ה-14 של אטלסיאן: המיקום נקרא לפני שהשורה יוצאת */
    const leave = (id, btn) => {
      const tr = btn.closest('tr');
      AN.focus = Array.prototype.indexOf.call(tb.children, tr);
      const p = DB.people.find(x => x.id === id);
      const nm = p.first + ' ' + p.last;
      act('סומן «עזב» · ' + nm, 'אנשים', () => {
        const was = p.left || null;
        p.left = DB.today.hd + ' ' + DB.today.hy;
        return () => { p.left = was; };
      });
      toast('סומן «עזב» · ' + nm);
    };
    document.getElementById('q').addEventListener('input', e => { AN.q = e.target.value; AN.page = 1; paint(); });
    document.getElementById('kf').addEventListener('change', e => { AN.kind = e.target.value; AN.page = 1; paint(); });
    document.getElementById('showLeft').addEventListener('click', function () {
      AN.left = !AN.left; this.setAttribute('aria-pressed', String(AN.left));
      this.textContent = AN.left ? 'הסתרת מי שעזב' : 'הצגת מי שעזב'; AN.page = 1; paint();
    });
    document.querySelector('thead').addEventListener('click', e => {
      const th = e.target.closest('th.srt'); if (!th) return;
      const k = th.dataset.s;
      if (AN.key === k) AN.dir = -AN.dir; else { AN.key = k; AN.dir = 1; }
      AN.page = 1; syncSort(); paint();
    });
    tb.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) leave(b.dataset.go, b); });
    pg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.id === 'prev') AN.page--; else if (b.id === 'next') AN.page++; else AN.page = +b.dataset.p;
      paint(); document.getElementById('app').scrollIntoView({ block: 'start' });
    });
    const syncSort = () => {
      document.querySelectorAll('th.srt').forEach(x => { x.removeAttribute('aria-sort'); x.querySelector('.ar').textContent = '▾'; });
      const th = document.querySelector(`th[data-s="${AN.key}"]`);
      if (th) { th.setAttribute('aria-sort', AN.dir > 0 ? 'ascending' : 'descending'); th.querySelector('.ar').textContent = AN.dir > 0 ? '▾' : '▴'; }
    };
    syncSort(); paint();
  },
};

        const bd = document.getElementById('bd'), open = bd.hidden;
        bd.hidden = !open; e.currentTarget.setAttribute('aria-expanded', String(open));
      };
      document.getElementById('changeFam').onclick = () => { q.focus(); q.value = 'משפחת'; search(); };
      document.getElementById('payBtn').onclick = () => {
        const sum = Math.min(balance(f), 2000);
        if (sum <= 0) { blocked('יתרה שלילית', 'גבייה', 'חיוב'); return; }
        act('נרשם תשלום ' + nis(sum) + ' · ' + f.name, 'גבייה', () => {
          const before = f.paid; f.paid += sum;
          DB.payments.unshift({ id: 'y' + Date.now(), familyId: f.id, amount: sum, method: 'אשראי', ago: 0 });
          return () => { f.paid = before; DB.payments.shift(); };
        });
        toast('נרשם תשלום ' + nis(sum) + ' למשפחת ' + f.name.replace('משפחת ', ''));
      };
    };

    const search = () => {
      const v = q.value.trim(), kind = document.getElementById('kind').value;
      if (!v) { results.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
      let list = [];
      if (kind !== 'תשלום') list = list.concat(DB.families.filter(f => f.name.includes(v) || f.city.includes(v) || String(Math.round(balance(f))).includes(v)).slice(0, 8).map(f => ({ f })));
      if (kind !== 'משפחה') list = list.concat(DB.payments.filter(p => fam(p.familyId).name.includes(v)).slice(0, 4).map(p => ({ p })));
      results.hidden = !list.length; q.setAttribute('aria-expanded', String(!!list.length));
      hits.innerHTML = list.map((x, i) => x.f
        ? `<li role="option" id="hit${i}" aria-selected="${i === 0}" data-fam="${x.f.id}">${avatar(x.f.name, x.f.id)}
            <span><span class="t">${esc(x.f.name)}</span><br><span class="s">${esc(x.f.city)} · ${x.f.kids.length} ילדים</span></span>
            <span class="num">${money(balance(x.f))}</span></li>`
        : `<li role="option" id="hit${i}" aria-selected="false" data-pay="${x.p.id}">${avatar(fam(x.p.familyId).name, x.p.familyId)}
            <span><span class="t">תשלום · ${esc(x.p.method)}</span><br><span class="s">${esc(fam(x.p.familyId).name)}</span></span>
            <span class="num">${money(x.p.amount)}</span></li>`).join('');
      const first = list[0];
      document.getElementById('detail').innerHTML = first && first.f ? detailOf(first.f) : '<div class="none">בחר תוצאה</div>';
      if (list.length) q.setAttribute('aria-activedescendant', 'hit0');
    };
    const detailOf = (f) => `<h3>${esc(f.name)}</h3><p class="s">${esc(f.city)} · ${esc(f.phone)}</p>
      <dl class="dl"><div><dt>חיוב אחרי הנחה</dt><dd>${money(discounted(f))}</dd></div>
      <div><dt>שולם</dt><dd>${money(f.paid)}</dd></div>
      <div><dt>יתרה</dt><dd>${money(balance(f))}</dd></div>
      <div><dt>הוראת קבע</dt><dd>${f.hok ? 'פעילה' : 'אין'}</dd></div></dl>
      <div class="acts"><button class="btn pri" data-open="${f.id}">בחר לחישוב</button>
        <a class="btn" href="#/family/${f.id}">תיק מלא</a></div>`;

    q.addEventListener('input', search);
    document.getElementById('kind').addEventListener('change', search);
    q.addEventListener('keydown', e => {
      const rows = [...hits.querySelectorAll('li')];
      if (!rows.length) return;
      let i = rows.findIndex(r => r.getAttribute('aria-selected') === 'true');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        i = (i + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
        rows.forEach((r, k) => r.setAttribute('aria-selected', String(k === i)));
        q.setAttribute('aria-activedescendant', rows[i].id);
        const f = fam(rows[i].dataset.fam); if (f) document.getElementById('detail').innerHTML = detailOf(f);
      } else if (e.key === 'Enter' && rows[i] && rows[i].dataset.fam) {
        famSel = fam(rows[i].dataset.fam); q.value = ''; search(); calc();
      }
    });
    document.getElementById('results').addEventListener('click', e => {
      const b = e.target.closest('[data-open]'); if (b) { famSel = fam(b.dataset.open); q.value = ''; search(); calc(); return; }
      const li = e.target.closest('[data-fam]'); if (li) { const f = fam(li.dataset.fam); document.getElementById('detail').innerHTML = detailOf(f); }
    });
    calc();
  },
};

      if (!f) { blocked('רישום בלי זיהוי מבקש', 'החצר', 'קבלת קהל'); return; }
      const no = Math.max(...DB.queue.map(q => q.no)) + 1;
      act('נוסף לתור · ' + f.name, 'החצר', () => {
        DB.queue.push({ id: 'u' + Date.now(), no, familyId: f.id, reason: document.getElementById('in-kind').value, state: 'wait', mins: null });
        return () => DB.queue.pop();
      });
      toast(f.name + ' נוספה לתור · מספר ' + no);
    };
    document.getElementById('q').addEventListener('click', e => {
      const b = e.target.closest('[data-in]'); if (!b) return;
      const q = DB.queue.find(x => x.id === b.dataset.in);
      const prev = DB.queue.find(x => x.state === 'inside');
      act('הוכנס · ' + fam(q.familyId).name, 'החצר', () => {
        const before = prev && prev.state;
        if (prev) prev.state = 'done';
        q.state = 'inside'; q.mins = 0;
        return () => { q.state = 'wait'; q.mins = null; if (prev) prev.state = before; };
      });
      toast(fam(q.familyId).name + ' נכנס');
    });
  },
};

function lineSvg(r) {
  const W = 760, pad = 64, y = 64, step = (W - pad * 2) / Math.max(1, r.stops.length - 1);
  const x = k => W - pad - k * step;
  const c = colorOf(r.id);
  let s = `<svg viewBox="0 0 ${W} 132" role="img" aria-label="${esc(r.name)}: ${r.stops.map(st => st.name + ' ב-' + st.time).join(', ')}">
    <line x1="${x(0)}" y1="${y}" x2="${x(r.stops.length - 1)}" y2="${y}" stroke="var(--${c})" stroke-width="7" stroke-linecap="round"></line>`;
  r.stops.forEach((st, k) => {
    const last = k === r.stops.length - 1;
    s += `<circle cx="${x(k)}" cy="${y}" r="${last ? 10 : 7}" fill="var(--card)" stroke="var(--${c})" stroke-width="4"></circle>
      <text x="${x(k)}" y="${y - 22}" text-anchor="middle">${esc(st.name)}</text>
      <text class="t2" x="${x(k)}" y="${y + 30}" text-anchor="middle" dir="ltr">${esc(st.time)}</text>` +
      (st.riders.length ? `<text class="t3" x="${x(k)}" y="${y + 46}" text-anchor="middle" fill="var(--${c})">${st.riders.length} נוסעים</text>` : '');
  });
  if (r.at) {
    const bx = x(r.at[0]) - step * r.at[1];
    s += `<g transform="translate(${bx.toFixed(1)},${y})"><rect x="-15" y="-13" width="30" height="26" rx="7" fill="var(--${c})"></rect>
      <text x="0" y="5" text-anchor="middle" fill="var(--on-acc)" style="font-size:13px">🚌</text></g>`;
  }
  return s + '</svg>';
}

      const filled = s.replace('{שם}', f0.name).replace('{סכום}', nis(balance(f0))).replace('{שנה}', DB.tariff.year)
        .replace('{כיתה}', cls(stu(f0.kids[0]) ? stu(f0.kids[0]).classId : 'c0').name).replace('{קישור}', 'mosad.link/p/' + f0.id);
      document.getElementById('sample').innerHTML = `<h3>דוגמה אמיתית · ${esc(f0.name)}</h3><p>${esc(filled)}</p>`;
    };
    txt.addEventListener('input', paint);
    document.querySelectorAll('.grp').forEach(c => c.addEventListener('change', paint));
    document.getElementById('tpl').addEventListener('change', e => { txt.value = TPL[+e.target.value][1]; paint(); });
    document.querySelectorAll('.vars button').forEach(b => b.onclick = () => {
      const p = txt.selectionStart ?? txt.value.length;
      txt.value = txt.value.slice(0, p) + b.dataset.v + txt.value.slice(txt.selectionEnd ?? p);
      txt.focus(); txt.selectionStart = txt.selectionEnd = p + b.dataset.v.length; paint();
    });
    document.getElementById('sendBtn').onclick = () => {
      const n = +document.getElementById('rcpt').textContent;
      if (!n) { blocked('שליחה בלי נמענים', 'תקשורת', 'הודעה'); return; }
      act('נשלחה הודעה ל-' + n + ' נמענים', 'תקשורת', () => {
        DB.messages.unshift({ id: 'g' + Date.now(), text: txt.value.slice(0, 40) + '…', ok: n, bad: 0, when: 'עכשיו' });
        return () => DB.messages.shift();
      });
      toast('נשלח ל-' + n + ' נמענים (דוגמה)');
    };
    document.getElementById('shabbat').onclick = () =>
      blocked('שליחה בשבת/חג (תזמון אוטומטי למוצאי)', 'תקשורת', 'הודעה');
    paint();
  },
};

      <header class="dhead">
        ${avatar(f.name, f.id, 64)}
        <div class="who"><h1>${esc(f.name)}</h1>
          <p>${esc(f.city)} · ${ltr(f.phone)} · ${esc(nameOf(f.head))} ו${esc(nameOf(f.spouse))}</p></div>
        <div class="dstats">
          ${kpi(k, 'ילדים במוסד', 'תלמידים שה-familyId שלהם הוא ' + f.id + '.')}

          ${kpi(f.hok ? 'פעילה' : 'אין', 'הוראת קבע', 'שדה hok ברשומת המשפחה.')}
          ${kpi(loans.length, 'הלוואות', 'רשומות גמ״ח שמקושרות למשפחה.')}
        </div>
      </header>

      <nav class="dtabs" aria-label="מעבר בתיק">
        <a href="#money">גבייה</a><a href="#kids">חינוך</a><a href="#hall">בית המדרש</a>
        <a href="#hesed">חסד</a><a href="#give">תרומות</a><a href="#more">עוד</a>
      </nav>

      ${sec('חיוב ותשלומים', 'גבייה', `<div id="money" class="two2">
        <table class="mini"><caption>מאיפה מגיע החיוב</caption><tbody>
          ${rows.map(r => `<tr class="${r[1] < 0 ? 'minus' : ''}"><th scope="row">${esc(r[0])}</th>
            <td class="n">${r[1] < 0 ? '−' : ''}${money(Math.abs(r[1]))}</td></tr>`).join('')}
          <tr class="tot"><th scope="row">נותר לתשלום</th><td class="n">${money(balance(f))}</td></tr>
        </tbody></table>
        <div><h3>תשלומים אחרונים</h3>
          ${pays.length ? `<ul class="mlist">${pays.slice(0, 6).map(p => `<li><span>${esc(p.method)}</span>
            <span class="n">${money(p.amount)}</span><span class="ago">לפני ${p.ago} ימים</span></li>`).join('')}</ul>` : empty('אין תשלומים רשומים')}
          <div class="dacts"><button class="btn pri" data-pay="${f.id}">רישום תשלום ${money(1000)}</button>
            <button class="btn" data-disc="${f.id}">הגדלת הנחה ב-10%</button></div></div>
      </div>`)}

      ${sec('ילדים וכיתות', 'חינוך', `<div id="kids" class="kidcards">
        ${kids.map(s => `<a class="kidcard" href="#/student/${s.id}">
          ${avatar(nameOf(s.personId), s.id, 40)}
          <div><b>${esc(nameOf(s.personId))}</b><span>${esc(cls(s.classId).name)} · ${esc(cls(s.classId).room)}</span>
          <span>נוכחות ${s.att.filter(Boolean).length}/5 ${s.routeId ? '· ' + esc(route(s.routeId).name.split(' · ')[0]) : '· בלי הסעה'}</span></div>
        </a>`).join('') || empty('אין ילדים רשומים')}</div>`)}

      ${sec('מקום וזכרונות', 'בית המדרש', `<div id="hall" class="two2">
        <div>${st ? `<p class="big2">שורה ${['א', 'ב', 'ג', 'ד', 'ה', 'ו'][st.row]} · מקום ${st.col + 1}</p>
          <p class="s">${esc(st.status)}${st.price ? ' · ' + money(st.price) + ' לשנה' : ''}</p>
          <a class="btn" href="#/medrash/${st.id}">הצגה במפה</a>` : empty('אין מקום קבוע')}</div>
        <div>${yz.length ? `<h3>יארצייטים</h3><ul class="mlist">${yz.map(y => `<li><span>${esc(y.name)}</span><span class="ago">${esc(y.day)}</span></li>`).join('')}</ul>` : empty('אין יארצייטים רשומים')}</div>
      </div>`)}

      ${sec('גמ״ח', 'חסד', `<div id="hesed">${loans.length ? `<ul class="mlist">${loans.map(l => `<li>
        <span><a class="lk" href="#/loanp/${l.id}">${esc(l.purpose)}</a> · ${esc(l.stage)}</span>
        <span class="n">${money(l.amount)}</span>
        <span class="ago">${l.paid ? l.paid + '/' + l.installments + ' תשלומים' : l.guarantors + '/2 ערבים'}</span></li>`).join('')}</ul>`
        : empty('אין הלוואות')}</div>`)}

      ${sec('תרומות', 'תרומות', `<div id="give">${don.length ? `<ul class="mlist">${don.slice(0, 5).map(d => `<li>
        <span>${esc(DB.campaigns.find(c => c.id === d.campaignId).name)}</span><span class="n">${money(d.amount)}</span>
        <span class="ago">${esc(d.method)}</span></li>`).join('')}</ul>
        <p class="s">סך הכל ${money(don.reduce((a, d) => a + d.amount, 0))} · ${link('donorp/' + f.donor, 'כרטיס התורם')}</p>`
        : empty('המשפחה אינה רשומה כתורמת')}</div>`)}

      ${sec('עוד מהמוסד', 'החצר · שידוכים · תקשורת', `<div id="more" class="two2">
        <div><h3>קבלת קהל</h3>${visits.length ? `<ul class="mlist">${visits.map(v => `<li><span>${ROLE.kvittel ? esc(v.reason) : 'חסוי'}</span>
          <span class="ago">${v.state === 'inside' ? 'בפנים' : 'ממתין · מספר ' + v.no}</span></li>`).join('')}</ul>` : empty('אין ביקורים פתוחים')}</div>
        <div><h3>שידוכים</h3>${props.length ? (ROLE.views === '*' || ROLE.views.includes('shiduch')
        ? `<ul class="mlist">${props.map(p => `<li><a class="lk" href="#/shiduch/${p.id}">הצעה · ${esc(p.stage)}</a>
            <span class="ago">${p.days} ימים</span></li>`).join('')}</ul>`
        : `<p class="s masked">${props.length} הצעות · חסוי בתפקיד ${esc(ROLE.name)}</p>`) : empty('אין הצעות')}</div>
      </div>`)}

      <section class="dsec"><h2>יומן התיק<span class="dep">נגזר</span></h2>

          ${pays.slice(0, 3).map(p => `<li><b>תשלום ${money(p.amount)}</b><span>${esc(p.method)} · לפני ${p.ago} ימים</span></li>`).join('')}

        </ol></section>
    </div>`;
  },
  mount([id]) {
    const f = fam(id) || DB.families[0];
    document.querySelector('.dossier').addEventListener('click', (e) => {
      const p = e.target.closest('[data-pay]'), d = e.target.closest('[data-disc]');
      if (!p && !d) return;
      if (p) {
        if (balance(f) <= 0) { blocked('יתרה שלילית', 'גבייה', 'חיוב'); return; }
        act('נרשם תשלום ' + nis(1000) + ' · ' + f.name, 'גבייה', () => {
          f.paid += 1000; DB.payments.unshift({ id: 'y' + Date.now(), familyId: f.id, amount: 1000, method: 'אשראי', ago: 0 });
          return () => { f.paid -= 1000; DB.payments.shift(); };
        });
        toast('נרשם תשלום של ' + nis(1000));
      } else {
        /* «הנחות מצטברות (הגבוהה בלבד)» — כלל מהאפיון: לא מחברים, בוחרים את הגבוהה */
        const next = Math.max(f.discount, f.discount + 10 > 35 ? 35 : f.discount + 10);
        if (next === f.discount) { blocked('הנחות מצטברות (הגבוהה בלבד)', 'גבייה', 'חיוב'); return; }
        const before = f.discount;
        act('הנחה ' + before + '% ← ' + next + '% · ' + f.name, 'גבייה', () => { f.discount = next; return () => { f.discount = before; }; });
        toast('ההנחה עודכנה ל-' + next + '%');
      }
    });
  },
};

    const p = DB.people.find(x => x.id === id) || DB.people[0];
    if (p.familyId) return VIEWS.family.render([p.familyId]);
    if (p.donorId) return VIEWS.donorp.render([p.donorId]);
    const s = DB.staff.find(x => x.personId === p.id);
    if (s) return VIEWS.staffp.render([s.id]);
    return `<div class="dossier"><header class="dhead">${avatar(p.first + ' ' + p.last, p.id, 64)}
      <div class="who"><h1>${esc(p.first + ' ' + p.last)}</h1><p>${esc(p.city)}</p></div></header></div>`;
  },
};

/* -------------------------------------------------------------- יומן --- */
VIEWS.log = {
  name: 'יומן פעולות',
  render() {
    return `<div class="pad narrow">
      <h1>יומן פעולות</h1>
      <p class="s">כל שינוי במערכת נרשם כאן עם מי, מה ומתי — וניתן לביטול כל עוד לא נדרס.</p>
      <ol class="logl">${DB.log.map(e => `<li><span class="w">${esc(e.what)}</span>
        <span class="d">${esc(e.dept)}</span><span class="t">${esc(e.when)} · ${esc(e.who)}</span>
        ${e.undo ? `<button class="btn" data-undo="${e.id}">בטל</button>` : '<span class="done">—</span>'}</li>`).join('')}</ol>
    </div>`;
  },
  mount() {
    document.querySelector('.logl').addEventListener('click', e => {
      const b = e.target.closest('[data-undo]'); if (!b) return;
      const entry = DB.log.find(x => x.id === b.dataset.undo); if (!entry || !entry.undo) return;
      entry.undo(); entry.what += ' · בוטל'; entry.undo = null;
      listeners.forEach(f => f('undo'));
      toast('הפעולה בוטלה', false);
    });
  },
};

/* ------------------------------------------------------------ האפיון --- */
VIEWS.spec = {
  name: 'האפיון',
  render() {
    const c = specCount();
    return `<div class="pad narrow">
      <h1>האפיון של המוסד</h1>
      <p class="s">${c.dept} אגפים · ${c.ent} ישויות · ${num(c.fld)} שדות · ${c.st} שלבים · ${c.fb} איסורים · ${c.roles} תפקידים.
        המסכים קוראים מכאן את השלבים, הכללים והשדות — זה לא תיעוד, זו המערכת.</p>
      <input id="sq" type="search" placeholder="חיפוש ישות או שדה…" aria-label="חיפוש באפיון">
      <div id="spec"></div></div>`;
  },
  mount() {
    const paint = () => {
      const q = (document.getElementById('sq').value || '').trim();
      document.getElementById('spec').innerHTML = SPEC.depts.map(d => {
        const ents = d.e.filter(e => !q || e.n.includes(q) || e.f.some(f => f[0].includes(q)));
        if (!ents.length) return '';
        return `<section class="specd"><h2>${esc(d.n)}<span>${ents.length} ישויות</span></h2>
          ${ents.map(e => `<details class="spece"><summary>${esc(e.n)}
            <span>${e.f.length} שדות${e.st.length ? ' · ' + e.st.length + ' שלבים' : ''}${e.fb.length ? ' · ' + e.fb.length + ' איסורים' : ''}</span></summary>
            ${e.mo ? `<p class="mo">${esc(e.mo)}</p>` : ''}
            ${e.st.length ? `<ol class="flow">${e.st.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
            ${e.fb.length ? `<ul class="rulelist">${e.fb.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
            <div class="fieldgrid">${e.f.map(f => `<span class="fld">${esc(f[0])}<i>${esc(f[1] || '')}${f[2] ? ' · חובה' : ''}</i></span>`).join('')}</div>
          </details>`).join('')}</section>`;
      }).join('');
    };
    document.getElementById('sq').addEventListener('input', paint);
    paint();
  },
};


/* ===== 90-shell.js ===== */
/* ===========================================================================
   השלד — ניווט, תפקידים, פלטת-פקודות, ביטול, יומן.
   כל מסך הוא פונקציה שמחזירה HTML; השלד מחליף אותם בלי טעינה מחדש.
   =========================================================================== */

/* עשרת התפקידים הם של האפיון (SPEC.roles). המדיניות אומרת מה כל אחד רואה. */
const POLICY = {
  'מנהל כללי': { money: 1, kvittel: 1, views: '*' },
  'מזכירות': { money: 1, kvittel: 0, views: ['bait', 'anashim', 'hinuch', 'tzevet', 'hatzer', 'tikshor'] },
  'גזבר': { money: 1, kvittel: 0, views: ['bait', 'gviya', 'ksafim', 'trumot', 'hesed', 'anashim'] },
  'מגייס': { money: 1, kvittel: 0, views: ['bait', 'trumot', 'anashim', 'tikshor'] },
  'מלמד': { money: 0, kvittel: 0, views: ['bait', 'hinuch', 'anashim', 'medrash'] },
  'גבאי': { money: 1, kvittel: 1, views: ['bait', 'medrash', 'hatzer', 'anashim'] },
  'ועדת חסד': { money: 1, kvittel: 0, views: ['bait', 'hesed', 'anashim'] },
  'אב בית': { money: 0, kvittel: 0, views: ['bait', 'tifol', 'tzevet', 'medrash'] },
  'שדכן': { money: 0, kvittel: 0, views: ['bait', 'shiduch', 'anashim'] },
  'רואה חשבון': { money: 1, kvittel: 0, views: ['bait', 'ksafim', 'gviya', 'trumot'] },
};
let ROLE = { name: 'מנהל כללי', money: 1, kvittel: 1, views: '*' };
const allowed = (v) => ROLE.views === '*' || ROLE.views.includes(v) || DOSSIERS.includes(v);
const DOSSIERS = ['family', 'person', 'student', 'staffp', 'loanp', 'donorp', 'log', 'spec'];

const NAV = [
  ['bait', 'בית', '🏛'], ['anashim', 'אנשים', '👥'], ['hinuch', 'חינוך', '📚'], ['tzevet', 'צוות', '🧰'],
  ['gviya', 'גבייה', '₪'], ['trumot', 'תרומות', '❤'], ['ksafim', 'כספים', '📊'], ['medrash', 'בית המדרש', '🕯'],
  ['hatzer', 'החצר', '👑'], ['hesed', 'חסד', '🤝'], ['tifol', 'תפעול', '🔧'], ['shiduch', 'שידוכים', '💍'], ['tikshor', 'תקשורת', '✉'],
];

const parse = () => {
  const h = (location.hash || '#/bait').slice(2).split('/').filter(Boolean);
  return { view: h[0] || 'bait', params: h.slice(1) };
};
const go = (path) => { location.hash = '#/' + path; };

function chrome() {
  return `<a class="skip" href="#main">דלג לתוכן</a>
  <header class="topbar">
    <a class="brand" href="#/bait"><span class="mark">מוסד</span></a>
    <button class="find" id="openPal"><span aria-hidden="true">⌕</span> חיפוש בכל המוסד <kbd>Ctrl K</kbd></button>
    <nav class="tabs" id="tabs" aria-label="אגפים"></nav>
    <div class="tools">
      <label class="sel"><span class="sr">תפקיד</span>
        <select id="role">${SPEC.roles.map(r => `<option${r === ROLE.name ? ' selected' : ''}>${r}</option>`).join('')}</select></label>
      <button id="logBtn" class="tbtn" aria-label="יומן פעולות">יומן</button>
      <button id="dens" class="tbtn" aria-label="צפיפות">צפיפות</button>
      <div class="themeSw" role="group" aria-label="ערכת צבע">
        <button data-theme="light" aria-pressed="false"><i aria-hidden="true">☀</i>בהיר</button>
        <button data-theme="dark" aria-pressed="false"><i aria-hidden="true">🌙</i>כהה</button>
        <button data-theme="" aria-pressed="true"><i aria-hidden="true">◐</i>אוטומטי</button>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="pal" class="pal" hidden>
    <div class="palbox" role="dialog" aria-modal="true" aria-label="חיפוש בכל המוסד">
      <input id="palq" type="search" placeholder="שם משפחה · תלמיד · עובד · תורם · הלוואה · מסך · פעולה…"
             role="combobox" aria-expanded="true" aria-controls="palr" aria-autocomplete="list" autocomplete="off">
      <ul id="palr" role="listbox" aria-label="תוצאות"></ul>
      <p class="palfoot">↑↓ לבחירה · Enter לפתיחה · Esc לסגירה</p>
    </div>
  </div>`;
}

function tabs() {
  const cur = parse().view;
  document.getElementById('tabs').innerHTML = NAV.filter(([id]) => allowed(id))
    .map(([id, n, e]) => `<a href="#/${id}"${id === cur ? ' aria-current="page"' : ''}><i aria-hidden="true">${e}</i>${n}</a>`).join('');
}

let lastRoute = '';
function render() {
  const { view, params } = parse();
  const same = location.hash === lastRoute; lastRoute = location.hash;
  const keepY = window.scrollY;
  const app = document.getElementById('app');
  const v = VIEWS[view];
  if (!v) { app.dataset.v = 'x'; app.innerHTML = `<div class="pad"><h1>לא נמצא</h1><p class="ui-empty">אין מסך בשם «${esc(view)}».</p></div>`; return; }
  if (!allowed(view)) {
    app.dataset.v = 'x';
    app.innerHTML = `<div class="pad"><h1>${esc(v.name)}</h1>
      <div class="deny"><p><b>אין לך גישה למסך הזה בתפקיד «${esc(ROLE.name)}».</b></p>
      <p>המדיניות מגיעה מרשימת התפקידים של האפיון. החלף תפקיד בסרגל העליון כדי לראות.</p>
      <p class="dnote">מותר בתפקיד הזה: ${ROLE.views === '*' ? 'הכל' : ROLE.views.map(x => (NAV.find(n => n[0] === x) || [, x])[1]).join(' · ')}</p></div></div>`;
    return;
  }
  DERIVE = {}; dseq = 0;
  app.dataset.v = view;
  app.innerHTML = v.render(params);
  document.title = v.name + ' — מוסד';
  if (v.mount) v.mount(params);
  tabs();
  if (same) { window.scrollTo(0, keepY); }
  else { const h = app.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } window.scrollTo(0, 0); }
}

/* ---------- פלטת-הפקודות: מחפשת בכל הישויות, לא רק בשמות-מסכים ---------- */
let INDEX = null, palSel = 0, palRows = [];
function buildIndex() {
  if (INDEX) return INDEX;
  INDEX = [];
  NAV.forEach(([id, n]) => INDEX.push({ t: n, s: 'מסך', go: id, k: n }));
  INDEX.push({ t: 'יומן הפעולות', s: 'מסך', go: 'log', k: 'יומן' });
  INDEX.push({ t: 'האפיון · 181 ישויות', s: 'מסך', go: 'spec', k: 'אפיון ישויות שדות' });
  DB.families.forEach(f => INDEX.push({ t: f.name, s: f.city + ' · ' + f.kids.length + ' ילדים', go: 'family/' + f.id, k: f.name + ' ' + f.city }));
  DB.staff.forEach(s => INDEX.push({ t: nameOf(s.personId), s: 'צוות · ' + s.role, go: 'staffp/' + s.id, k: nameOf(s.personId) + ' ' + s.role }));
  DB.students.forEach(s => INDEX.push({ t: nameOf(s.personId), s: 'תלמיד · ' + cls(s.classId).name, go: 'student/' + s.id, k: nameOf(s.personId) }));
  DB.loans.forEach(l => INDEX.push({ t: 'הלוואה · ' + fam(l.familyId).name, s: l.purpose + ' · ' + l.stage, go: 'loanp/' + l.id, k: fam(l.familyId).name + ' הלוואה ' + l.purpose }));
  DB.donors.slice(0, 60).forEach(d => INDEX.push({ t: nameOf(d.personId), s: 'תורם · ' + d.city, go: 'donorp/' + d.id, k: nameOf(d.personId) + ' תורם' }));
  DB.routes.forEach(r => INDEX.push({ t: r.name, s: 'קו הסעה · ' + ridersOf(r) + ' נוסעים', go: 'tifol/' + r.id, k: r.name + ' הסעה' }));
  DB.classes.forEach(c => INDEX.push({ t: 'כיתה ' + c.name, s: c.students.length + ' תלמידים', go: 'hinuch/' + c.id, k: 'כיתה ' + c.name }));
  return INDEX;
}
function palOpen() {
  buildIndex();
  const p = document.getElementById('pal'); p.hidden = false;
  const q = document.getElementById('palq'); q.value = ''; palSearch(''); q.focus();
}
function palClose(restore = true) { document.getElementById('pal').hidden = true; if (restore) document.getElementById('openPal').focus(); }
function palSearch(t) {
  const q = t.trim();
  palRows = !q ? INDEX.filter(r => r.s === 'מסך').slice(0, 9)
    : INDEX.filter(r => r.k.includes(q)).slice(0, 40);
  palSel = 0;
  document.getElementById('palr').innerHTML = palRows.length
    ? palRows.map((r, i) => `<li role="option" id="pr${i}" aria-selected="${i === palSel}" data-go="${r.go}">
        <span class="t">${esc(r.t)}</span><span class="s">${esc(r.s)}</span></li>`).join('')
    : `<li class="none">אין תוצאה ל«${esc(q)}» מתוך ${num(INDEX.length)} רשומות</li>`;
  document.getElementById('palq').setAttribute('aria-activedescendant', palRows.length ? 'pr0' : '');
}
function palMove(d) {
  if (!palRows.length) return;
  palSel = (palSel + d + palRows.length) % palRows.length;
  const rows = [...document.querySelectorAll('#palr li')];
  rows.forEach((r, i) => r.setAttribute('aria-selected', String(i === palSel)));
  rows[palSel].scrollIntoView({ block: 'nearest' });
  document.getElementById('palq').setAttribute('aria-activedescendant', 'pr' + palSel);
}

/* ---------- אתחול ---------- */
function boot() {
  build();
  document.body.insertAdjacentHTML('afterbegin', chrome());
  const root = document.documentElement;

  document.getElementById('openPal').onclick = palOpen;
  document.getElementById('palq').addEventListener('input', e => palSearch(e.target.value));
  document.getElementById('palq').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); palMove(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palMove(-1); }
    else if (e.key === 'Enter' && palRows[palSel]) { e.preventDefault(); go(palRows[palSel].go); palClose(false); }
    else if (e.key === 'Escape') palClose();
  });
  document.getElementById('pal').addEventListener('click', e => {
    const li = e.target.closest('[data-go]'); if (li) { go(li.dataset.go); palClose(false); }
    else if (e.target.id === 'pal') palClose();
  });
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('pal').hidden ? palOpen() : palClose(); }
    if (e.key === 'Escape' && !document.getElementById('pal').hidden) palClose();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { const l = undoLast(); if (l) toast('בוטל: ' + l, false); }
  });

  document.getElementById('role').onchange = e => {
    const p = POLICY[e.target.value] || { money: 0, kvittel: 0, views: ['bait'] };
    ROLE = { name: e.target.value, ...p };
    tabs(); render();
    toast('התפקיד הוחלף ל' + ROLE.name + (ROLE.money ? '' : ' · הסכומים הוסתרו'), false);
  };
  /* ערכת-צבע: בחירה מפורשת, נזכרת במכשיר. «אוטומטי» = לפי הגדרת המכשיר. */
  const setTheme = (t, say) => {
    t ? root.setAttribute('data-theme', t) : root.removeAttribute('data-theme');
    document.querySelectorAll('.themeSw button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
    try { localStorage.setItem('mosad-theme', t); } catch (e) { /* חלון פרטי — נשאר לפי המכשיר */ }
    if (say) toast('ערכת צבע: ' + (t === 'dark' ? 'כהה' : t === 'light' ? 'בהירה' : 'לפי המכשיר'), false);
  };
  document.querySelector('.themeSw').addEventListener('click', e => {
    const b = e.target.closest('[data-theme]'); if (b) setTheme(b.dataset.theme, true);
  });
  let saved = ''; try { saved = localStorage.getItem('mosad-theme') || ''; } catch (e) { }
  setTheme(saved, false);
  document.getElementById('dens').onclick = () => {
    const d = root.getAttribute('data-density') === 'compact' ? '' : 'compact';
    d ? root.setAttribute('data-density', d) : root.removeAttribute('data-density');
    toast('צפיפות: ' + (d ? 'צפופה' : 'רגילה'), false);
  };
  document.getElementById('logBtn').onclick = () => go('log');

  /* «איך זה חושב» בכל מקום */
  document.addEventListener('click', e => {
    const w = e.target.closest('[data-why]'); if (w) { derive(w.dataset.why); }
  });

  onChange(() => { render(); });
  addEventListener('hashchange', render);
  render();
}
document.addEventListener('DOMContentLoaded', boot);

</script>
