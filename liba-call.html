<style>
:root{--void:#04050A;--ink:#EEF1FF;--ink-2:#9AA3B8;--ink-3:#5B6478;--ink-4:#2C3140;--core:#7DF9FF;--mic:#FF5C8A;--open:#FFB454;--ok:#5CFFB0;--danger:#FF4F5E;--glass:rgba(10,12,22,.7);--edge:rgba(125,249,255,.2)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:Heebo,Arial,sans-serif;direction:rtl;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-inline:20px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));gap:18px;transition:background .4s}
#app.ring{animation:flash 1.2s infinite}
@keyframes flash{50%{background:#1a0f22}}
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:18px;font-family:Karantina;font-weight:700;font-size:30px;line-height:1;background:linear-gradient(90deg,var(--ink),var(--core));-webkit-background-clip:text;background-clip:text;color:transparent}
.st{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));inset-inline-end:18px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ink-4)}.st.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.st.warn i{background:var(--danger)}
.core{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--core) 28%,rgba(138,92,255,.4) 60%,transparent 72%);animation:breathe 4s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(125,249,255,.5));flex:none;transition:transform .3s}
#app.ring .core{background:radial-gradient(circle,#fff 0,var(--mic) 28%,rgba(255,92,138,.4) 60%,transparent 72%);animation:ringpulse .6s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(255,92,138,.7))}
#app.listen .core{background:radial-gradient(circle,#fff 0,var(--mic) 28%,rgba(255,92,138,.4) 60%,transparent 72%);filter:drop-shadow(0 0 40px rgba(255,92,138,.7));animation:none}
@keyframes breathe{50%{transform:scale(1.08)}}@keyframes ringpulse{50%{transform:scale(1.25)}}
h1{margin:0;font-family:Karantina;font-weight:700;font-size:clamp(40px,11vw,92px);line-height:.95;text-wrap:balance;max-width:16ch}
h1.q{font-weight:300}
.sub{color:var(--ink-2);font-size:16px;max-width:36ch;line-height:1.5;margin:0}
.kind{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;color:var(--ink-3)}
.kind.stuck{color:var(--open)}.kind.done{color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px}
.opts button,.big{font:500 20px Heebo;background:var(--glass);border:1px solid var(--edge);color:var(--ink);border-radius:999px;padding:14px 26px;cursor:pointer;min-width:120px}
.opts button:active,.big:active{background:rgba(125,249,255,.15)}
.big{font-size:24px;padding:18px 40px;border-color:var(--core);box-shadow:0 0 30px -8px var(--core)}
.big.mic{border-color:var(--mic);box-shadow:0 0 30px -8px var(--mic)}
.heard{font-family:Karantina;font-weight:300;font-size:clamp(30px,8vw,60px);color:var(--mic);min-height:1.1em;line-height:1}
.row{display:flex;gap:10px;align-items:center;width:100%;max-width:520px}
.row input{flex:1;min-width:0;font:400 20px Heebo;background:var(--glass);border:1px solid var(--edge);color:var(--ink);border-radius:999px;padding:12px 18px;outline:none}
.row button{font:500 18px Heebo;background:var(--core);color:#04050A;border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
.log{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline:18px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:13px;color:var(--ink-3);background:none;border:0;text-decoration:underline;cursor:pointer;font-family:inherit}
.tr{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow:auto;-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%)}
.tr div{font-size:17px;line-height:1.45;padding:8px 14px;border-radius:14px;max-width:85%}
.tr .me{align-self:flex-start;background:rgba(255,92,138,.12);color:var(--ink)}
.tr .li{align-self:flex-end;background:var(--glass);border:1px solid var(--edge);color:var(--ink-2)}
.tr .li.think{color:var(--ink-3);font-style:italic}
.tr .me[data-st]::after{content:attr(data-st);display:block;font-size:.72em;color:var(--ink-3);margin-top:2px}
.tog{font-size:13px;color:var(--ink-3);background:none;border:1px solid var(--ink-4);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit}
.tog.on{color:var(--ok);border-color:var(--ok)}
.tasks{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;text-align:right}
.tasks .t{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);color:var(--ink-2)}
.tasks .t i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.tasks .t.running i{background:var(--core);box-shadow:0 0 8px var(--core)}.tasks .t.blocked i{background:var(--open);box-shadow:0 0 8px var(--open)}.tasks .t.done i{background:var(--ok)}
.tasks .t b{font-weight:500;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tasks .t small{color:var(--ink-3);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <button class="tog on" id="hf" hidden>ידיים חופשיות: פועל</button>
  <div class="log" id="log">—</div>
</div>

/* req-spine: the only id minter. String(Date.now()) collided whenever two writes shared a millisecond and
   silently overwrote each other; this is 48 bits of time + a per-millisecond counter + 32 random bits, so ids
   from one page never collide and still sort by time. */
let mintLast=0,mintSeq=0;
function mintId(){const t=Date.now();if(t===mintLast)mintSeq++;else{mintLast=t;mintSeq=0;}
  let r=0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);r=a[0];}catch(e){r=Math.floor(Math.random()*4294967296);}
  return t.toString(36).padStart(9,'0')+mintSeq.toString(36).padStart(4,'0')+r.toString(36).padStart(7,'0');}

   the same card. A card is never merged silently: "תאחד את X עם Y" asks first, and the merged card keeps the other
   in merged[] for 30 days. A person card is sensitive (1), and the brief gives facts about a person in the sentence a
   boost. */
const PEOPLE={
  cache:null,at:0,
  async all(){if(this.cache&&Date.now()-this.at<30000)return this.cache;const r=await coldGet(P.people(),null,500);this.cache=r.docs.map(d=>Object.assign({key:d.id},d.data()||{})).filter(x=>x.state!=='tomb');this.at=Date.now();return this.cache;},
  names(p){return [p.name].concat(p.aliases||[]).map(n=>memWords(n).join(' ')).filter(Boolean);},
  async resolve(text){const w=' '+memWords(text).join(' ')+' ';const all=await this.all();return all.filter(p=>this.names(p).some(n=>w.indexOf(' '+n+' ')>=0));},
  async find(name){const n=memWords(name).join(' ');return (await this.all()).find(p=>this.names(p).indexOf(n)>=0)||null;},
  async upsert(name,fields){const ex=await this.find(name);const k=ex?ex.key:slug(name),now=Date.now();
    const doc=Object.assign({name:ex?ex.name:name.trim(),aliases:ex&&ex.aliases||[],sens:1,firstSeen:ex&&ex.firstSeen||now,lastMentioned:now,state:'live'},ex||{},fields||{},{updatedAt:now});delete doc.key;
    await P.person(k).set(doc);this.cache=null;devMemDirty();return Object.assign({key:k},doc);},
};
let lastPerson=null;
function peopleAdd(rest,m){const name=rest.trim(),rel=m.rel.replace(/^(הוא|היא) /,'').trim();
  PEOPLE.upsert(name,{relation:rel}).then(p=>{lastPerson=p;MEM.put({subject:name,predicate:'הוא',value:rel,kind:'person',conf:0.9,raw:name+' '+m.rel},{type:'said'}).catch(()=>{});
    sayLocal('רשמתי: '+p.name+' '+m.rel.split(' ')[0]+' '+rel+'.');}).catch(e=>{fail('P_DB_WRITE',e,'people');sayLocal('לא הצלחתי לרשום.');});return true;}
function peopleWho(rest){if(!rest.trim())return false;peopleWhoA(rest).catch(e=>fail('P_DB_READ',e,'people'));return true;}
async function peopleWhoA(rest){const q=rest.trim();const ps=await PEOPLE.resolve(q).catch(()=>[]);
  if(!ps.length){sayLocal('אני לא מכירה את '+q+'. תגיד למשל "'+q+' הוא השכן".');return true;}
  const p=ps[0];lastPerson=p;P.person(p.key).update({lastMentioned:Date.now()}).catch(()=>{});
  const facts=(await MEM.query(p.name).catch(()=>[])).filter(f=>!(f.subject===p.name&&f.predicate==='הוא')).slice(0,3).map(f=>f.raw||f.value);
  sayLocal(p.name+(p.relation?' הוא '+p.relation:'')+((p.aliases||[]).length?', קוראים לו גם '+p.aliases.join(', '):'')+'.'+(facts.length?' עוד: '+facts.join('; ')+'.':''));return true;}
function peopleAlias(rest){if(!rest.trim())return false;peopleAliasA(rest).catch(e=>fail('P_DB_WRITE',e,'people'));return true;}
async function peopleAliasA(rest){const a=rest.trim();if(!lastPerson){sayLocal('על מי? תגיד קודם מי זה.');return true;}
  const other=await PEOPLE.find(a);if(other&&other.key!==lastPerson.key){sayLocal(a+' כבר שם של '+other.name+'. תגיד תאחד את '+lastPerson.name+' עם '+other.name+' אם זה אותו אדם.');return true;}
  const al=[...new Set((lastPerson.aliases||[]).concat([a]))];await P.person(lastPerson.key).update({aliases:al,updatedAt:Date.now()});lastPerson.aliases=al;PEOPLE.cache=null;
  sayLocal('בסדר, '+lastPerson.name+' זה גם '+a+'.');return true;}
function peopleMerge(rest){if(rest.split(' עם ').length!==2)return false;peopleMergeA(rest).catch(e=>fail('P_DB_WRITE',e,'people'));return true;}
async function peopleMergeA(rest){const m=rest.split(' עם ');const a=await PEOPLE.find(m[0]),b=await PEOPLE.find(m[1]);
  if(!a||!b||a.key===b.key){sayLocal('לא מצאתי שני אנשים שונים בשמות האלה.');return true;}
  const al=[...new Set((a.aliases||[]).concat([b.name],b.aliases||[]))];await P.person(a.key).update({aliases:al,relation:a.relation||b.relation,merged:[{key:b.key,name:b.name,at:Date.now()}],updatedAt:Date.now()});
  await P.person(b.key).update({state:'tomb',tombAt:Date.now(),mergedInto:a.key});PEOPLE.cache=null;sayLocal('איחדתי: '+b.name+' הוא '+a.name+'. אם טעיתי, זה עוד שמור שלושים יום.');return true;}

/* a person fact said any other way ("תזכור שהרואה חשבון הוא משה") also makes the card: when the subject is a role
   ("הרואה חשבון"), the value is the name */
function peopleFromFact(f){if(f.kind!=='person'||f.predicate!=='הוא')return null;const role=/^ה/.test(f.subject)&&f.value.split(' ').length<=2;
  const name=role?f.value:f.subject,rel=role?f.subject:f.value;if(name.split(' ').length>3)return null;return PEOPLE.upsert(name,{relation:rel}).then(p=>{lastPerson=p;return p;});}
/* Step policy. Every live pref fact (memory/facts, kind pref) is compiled into a typed rule. A message a rule holds
   back is never lost: it is acked into memory/digest/items/<day> and read once in the evening, and "למה לא סיפרת לי"
   answers with the rule, its words and its date. Urgent is never muted, commands never, and Liba's own lines never (the board's lines can be).
   Rule types: never_ask, mute_topic, mute_person, mute_kind, urgent_only (hours), short, digest_topic, address, short_all, no_proactive. */
const HOUR_HE={'אחת':1,'שתיים':2,'שלוש':3,'ארבע':4,'חמש':5,'שש':6,'שבע':7,'שמונה':8,'תשע':9,'עשר':10,'אחת עשרה':11,'שתים עשרה':12};
const hourOf=w=>{w=String(w||'').trim();return /^\d+$/.test(w)?+w:(HOUR_HE[w]!=null?HOUR_HE[w]:null);};
const POLICY_SHAPES=[
  [/^(אל תשאל|אל תשאלי) אותי (על|לגבי) (.+)$/,m=>({type:'never_ask',topic:m[3]})],
  [/^(אל תספר|אל תספרי|אל תעדכן|אל תעדכני|בלי עדכונים) (לי |אותי )?(על|לגבי) (.+)$/,m=>({type:'mute_topic',topic:m[4]})],
  [/^(תשתיק|תשתיקי|השתק) (את )?(.+)$/,m=>({type:'mute_topic',topic:m[3]})],
  [/^(אל תעביר|אל תעבירי|בלי) (לי )?הודעות (מ|של )(.+)$/,m=>({type:'mute_person',person:m[4]})],
  [/^בלי הודעות על משימות שנגמרו$/,m=>({type:'mute_kind',kind:'done'})],
  [/^(אף פעם )?(אל תעיר|אל תעירי) אותי לפני (.+)$/,m=>({type:'urgent_only',from:0,to:hourOf(m[3])})],
  [/^(אף פעם )?(אל תעיר|אל תעירי) אותי אחרי (.+)$/,m=>({type:'urgent_only',from:hourOf(m[3])+12>23?hourOf(m[3]):hourOf(m[3])+(hourOf(m[3])<12?12:0),to:24})],
  [/^רק דחוף (בין|מ)(.+?) (ל|עד )(.+)$/,m=>({type:'urgent_only',from:hourOf(m[2]),to:hourOf(m[4])})],
  [/^(תאסוף|תאספי) (לי )?(את )?(.+) לערב$/,m=>({type:'digest_topic',topic:m[4]})],
  [/^(תקצר|תקצרי|בקצרה) (על|לגבי) (.+)$/,m=>({type:'short',topic:m[3]})],
  [/^(תמיד )?(תקצר|תקצרי|בקצרה)$/,m=>({type:'short_all'})],
  [/^(תקרא|תקראי) לי (.+)$/,m=>({type:'address',name:m[2]})],
  [/^(תפסיק|תפסיקי) להזכיר( לי)?( דברים)?$/,m=>({type:'no_proactive'})],
];
const POLICY={rules:[],at:0,
  compileOne(f){const t=inorm(f.value||f.raw||'');for(const [re,mk] of POLICY_SHAPES){const m=t.match(re);if(m){const r=mk(m);if(r.type==='urgent_only'&&(r.from==null||r.to==null))return null;return Object.assign(r,{id:'r-'+hash36(t),text:t,at:+f.updatedAt||+f.ts||Date.now(),key:f.key});}}return null;},
  async load(){try{const all=await MEM.all();this.rules=all.filter(f=>f.kind==='pref'&&f.state!=='tomb').map(f=>this.compileOne(f)).filter(Boolean);this.at=Date.now();}catch(e){fail('P_DB_READ',e,'policy');}return this.rules;},
  about(d,topic){const w=memWords(topic);if(!w.length)return false;const hay=memWords([d.topic,d.text].join(' ')).join(' ');return w.every(x=>hay.indexOf(x)>=0);},
  /* which rule holds this message back, if any - urgent, local and commands never */
  check(d,now){if((d.local&&d.speaker!=='הלוח'&&!d.proactive&&!d.sense)||d.kind==='cmd'||d.priority==='urgent')return null;const h=jHour(now||Date.now());
    for(const r of this.rules){
      if(r.type==='never_ask'&&(d.kind==='ask'||d.kind==='stuck')&&this.about(d,r.topic))return r;
      if((r.type==='mute_topic'||r.type==='digest_topic')&&this.about(d,r.topic))return r;
      if(r.type==='mute_person'){const who=memWords(r.person).join(' ');if(who&&(memWords(speakerOf(d)).join(' ').indexOf(who)>=0||memWords(d.from==='manager'?'המנהל':'').join(' ').indexOf(who)>=0))return r;}
      if(r.type==='mute_kind'&&d.kind===r.kind)return r;
      if(r.type==='no_proactive'&&d.proactive)return r;
      if(r.type==='urgent_only'&&(r.from<=r.to?(h>=r.from&&h<r.to):(h>=r.from||h<r.to)))return r;}
    return null;},
  shorten(d){const r=this.rules.find(x=>(x.type==='short'&&this.about(d,x.topic))||x.type==='short_all');if(!r||d.local)return null;const t=String(d.text||'');const cut=t.search(/[.!?](\s|$)/);
    if(cut<0||cut>t.length-20)return null;return {text:t.slice(0,cut+1)+' יש עוד - תגיד "תקריא את כל ההודעה".',full:t,rule:r};}
};
let lastShort=null;
async function digestAdd(d,r){const day=trDay(Date.now());try{await P.digest(day).update({items:{[d.id]:{text:String(d.text||'').slice(0,300),topic:d.topic||'',speaker:speakerOf(d),rule:r.id,ruleText:r.text,at:Date.now()}}});}
  catch(e){try{await P.digest(day).set({day:day,items:{[d.id]:{text:String(d.text||'').slice(0,300),topic:d.topic||'',speaker:speakerOf(d),rule:r.id,ruleText:r.text,at:Date.now()}}});}catch(x){fail('P_DB_WRITE',x,'digest');}}}

function policyList(){POLICY.load().then(async rs=>{const a=await fleetAsksOpen();sayLocal((rs.length?'יש '+rs.length+' כללים: '+rs.map(r=>r.text).join('; ')+'.':'אין כללים. תגיד למשל "אל תעדכן אותי על מייל".')+(a.length?' ו-'+a.length+' שאלות של עובדים מחכות לסיכום - תגיד "מה השתקת מהעובדים".':''));});return true;}

/* Step distill. The turns and decisions the page has written all along (chat/log/turns, decisions/log/items) are read
   back: fourteen days of them, live rows and the janitor's folds. A table of extractors turns repetition into a
   candidate - memory/candidates/items/<key> {kind, claim, evidence:[ids], n, conf, proposedFact, state}:
     habit  - the same sentence said to ליבה three times or more
     rule   - the same answer to the same question three times or more
     hours  - the hours Meir talks, across five days or more: when he is not there
     person - a name that comes back after "דיברתי עם / תתקשר ל…" three times, with no card yet
   Only Meir's own sentences to ליבה count (from:'user', to:'liba') - a sentence meant for the manager, or heard from
   someone in the room, is never evidence. At most one question a day (inbox/distill-<day>, priority morning, so it
   waits for the morning like any other); "כן" within three minutes keeps it as a fact with source inferred, "לא" puts
   it away for sixty days. A kept fact is forgotten like any other ("תשכח את…"). */
const DISTILL_DAYS=14,DISTILL_MIN=3,DISTILL_CONF=0.7,DISTILL_COOL=60*864e5,DISTILL_TURNS=3000;
const DISTILL_VERBS=new Set(['דיברתי','פגשתי','תתקשר','תתקשרי','תגיד','תגידי','תשלח','תשלחי','נפגשתי','שלחתי','התקשרתי','להתקשר','לדבר','תזכיר']);
const DISTILL_LINK=new Set(['עם','את','אצל','ל']);
function distillHabits(turns){const by={};for(const t of turns){const k=inorm(t.text);if(k.length<4||matchIntent(k))continue;(by[k]=by[k]||[]).push(t);}
  return Object.entries(by).filter(([,v])=>v.length>=DISTILL_MIN).map(([k,v])=>({kind:'habit',id:'habit.'+hash36(k),n:v.length,evidence:v.map(x=>x.id),
    claim:'אתה אומר לי הרבה "'+k.slice(0,60)+'"',forget:'אומר הרבה',proposedFact:{subject:'מאיר',predicate:'אומר הרבה',value:k.slice(0,120),kind:'fact',raw:'מאיר אומר הרבה: '+k.slice(0,120)}}));}
function distillRules(decs){const by={};for(const d of decs){const q=inorm(d.topic||d.question||''),a=inorm(d.answer||'');if(!q||!a)continue;const k=q+'|'+a;(by[k]=by[k]||{q,a,v:[]}).v.push(d);}
  return Object.values(by).filter(x=>x.v.length>=DISTILL_MIN).map(x=>({kind:'rule',id:'rule.'+hash36(x.q+'|'+x.a),n:x.v.length,evidence:x.v.map(d=>d.id),
    forget:x.q.slice(0,30),claim:'כשאני שואלת על '+x.q.slice(0,40)+' אתה תמיד עונה "'+x.a.slice(0,40)+'"',proposedFact:{subject:'מאיר',predicate:'העדפה',value:'על '+x.q.slice(0,60)+' התשובה היא '+x.a.slice(0,60),kind:'pref',raw:'על '+x.q.slice(0,60)+' התשובה היא '+x.a.slice(0,60)}}));}
function distillHours(turns){const days=new Set(turns.map(t=>trDay(+t.ts)));if(days.size<5||turns.length<10)return [];
  const hs=turns.map(t=>jHour(+t.ts)),last=Math.max(...hs),first=Math.min(...hs),out=[];
  if(last<22)out.push({kind:'hours',id:'hours.until',n:turns.length,evidence:turns.slice(-20).map(t=>t.id),forget:'זמין',claim:'אתה אף פעם לא מדבר איתי אחרי '+(last+1)+' בערב',
    proposedFact:{subject:'מאיר',predicate:'זמין עד',value:String(last+1),kind:'fact',raw:'מאיר בדרך כלל לא זמין אחרי '+(last+1)}});
  if(first>=7)out.push({kind:'hours',id:'hours.from',n:turns.length,evidence:turns.slice(0,20).map(t=>t.id),forget:'זמין',claim:'אתה אף פעם לא מדבר איתי לפני '+first+' בבוקר',
    proposedFact:{subject:'מאיר',predicate:'זמין מ',value:String(first),kind:'fact',raw:'מאיר בדרך כלל לא זמין לפני '+first}});
  return out;}
function distillNames(turns,known){const by={};
  for(const t of turns){const w=inorm(t.text).split(' ');for(let i=0;i<w.length-1;i++){if(!DISTILL_VERBS.has(w[i]))continue;let n=w[i+1];
      if(DISTILL_LINK.has(n))n=w[i+2]||'';else if(n.charAt(0)==='ל'&&n.length>3)n=n.slice(1);
      if(n.length<2||STOP.has(n)||known.has(memWords(n).join(' ')))continue;(by[n]=by[n]||new Set()).add(t.id);}}
  return Object.entries(by).filter(([,s])=>s.size>=DISTILL_MIN).map(([n,s])=>({kind:'person',id:'person.'+slug(n),n:s.size,evidence:[...s],
    forget:n,claim:'אתה מדבר הרבה עם '+n+', ואני עוד לא יודעת מי זה',proposedFact:{subject:n,predicate:'מוזכר',value:'מדבר איתו הרבה',kind:'fact',raw:n+' - מאיר מדבר איתו הרבה'},person:n}));}
/* the run: read, extract, write candidates (a decided one keeps its decision), then ask - once a day */
async function distill(now){now=now||Date.now();if(!db)return null;const t0=Date.now(),from=now-DISTILL_DAYS*864e5;
  let turns=[],decs=[];try{turns=(await turnsBetween(from,now+1,DISTILL_TURNS)).filter(t=>t.from==='user'&&t.to==='liba'&&t.text);}catch(e){fail('P_DB_READ',e,'distill turns');}
  try{decs=await logBetween('decisions',P.decisions(),from,now+1,1000);}catch(e){fail('P_DB_READ',e,'distill decisions');}
  let known=new Set();try{known=new Set((await PEOPLE.all()).flatMap(p=>PEOPLE.names(p)));}catch(e){}
  const found=[].concat(distillHabits(turns),distillRules(decs),distillHours(turns),distillNames(turns,known));
  let cur={};try{const r=await coldGet(P.cands(),null,500);r.docs.forEach(d=>{cur[d.id]=d.data()||{};});}catch(e){fail('P_DB_READ',e,'candidates');}
  for(const c of found){const ex=cur[c.id]||{};const conf=Math.min(0.95,0.5+0.1*c.n);
    const doc={kind:c.kind,claim:c.claim,forget:c.forget||'',evidence:c.evidence.slice(-20),n:c.n,conf:conf,proposedFact:c.proposedFact,state:ex.state||'open',updatedAt:now,firstAt:ex.firstAt||now};
    ['askedAt','askedDay','rejectedAt','acceptedAt','factKey'].forEach(k=>{if(ex[k]!=null)doc[k]=ex[k];});
    cur[c.id]=doc;try{await P.cand(c.id).set(doc);}catch(e){fail('P_DB_WRITE',e,'candidate');}}
  const asked=await distillAsk(now,cur);
  return {turns:turns.length,decisions:decs.length,found:found.length,asked:asked,ms:Date.now()-t0};}
/* a question still unanswered from the last three days means no new one - they never pile up */
async function distillAsk(now,cur){const day=trDay(now);if(Object.values(cur).some(c=>c.askedDay===day||(c.state==='open'&&c.askedAt&&now-c.askedAt<3*864e5)))return null;
  const id='distill-'+day;try{const g=await P.inboxDoc(id).get();if(g.exists)return null;}catch(e){return null;}
  const pick=Object.entries(cur).filter(([,c])=>c.n>=DISTILL_MIN&&c.conf>=DISTILL_CONF&&(c.state==='open'&&!c.askedAt||c.state==='rejected'&&now-(+c.rejectedAt||0)>DISTILL_COOL))
    .sort((a,b)=>b[1].conf-a[1].conf||b[1].n-a[1].n)[0];if(!pick)return null;

/* Step context-fusion. sense/context holds one picture: the phone's (screen, lock, headset, a call - sent as ctx when it

   inbox/<id>.admit {rule, ctx} - so a silence is never a mystery. There is no place and no motion here: location waits

async function bookDocs(col,filters,n){try{return (await coldGet(col,filters,n||300)).docs.map(d=>Object.assign({id:d.id},d.data()||{}));}catch(e){fail('P_DB_READ',e,'book ledger');return [];}}
async function weekClose(now,force){now=now||Date.now();if(!db)return null;const j=jNow(now);if(!force&&!(j.dow===5&&j.hour>=16)&&j.dow!==6)return null;const wk=weekId(now);
  let l;try{l=await P.weekLock(wk).acquire({holder:PAGE_ID,ttlMs:10*60000});}catch(e){return null;}if(!l||l.acquired===false)return null;
  try{const g=await P.ledgerWeek(wk).get();if(g.exists)return null;}catch(e){}
  const start=Date.parse(wk+'T00:00:00+03:00'),end=start+7*864e5;
  const [closes,runs,decs,tasks,pres]=await Promise.all([bookDocs(P.closes(),[['weekId','==',wk]]),bookDocs(P.runs(),[['startedAt','>=',start]]),bookDocs(P.decisions(),[['ts','>=',start]]),bookDocs(P.tasks(),[['updatedAt','>=',start]]),bookDocs(P.presences(),[['firstAt','>=',start]])]);
  const presDays=new Set(pres.map(p=>p.day)),rows=[];const forms=await bookDocs(P.forms(),null,100);
  for(const o of bookCycle.obligations){const days=[];for(let k=0;k<7;k++){const t=start+k*864e5+12*3600e3;const jj=jNow(t);if(o.dow===-1||o.dow===jj.dow||(o.dom&&o.dom===jj.dom))days.push(t);}if(!days.length)continue;
    for(const t of days){const day=trDay(t),due=Date.parse(day+'T'+String(o.dueHour).padStart(2,'0')+':00:00+03:00'),grace=due+o.graceHours*3600e3;let v=null,src='',at=0;
      const c=closes.find(x=>x.obligationId===o.id);if(c){v=c.verdict==='na'?'na':c.ts>grace?'late':'done';src='book/closes/items/'+c.id;at=c.ts;}
      if(!v&&(o.kind==='form'||o.kind==='report')){const f=forms.find(x=>(x.feeds||[x.title]).some(z=>(o.feeds||[]).indexOf(z)>=0||z===o.title));const r=f&&runs.find(x=>x.formId===f.id&&x.state==='done');if(r){v=(r.doneAt||0)>grace?'late':'done';src='book/runs/items/'+r.id;at=r.doneAt||0;}}
      if(!v&&o.kind==='decision'){const d=decs.find(x=>(o.feeds||[]).indexOf(x.topic)>=0);if(d){v=d.ts>grace?'late':'done';src='decisions/log/items/'+d.id;at=d.ts;}}
      if(!v){const tk=tasks.find(x=>x.kind==='form-emit'&&x.status==='done'&&(x.obligationId===o.id||(o.feeds||[]).indexOf(x.title)>=0));if(tk){v='done';src='tasks/'+tk.id;at=tk.updatedAt||0;}}
      if(!v&&(o.kind==='shift'||o.kind==='payment'||o.kind==='visit')&&o.lastDoneAt>=start&&o.lastDoneAt<end){v=o.lastDoneAt>grace?'late':'done';src='book/cycle';at=o.lastDoneAt;}
      if(!v)v=presDays.has(day)?'missed':'unknown';rows.push({obligationId:o.id,title:o.title,day,verdict:v,src,at});}}
  const cnt=k=>rows.filter(r=>r.verdict===k).length,sum={weekId:wk,rows,onTime:cnt('done'),late:cnt('late'),missed:cnt('missed'),unknown:cnt('unknown'),na:cnt('na'),n:rows.length,at:now};
  await P.ledgerWeek(wk).set(sum).catch(e=>fail('P_DB_WRITE',e,'book/ledger'));
  for(const r of rows.filter(r=>r.verdict==='missed')){const id='missed-'+fleetHash(r.obligationId+r.day);await P.task(id).set({title:'פוספס: '+r.title,status:'queued',priority:2,kind:'missed',obligationId:r.obligationId,day:r.day,updatedAt:now}).catch(()=>{});}
  const off=[...new Set(rows.filter(r=>r.verdict==='unknown').map(r=>DOW_HE[jNow(Date.parse(r.day+'T12:00:00+03:00')).dow]))];
  if(Mandate.allow('speak_unprompted').verdict!=='deny')queueLocal({id:'week-'+wk,kind:'ask',speaker:'ליבה',topic:'סגירת שבוע',options:['תודה'],text:'סגירת שבוע: '+sum.onTime+' בזמן, '+sum.late+' באיחור, '+sum.missed+' פוספסו'+(sum.missed?' - פתחתי להן משימות':'')+(sum.unknown?', ו-'+sum.unknown+' לא ידוע, כי לא הייתי פתוחה ב'+off.join(' ו'):'')+'.'});
  Ledger.record({action:'week.close',cause:wk,result:JSON.stringify({o:sum.onTime,l:sum.late,m:sum.missed,u:sum.unknown})});return sum;}
async function bookTick(){const now=Date.now();if(!db||now-bookTickAt<5*60000)return;bookTickAt=now;try{await bookPresence(now);bookDueLoop(now);await bookIntake(now);await weekClose(now);}catch(e){fail('P_DB_WRITE',e,'book tick');}}
/* a snapshot older than this page's own last write is the echo of an earlier write - taking it would drop what was just
   added, and the next add would save the shorter list */
function bookIn(kind,v){if(kind==='cycle'){if(v&&v.at&&+v.at<bookLocalAt)return; /* a write from outside without at is taken as it is */bookCycle=Object.assign({obligations:[]},v||{});}else if(kind==='roles')bookRoles=v;}
window.__book={parse:bookParse,add:bookAddObligation,due:bookDueLoop,close:bookClose,weekClose,presence:bookPresence,intake:n=>bookIntake(n,true),weekId,jNow,state:()=>({cycle:bookCycle,roles:[...bookRoles.values()]}),asks:bookAsks,tick:()=>{bookTickAt=0;return bookTick();}};
// every number and name read back before it closes
/* Step voice-form. book/forms/items/<formId> {title, feeds[], fields: [{key, label, type: number|text|choice|date|
   person, required, unit, options, lastValue, readback}]}. "תמלאי את <form>" opens book/runs/items/<runId> {formId,
   values, doneFields, startedAt, state} and asks one field at a time (queueLocal ask); the answer is caught before it
   could go to Claude (bookAnswer). Numbers are said in words - hebNum("שלוש מאות ארבעים ושתיים") = 342. Every answer
   is written at once, so "תמשיך את הדוח" picks the run up after the app was closed with nothing lost; "תחזור שאלה
   אחורה" goes back one field. At the end every number and every name is read back; "נכון" closes the run and opens
   tasks/<id> {kind: form-emit, values} for the session that renders the real document; "לא" asks which field. */
const HN_UNIT={'אפס':0,'אחד':1,'אחת':1,'שניים':2,'שתיים':2,'שני':2,'שתי':2,'שנים':2,'שתים':2,'שלוש':3,'שלושה':3,'שלושת':3,'ארבע':4,'ארבעה':4,'ארבעת':4,'חמש':5,'חמישה':5,'חמשת':5,
  'שש':6,'שישה':6,'ששת':6,'שבע':7,'שבעה':7,'שבעת':7,'שמונה':8,'שמונת':8,'תשע':9,'תשעה':9,'תשעת':9,'עשר':10,'עשרה':10,'עשרת':10,'עשרים':20,'שלושים':30,'ארבעים':40,'חמישים':50,'שישים':60,'שבעים':70,'שמונים':80,'תשעים':90,'מאה':100,'מאתיים':200,'אלפיים':2000};
/* Hebrew number words (or digits) -> a number; null when it is not a number */
function hebNum(text){const raw=String(text||'').trim();const dg=/-?\d+(?:[.,]\d+)?/.exec(raw.replace(/(\d),(\d{3})/g,'$1$2'));if(dg&&!/[א-ת]/.test(raw.split(/\d/)[0]))return +dg[0].replace(',','.');
  const toks=inorm(raw).split(' ').filter(Boolean);let total=0,cur=0,seen=false,half=false;
  for(let w of toks){if(w==='וחצי'||w==='חצי'){half=true;seen=true;continue;}if(HN_UNIT[w]==null&&w[0]==='ו'&&HN_UNIT[w.slice(1)]!=null)w=w.slice(1);
    if(w==='מאות'){cur=(cur||1)*100;seen=true;continue;}if(w==='אלף'||w==='אלפים'){total+=(cur||1)*1000;cur=0;seen=true;continue;}if(w==='מיליון'||w==='מיליונים'){total+=(cur||1)*1e6;cur=0;seen=true;continue;}
    if(HN_UNIT[w]!=null){const v=HN_UNIT[w];if(v===2000){total+=2000;}else cur+=v;seen=true;continue;}
    if(seen)break;return null;}
  return seen?total+cur+(half?0.5:0):null;}
function formDate(t){t=inorm(t);const now=new Date();if(t.indexOf('היום')>=0)return trDay(now);if(t.indexOf('מחר')>=0)return trDay(Date.now()+864e5);if(t.indexOf('אתמול')>=0)return trDay(Date.now()-864e5);
  const m=/(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/.exec(t);if(!m)return null;const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):now.getFullYear();return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
let formCur=null;
async function formLoad(q){const all=(await coldGet(P.forms(),null,100)).docs.map(d=>Object.assign({id:d.id},d.data()||{}));const w=memWords(q||'');
  return all.map(f=>({f,n:w.filter(a=>memWords(f.title).some(b=>b.indexOf(a)===0||a.indexOf(b)===0)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).map(x=>x.f)[0]||null;}
async function formSaveRun(){const r=formCur;if(!r||!db)return;await P.run(r.runId).set({formId:r.form.id,title:r.form.title,values:r.values,doneFields:r.doneFields,startedAt:r.startedAt,state:r.state,i:r.i,doneAt:r.doneAt||0}).catch(e=>fail('P_DB_WRITE',e,'book/runs'));}
function formAskField(pre){const r=formCur,f=r.form.fields[r.i],id='form-'+r.runId+'-'+r.i+'-'+mintId();bookAsks.set(id,{id,kind:'form',runId:r.runId,i:r.i});
  queueLocal({id,kind:'ask',release:true,speaker:'ליבה',topic:r.form.title,options:f.type==='choice'?(f.options||[]):[],text:(pre||'')+f.label+(f.unit?' ('+f.unit+')':'')+'?'+(f.lastValue!=null&&f.lastValue!==''?' בפעם הקודמת: '+f.lastValue+'.':'')});}
function formReadback(){const r=formCur,parts=r.form.fields.filter(f=>r.values[f.key]!=null&&(f.type==='number'||f.type==='person'||f.readback)).map(f=>f.label+' '+r.values[f.key]+(f.unit?' '+f.unit:''));
  const id='form-ok-'+r.runId+'-'+mintId();bookAsks.set(id,{id,kind:'formConfirm',runId:r.runId});queueLocal({id,kind:'ask',release:true,speaker:'ליבה',topic:r.form.title,options:['נכון','לא'],text:'קראתי: '+(parts.join(', ')||'הכול')+'. נכון?'});}
function formNext(){const r=formCur;while(r.i<r.form.fields.length&&r.doneFields.indexOf(r.form.fields[r.i].key)>=0&&!r.redo)r.i++;r.redo=false;formSaveRun();if(r.i>=r.form.fields.length)formReadback();else formAskField();}
function formStart(rest){(async()=>{const f=await formLoad(rest);if(!f||!Array.isArray(f.fields)||!f.fields.length){sayLocal('לא מצאתי טופס בשם '+rest+'.');return;}
  formCur={runId:'run-'+mintId(),form:f,i:0,values:{},doneFields:[],startedAt:Date.now(),state:'open'};await formSaveRun();Ledger.record({action:'form.start',cause:'voice',result:formCur.runId});
  sayLocal(f.title+': '+f.fields.length+' שאלות. אפשר תמיד להגיד "תחזור שאלה אחורה".');formAskField();})().catch(e=>{fail('P_DB_READ',e,'forms');sayLocal('לא הצלחתי לפתוח את הטופס.');});return true;}
function formResume(){(async()=>{const runs=(await coldGet(P.runs(),[['state','==','open']],50)).docs.map(d=>Object.assign({id:d.id},d.data()||{})).sort((a,b)=>b.startedAt-a.startedAt);
  const r=runs[0];if(!r){sayLocal('אין דוח פתוח.');return;}const g=await P.form(r.formId).get();const f=g.exists?Object.assign({id:r.formId},g.data()):null;if(!f){sayLocal('הטופס של הדוח הפתוח נמחק.');return;}
  formCur={runId:r.id,form:f,i:0,values:r.values||{},doneFields:r.doneFields||[],startedAt:r.startedAt,state:'open'};sayLocal('ממשיכה את '+f.title+' - '+formCur.doneFields.length+' מתוך '+f.fields.length+' כבר נענו.');formNext();})()
  .catch(e=>{fail('P_DB_READ',e,'runs');sayLocal('לא הצלחתי לקרוא את הדוח.');});return true;}
function formBack(){if(!formCur){sayLocal('אין דוח פתוח.');return true;}const r=formCur;r.i=Math.max(0,r.i-1);const k=r.form.fields[r.i].key;r.doneFields=r.doneFields.filter(x=>x!==k);r.redo=true;formNext();return true;}
function formAnswer(a,text){const r=formCur;if(!r||r.runId!==a.runId)return false;const t=inorm(text);lastAsk=null;bookAsks.delete(a.id);
  if(t.indexOf('אחורה')>=0){formBack();return true;}
  if(a.kind==='formConfirm'){if(['נכון','כן','בסדר','מאשר'].some(x=>t===x||t.indexOf(x+' ')===0)){r.state='done';r.doneAt=Date.now();formSaveRun().then(async()=>{const tid='emit-'+mintId();
      await P.task(tid).set({kind:'form-emit',formId:r.form.id,title:r.form.title,values:r.values,runId:r.runId,status:'queued',updatedAt:Date.now()}).catch(()=>{});
      const fields=r.form.fields.map(f=>Object.assign({},f,r.values[f.key]!=null?{lastValue:r.values[f.key]}:{}));await P.form(r.form.id).update({fields}).catch(()=>{});
      Ledger.record({action:'form.done',cause:r.runId,result:tid});sayLocal(r.form.title+' נסגר. שלחתי לעיבוד - אגיד כשהמסמך מוכן.');formCur=null;});return true;}
    const id='form-fix-'+r.runId+'-'+mintId();bookAsks.set(id,{id,kind:'formFix',runId:r.runId});queueLocal({id,kind:'ask',release:true,speaker:'ליבה',topic:r.form.title,text:'איזה שדה לתקן?'});return true;}
  if(a.kind==='formFix'){const w=memWords(text);const i=r.form.fields.findIndex(f=>memWords(f.label).some(b=>w.some(x=>b.indexOf(x)===0||x.indexOf(b)===0)));
    if(i<0){const id='form-fix-'+r.runId+'-'+mintId();bookAsks.set(id,{id,kind:'formFix',runId:r.runId});queueLocal({id,kind:'ask',release:true,speaker:'ליבה',topic:r.form.title,text:'לא מצאתי שדה כזה. איזה? '+r.form.fields.map(f=>f.label).join(', ')+'.'});return true;}
    r.i=i;r.doneFields=r.doneFields.filter(x=>x!==r.form.fields[i].key);r.redo=true;formNext();return true;}
  const f=r.form.fields[a.i];let v=null,why='';
  if(!f.required&&/דלג|אין|לא רלוונטי|תדלגי|תדלג/.test(t))v='';
  else if(f.type==='number'){v=hebNum(text);if(v==null)why='לא שמעתי מספר. ';}
  else if(f.type==='choice'){const o=(f.options||[]).find(o=>t.indexOf(inorm(o))>=0);v=o||null;if(v==null)why='אחת מ: '+(f.options||[]).join(', ')+'. ';}
  else if(f.type==='date'){v=formDate(text);if(v==null)why='לא שמעתי תאריך. ';}
  else v=String(text).trim()||null;
  if(v==null){formAskField(why);return true;}
  r.values[f.key]=v;if(r.doneFields.indexOf(f.key)<0)r.doneFields.push(f.key);r.i=a.i+1;formNext();return true;}
window.__form={hebNum,start:formStart,resume:formResume,cur:()=>formCur,date:formDate};
</script>
