<title>Orbit · Covenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@300;400;700&family=Sora:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--core:#ffcf6b;--warm:#ffe6b0;--ink:#f4efe4;--muted:#c3bcd0;--faint:#7a7594;
    --wm:'Sora',system-ui,sans-serif;--body:'Heebo',system-ui,sans-serif;--display:'Frank Ruhl Libre',serif;--mono:'IBM Plex Mono',monospace}
  *{margin:0;box-sizing:border-box}html,body{height:100%}
  body{background:#03040c;color:var(--ink);font-family:var(--body);font-weight:300;overflow:hidden;direction:rtl}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}#c:active{cursor:grabbing}
  .ui{position:fixed;inset:0;pointer-events:none;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:28px 34px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:var(--wm);font-weight:800;letter-spacing:.15em;font-size:1.05rem;opacity:.92;display:flex;align-items:center;gap:9px}
  .brand .o{position:relative;width:19px;height:19px}
  .brand .o::before{content:"";position:absolute;inset:0;border:1.5px solid rgba(255,207,107,.5);border-radius:50%}
  .brand .o::after{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;background:var(--core);border-radius:50%;box-shadow:0 0 9px var(--core);transform-origin:0 11.5px;animation:sp 5s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cta{pointer-events:auto;font-family:var(--body);font-weight:600;font-size:.9rem;color:#241704;padding:10px 22px;border-radius:999px;background:linear-gradient(120deg,var(--warm),#ffb03a);text-decoration:none;transition:transform .18s,box-shadow .3s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(255,176,58,.5)}
  .center{position:fixed;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none;padding:0 26px}
  .center .msg{text-align:center;max-width:24ch}
  .line{font-family:var(--display);font-weight:900;font-size:clamp(2rem,5.4vw,4rem);line-height:1.08;text-shadow:0 8px 60px rgba(0,0,0,.9);opacity:0;transform:translateY(18px);transition:opacity 1.1s,transform 1.1s}
  .line.show{opacity:1;transform:none}.line .lit{color:var(--core)}
  .sub{font-family:var(--body);color:var(--muted);font-size:1.05rem;margin-top:14px;opacity:0;transition:opacity 1.1s .2s}.sub.show{opacity:.92}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .counts{display:flex;gap:26px;font-family:var(--mono);font-size:.72rem}
  .counts .v{font-family:var(--wm);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
  .held .v{color:var(--core)}.lost .v{color:#7fe0c0}
  .counts .l{color:var(--faint);text-transform:uppercase;margin-top:1px}
  .hint{font-family:var(--mono);font-size:.68rem;color:var(--faint)}.hint b{color:var(--warm)}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#03040c;z-index:6;transition:opacity 1s}
  .loading.gone{opacity:0;pointer-events:none}
  .loading .l{font-family:var(--mono);font-size:.8rem;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;animation:pl 1.4s ease-in-out infinite}
  @keyframes pl{50%{opacity:.4}}
  @media (prefers-reduced-motion:reduce){.brand .o::after,.loading .l{animation:none}}
</style>

<canvas id="c"></canvas>
<div class="ui">
  <div class="top"><div class="brand"><span class="o"></span>ORBIT</div><a class="cta" href="#" onclick="return false">פתחו אתר →</a></div>
  <div class="foot">
    <div class="hint"><b>גררו</b> לחוג · <b>לחצו</b> לאסוף אליכם</div>
    <div class="counts"><div class="held"><div class="v" id="held">0</div><div class="l">במסלול</div></div><div class="lost"><div class="v" id="lost">0</div><div class="l">אבודים</div></div></div>
  </div>
</div>
<div class="center"><div class="msg"><div class="line" id="line"><span class="lit">כלום</span> לא הולך לאיבוד.</div><div class="sub" id="sub">כל נשמה נתפסת. כל מתנה מגיעה. אתם נותנים — Orbit מחזיק את השאר.</div></div></div>
<div class="loading" id="load"><div class="l">Orbit · הברית מתעוררת…</div></div>

<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cv=document.getElementById('c'),load=document.getElementById('load');
  const heldEl=document.getElementById('held'),lostEl=document.getElementById('lost');
  let gl;try{gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false});}catch(e){}
  if(!gl){load.querySelector('.l').textContent='WebGL לא נתמך';return;}

  /* mat4 */
  function ident(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o;}
  function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
  function persp(f,a,n,fr){const t=1/Math.tan(f/2),o=new Float32Array(16);o[0]=t/a;o[5]=t;o[10]=(fr+n)/(n-fr);o[11]=-1;o[14]=2*fr*n/(n-fr);return o;}
  function tz(z){const o=ident();o[14]=z;return o;}
  function rY(a){const c=Math.cos(a),s=Math.sin(a),o=ident();o[0]=c;o[2]=s;o[8]=-s;o[10]=c;return o;}
  function rX(a){const c=Math.cos(a),s=Math.sin(a),o=ident();o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o;}

  function mk(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(o));return o;}
  function prog(v,f){const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,v));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.warn(gl.getProgramInfoLog(p));return p;}
  const FRAG=`precision mediump float;varying vec3 vCol;varying float vB;
    void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,0.,d);gl_FragColor=vec4(vCol*vB,a*.92);}`;

  /* held souls: GPU orbit */
  const HELD=6500;
  const bR=new Float32Array(HELD),bPh=new Float32Array(HELD),bSp=new Float32Array(HELD),bTl=new Float32Array(HELD*2),bCl=new Float32Array(HELD*3);
  for(let i=0;i<HELD;i++){
    const shell=(Math.random()**1.3); const R=0.55+shell*1.75;
    bR[i]=R+ (Math.random()-.5)*0.05;
    bPh[i]=Math.random()*6.283;
    bSp[i]=(Math.random()<.5?1:-1)*(0.55/Math.sqrt(R))*(0.8+Math.random()*0.4);
    bTl[i*2]=Math.random()*3.14159; bTl[i*2+1]=Math.random()*6.283;
    // warm palette: inner hotter gold, outer soft amber
    const t=(R-0.55)/1.75;
    const cr=1.0, cg=0.86-0.12*t, cb=0.45-0.2*t + Math.random()*0.05;
    bCl[i*3]=cr;bCl[i*3+1]=cg;bCl[i*3+2]=cb;
  }
  const ORB=prog(`
    attribute float aR,aPhase,aSpeed;attribute vec2 aTilt;attribute vec3 aCol;
    uniform mat4 uMVP;uniform float uT,uPx,uBurst;varying vec3 vCol;varying float vB;
    void main(){float ang=aPhase+uT*aSpeed;
      vec3 p=vec3(cos(ang)*aR,0.,sin(ang)*aR);
      p*=1.0+0.02*sin(uT*0.8+aPhase);
      float cx=cos(aTilt.x),sx=sin(aTilt.x);p=vec3(p.x,p.y*cx-p.z*sx,p.y*sx+p.z*cx);
      float cz=cos(aTilt.y),sz=sin(aTilt.y);p=vec3(p.x*cz-p.y*sz,p.x*sz+p.y*cz,p.z);
      p+=normalize(p+0.001)*uBurst*0.28;
      vec4 q=uMVP*vec4(p,1.);gl_Position=q;
      gl_PointSize=clamp((1.1+aR*1.4)*uPx/q.w,1.,13.);
      vCol=aCol;vB=clamp(1.55/q.w,.3,1.7);}`,FRAG);
  const oA={};['aR','aPhase','aSpeed','aTilt','aCol'].forEach(k=>oA[k]=gl.getAttribLocation(ORB,k));
  const oU={};['uMVP','uT','uPx','uBurst'].forEach(k=>oU[k]=gl.getUniformLocation(ORB,k));
  function buf(d){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,d,gl.STATIC_DRAW);return b;}
  const gR=buf(bR),gPh=buf(bPh),gSp=buf(bSp),gTl=buf(bTl),gCl=buf(bCl);

  /* dynamic points: core + arrivals + rescue threads */
  const DYN=700;
  const dPos=new Float32Array(DYN*3),dCol=new Float32Array(DYN*3),dSz=new Float32Array(DYN);
  const bdPos=gl.createBuffer(),bdCol=gl.createBuffer(),bdSz=gl.createBuffer();
  const PT=prog(`attribute vec3 aPos;attribute vec3 aCol;attribute float aSize;
    uniform mat4 uMVP;uniform float uPx;varying vec3 vCol;varying float vB;
    void main(){vec4 q=uMVP*vec4(aPos,1.);gl_Position=q;gl_PointSize=clamp(aSize*uPx/q.w,1.,60.);vCol=aCol;vB=clamp(1.6/q.w,.3,2.2);}`,FRAG);
  const pA={};['aPos','aCol','aSize'].forEach(k=>pA[k]=gl.getAttribLocation(PT,k));
  const pU={};['uMVP','uPx'].forEach(k=>pU[k]=gl.getUniformLocation(PT,k));

  /* arrivals (CPU) */
  function orbitPoint(R,ang,tx,ty){let p=[Math.cos(ang)*R,0,Math.sin(ang)*R];
    let cx=Math.cos(tx),sx=Math.sin(tx);p=[p[0],p[1]*cx-p[2]*sx,p[1]*sx+p[2]*cx];
    let cz=Math.cos(ty),sz=Math.sin(ty);p=[p[0]*cz-p[1]*sz,p[0]*sz+p[1]*cz,p[2]];return p;}
  const ARR=[];const NARR=26;
  function newArr(){const R=0.6+Math.random()*1.7,dir=Math.random()*6.283,el=(Math.random()-.5)*3;
    const er=3.6;const start=[Math.cos(dir)*er,el,Math.sin(dir)*er*0.8];
    return {start,ctrl:[(Math.random()-.5)*1.2,(Math.random()-.5)*1.2,(Math.random()-.5)*1.2],
      R,tx:Math.random()*3.14159,ty:Math.random()*6.283,ph:Math.random()*6.283,sp:(Math.random()<.5?1:-1)*0.5/Math.sqrt(R),u:Math.random()*0.4};}
  for(let i=0;i<NARR;i++)ARR.push(newArr());

  /* bloom FBO (fallback safe) */
  function mkfbo(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    return {t,f,ok:gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE};}
  const QUAD='attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const BLUR=prog(QUAD,`precision mediump float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uDir;
    void main(){vec4 s=texture2D(uTex,vUv)*.227;s+=texture2D(uTex,vUv+uDir*1.384)*.316;s+=texture2D(uTex,vUv-uDir*1.384)*.316;
      s+=texture2D(uTex,vUv+uDir*3.23)*.070;s+=texture2D(uTex,vUv-uDir*3.23)*.070;gl_FragColor=s;}`);
  const bT=gl.getUniformLocation(BLUR,'uTex'),bD=gl.getUniformLocation(BLUR,'uDir'),bP=gl.getAttribLocation(BLUR,'p');
  const COMP=prog(QUAD,`precision mediump float;varying vec2 vUv;uniform sampler2D uScene,uBloom;uniform float uInt;
    void main(){vec3 c=texture2D(uScene,vUv).rgb+texture2D(uBloom,vUv).rgb*uInt;c=vec3(1.)-exp(-c*1.5);gl_FragColor=vec4(c,1.);}`);
  const cS=gl.getUniformLocation(COMP,'uScene'),cB=gl.getUniformLocation(COMP,'uBloom'),cI=gl.getUniformLocation(COMP,'uInt'),cP=gl.getAttribLocation(COMP,'p');
  const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

  let SCENE,HA,HB,bloom=true,DPR,W,H,HW,HH;
  function alloc(){DPR=Math.min(devicePixelRatio||1,1.6);W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);HW=Math.max(2,W>>1);HH=Math.max(2,H>>1);cv.width=W;cv.height=H;
    try{SCENE=mkfbo(W,H);HA=mkfbo(HW,HH);HB=mkfbo(HW,HH);bloom=SCENE.ok&&HA.ok&&HB.ok;}catch(e){bloom=false;}}
  alloc();addEventListener('resize',alloc);
  function fq(loc){gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);}

  /* interaction */
  let ry=0,rx=-0.32,vry=0,vrx=0,drag=false,px=0,py=0,mx=0,my=0,burst=0;
  cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;burst=Math.min(.6,burst+.5);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;if(drag){vry+=(e.clientX-px)*.0002*6.283;vrx+=(e.clientY-py)*.0002*6.283;px=e.clientX;py=e.clientY;}});

  function ez(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function qb(a,c,b,t){const it=1-t;return [it*it*a[0]+2*it*t*c[0]+t*t*b[0],it*it*a[1]+2*it*t*c[1]+t*t*b[1],it*it*a[2]+2*it*t*c[2]+t*t*b[2]];}

  const t0=Date.now();let last=t0;
  setTimeout(()=>load.classList.add('gone'),700);
  setTimeout(()=>document.getElementById('line').classList.add('show'),1150);
  setTimeout(()=>document.getElementById('sub').classList.add('show'),1750);
  const LINES=[['<span class="lit">כלום</span> לא הולך לאיבוד.','כל נשמה נתפסת. כל מתנה מגיעה. אתם נותנים — Orbit מחזיק את השאר.'],
    ['כל משפחה — <span class="lit">במסלול</span>.','אף אחד לא נופל בין הכיסאות. הכבידה השקטה מחזיקה את כולם.'],
    ['אתם נותנים.<br><span class="lit">אנחנו מחזיקים</span> את השאר.','זה מה ש-Orbit באמת עושה — ששום דבר, ואף אחד, לא ילך לאיבוד.']];
  let li=0;
  if(!reduce)setInterval(()=>{const ln=document.getElementById('line'),sb=document.getElementById('sub');ln.classList.remove('show');sb.classList.remove('show');
    setTimeout(()=>{li=(li+1)%LINES.length;ln.innerHTML=LINES[li][0];sb.innerHTML=LINES[li][1];ln.classList.add('show');sb.classList.add('show');},1100);},7200);

  let heldShown=0;
  function drawORB(mvp,T){
    gl.useProgram(ORB);
    gl.bindBuffer(gl.ARRAY_BUFFER,gR);gl.enableVertexAttribArray(oA.aR);gl.vertexAttribPointer(oA.aR,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,gPh);gl.enableVertexAttribArray(oA.aPhase);gl.vertexAttribPointer(oA.aPhase,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,gSp);gl.enableVertexAttribArray(oA.aSpeed);gl.vertexAttribPointer(oA.aSpeed,1,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,gTl);gl.enableVertexAttribArray(oA.aTilt);gl.vertexAttribPointer(oA.aTilt,2,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,gCl);gl.enableVertexAttribArray(oA.aCol);gl.vertexAttribPointer(oA.aCol,3,gl.FLOAT,false,0,0);
    gl.uniformMatrix4fv(oU.uMVP,false,mvp);gl.uniform1f(oU.uT,T);gl.uniform1f(oU.uPx,66*DPR);gl.uniform1f(oU.uBurst,burst);
    gl.drawArrays(gl.POINTS,0,HELD);
  }
  function buildDyn(T,dt){
    let n=0;
    function push(x,y,z,r,g,b,s){dPos[n*3]=x;dPos[n*3+1]=y;dPos[n*3+2]=z;dCol[n*3]=r;dCol[n*3+1]=g;dCol[n*3+2]=b;dSz[n]=s;n++;}
    // core (warm heart) — layered for a glowing sun
    const cb=1+0.09*Math.sin(T*1.4)+burst*0.5;
    push(0,0,0, 1.0,0.86,0.5, 26*cb); push(0,0,0,1.0,0.92,0.62,15*cb); push(0,0,0,1.0,0.8,0.42,40*cb);
    // arrivals + rescue threads
    for(const a of ARR){
      a.u+=dt/3.2; if(a.u>=1){Object.assign(a,newArr());a.u=0;}
      const u=ez(Math.min(1,a.u));
      const tgt=orbitPoint(a.R,a.ph+T*a.sp,a.tx,a.ty);
      const p=qb(a.start,a.ctrl,tgt,u);
      const w=u; // cool -> warm as caught
      const r=0.5+0.5*w, g=0.6+0.26*w, bl=0.95-0.5*w;
      // rescue thread: samples from core to the soul (the hand of gravity)
      if(u<0.99){for(let s=1;s<=6;s++){const ts=u*(s/6);const tp=qb([0,0,0],a.ctrl,p,ts);
        push(tp[0],tp[1],tp[2], 1.0,0.82,0.45, 2.2*(1-s/7)*(0.4+0.6*u));}}
      push(p[0],p[1],p[2], r,g,bl, 3.4+2*w);
      if(n>=DYN-10)break;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,bdPos);gl.bufferData(gl.ARRAY_BUFFER,dPos.subarray(0,n*3),gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER,bdCol);gl.bufferData(gl.ARRAY_BUFFER,dCol.subarray(0,n*3),gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER,bdSz);gl.bufferData(gl.ARRAY_BUFFER,dSz.subarray(0,n),gl.DYNAMIC_DRAW);
    return n;
  }
  function drawDyn(mvp,n){
    gl.useProgram(PT);
    gl.bindBuffer(gl.ARRAY_BUFFER,bdPos);gl.enableVertexAttribArray(pA.aPos);gl.vertexAttribPointer(pA.aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bdCol);gl.enableVertexAttribArray(pA.aCol);gl.vertexAttribPointer(pA.aCol,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bdSz);gl.enableVertexAttribArray(pA.aSize);gl.vertexAttribPointer(pA.aSize,1,gl.FLOAT,false,0,0);
    gl.uniformMatrix4fv(pU.uMVP,false,mvp);gl.uniform1f(pU.uPx,66*DPR);
    gl.drawArrays(gl.POINTS,0,n);
  }

  function frame(){
    const now=Date.now(),T=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
    burst*=0.92;
    ry+=vry;rx+=vrx;vry*=.93;vrx*=.93;if(!drag)ry+=0.0013;
    rx+=((-0.32+my*.5)-rx)*.03;rx=Math.max(-1.25,Math.min(1.25,rx));ry+=mx*.0004;
    const mvp=mul(mul(mul(persp(.95,innerWidth/innerHeight,.1,20),tz(-4.4)),rX(rx)),rY(ry));
    const nDyn=buildDyn(T,dt);

    function scene(){
      gl.clearColor(0.008,0.009,0.024,1);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
      drawORB(mvp,T); drawDyn(mvp,nDyn);
    }
    if(bloom){
      gl.bindFramebuffer(gl.FRAMEBUFFER,SCENE.f);gl.viewport(0,0,W,H);scene();
      gl.disable(gl.BLEND);gl.useProgram(BLUR);gl.activeTexture(gl.TEXTURE0);gl.uniform1i(bT,0);
      gl.bindFramebuffer(gl.FRAMEBUFFER,HA.f);gl.viewport(0,0,HW,HH);gl.bindTexture(gl.TEXTURE_2D,SCENE.t);gl.uniform2f(bD,1/HW,0);fq(bP);
      gl.bindFramebuffer(gl.FRAMEBUFFER,HB.f);gl.bindTexture(gl.TEXTURE_2D,HA.t);gl.uniform2f(bD,0,1/HH);fq(bP);
      gl.bindFramebuffer(gl.FRAMEBUFFER,HA.f);gl.bindTexture(gl.TEXTURE_2D,HB.t);gl.uniform2f(bD,1/HW,0);fq(bP);
      gl.bindFramebuffer(gl.FRAMEBUFFER,HB.f);gl.bindTexture(gl.TEXTURE_2D,HA.t);gl.uniform2f(bD,0,1/HH);fq(bP);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
      gl.useProgram(COMP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,SCENE.t);gl.uniform1i(cS,0);
