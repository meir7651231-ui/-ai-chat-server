<title>Orbit · שאף אחד לא ייפול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--core:#ffcf6b;--warm:#ffe6b0;--ink:#f2efe6;--muted:#b9b3c6;--faint:#726f8a;
    --display:'Frank Ruhl Libre',Georgia,serif;--wm:'Sora',system-ui,sans-serif;--body:'Heebo',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#04060f;color:var(--ink);font-family:var(--body);font-weight:300;overflow:hidden;direction:rtl}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .ui{position:fixed;inset:0;pointer-events:none;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:28px 34px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:var(--wm);font-weight:800;letter-spacing:.15em;font-size:1.05rem;opacity:.92;display:flex;align-items:center;gap:9px}
  .brand .o{position:relative;width:19px;height:19px}
  .brand .o::before{content:"";position:absolute;inset:0;border:1.5px solid rgba(255,207,107,.5);border-radius:50%}
  .brand .o::after{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;background:var(--core);
    border-radius:50%;box-shadow:0 0 9px var(--core);transform-origin:0 11.5px;animation:sp 5s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cta{pointer-events:auto;font-family:var(--body);font-weight:600;font-size:.9rem;color:#241704;padding:10px 22px;border-radius:999px;
    background:linear-gradient(120deg,var(--warm),#ffb03a);text-decoration:none;transition:transform .18s,box-shadow .3s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(255,176,58,.5)}

  .center{position:fixed;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;padding:0 26px}
  .center .msg{text-align:center;max-width:22ch}
  .center .line{font-family:var(--display);font-weight:900;font-size:clamp(2rem,5.4vw,4rem);line-height:1.08;
    text-shadow:0 8px 60px rgba(0,0,0,.85);opacity:0;transform:translateY(18px);transition:opacity 1.1s,transform 1.1s}
  .center .line.show{opacity:1;transform:none}
  .center .line .lit{color:var(--core)}
  .center .sub{font-family:var(--body);color:var(--muted);font-size:1.05rem;margin-top:14px;opacity:0;transition:opacity 1.1s .2s}
  .center .sub.show{opacity:.92}

  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .counts{display:flex;gap:26px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em}
  .counts .v{font-family:var(--wm);font-weight:800;font-size:1.5rem;letter-spacing:0;font-variant-numeric:tabular-nums}
  .counts .held .v{color:var(--core)}
  .counts .lost .v{color:#7fe0c0}
  .counts .l{color:var(--faint);text-transform:uppercase;margin-top:1px}
  .hint{font-family:var(--mono);font-size:.68rem;color:var(--faint);letter-spacing:.06em}
  .hint b{color:var(--warm)}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#04060f;z-index:6;transition:opacity 1s}
  .loading.gone{opacity:0;pointer-events:none}
  .loading .l{font-family:var(--mono);font-size:.8rem;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;animation:pl 1.4s ease-in-out infinite}
  @keyframes pl{50%{opacity:.4}}
  @media (prefers-reduced-motion:reduce){.brand .o::after,.loading .l{animation:none}}
</style>

<canvas id="c"></canvas>
<div class="ui">
  <div class="top"><div class="brand"><span class="o"></span>ORBIT</div><a class="cta" href="#" onclick="return false">פתחו אתר →</a></div>
  <div class="foot">
    <div class="hint"><b>הזיזו</b> את היד — עזרו להחזיק · <b>לחצו</b> לאסוף</div>
    <div class="counts">
      <div class="held"><div class="v" id="held">0</div><div class="l">במסלול</div></div>
      <div class="lost"><div class="v" id="lost">0</div><div class="l">אבודים</div></div>
    </div>
  </div>
</div>
<div class="center"><div class="msg">
  <div class="line" id="line"><span class="lit">כלום</span> לא הולך לאיבוד.</div>
  <div class="sub" id="sub">כל נשמה נתפסת. כל מתנה מגיעה. אתם רק נותנים — Orbit מחזיק את השאר.</div>
</div></div>
<div class="loading" id="load"><div class="l">Orbit · מתעורר…</div></div>

<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cv=document.getElementById('c'),x=cv.getContext('2d'),load=document.getElementById('load');
  const heldEl=document.getElementById('held'),lostEl=document.getElementById('lost');
  let W,H,cx,cy,DPR,base;
  function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
    x.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H*0.52;base=Math.min(W,H);}
  size();addEventListener('resize',size);

  /* soft round glow sprite */
  function sprite(col){const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d');
    const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,col);rg.addColorStop(.35,col.replace('1)','.55)'));rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg;g.fillRect(0,0,64,64);return s;}
  const spWarm=sprite('rgba(255,224,170,1)'), spCool=sprite('rgba(150,178,235,1)'), spCore=sprite('rgba(255,214,140,1)');

  /* rings */
  const RINGS=[0.16,0.24,0.32,0.40,0.48].map((f,i)=>({R:base*f, w:(i%2?-1:1)*(0.10-i*0.012), cap: 26+i*12}));
  function ringR(i){return RINGS[i].R;}
  const lights=[]; let held=0, lost=0, spawnT=0, dramaT=0;

  function ringPos(ring,ang){const R=ringR(ring);return [cx+Math.cos(ang)*R, cy+Math.sin(ang)*R*0.56];}

  function spawn(){
    // choose a ring with free capacity (fill inner-out)
    let ring=-1;for(let i=0;i<RINGS.length;i++){const c=lights.filter(l=>l.ring===i&&l.mode==='orbit').length;if(c<RINGS[i].cap){ring=i;break;}}
    if(ring<0)return false;
    // start at a random edge point (drifting into the dark)
    const edge=Math.random()*6.283, er=base*0.75;
    const sx=cx+Math.cos(edge)* er*1.1, sy=cy+Math.sin(edge)* er*0.7;
    lights.push({mode:'arrive',ring,ang:Math.random()*6.283,u:0,
      sx,sy, ctrl:[cx+(Math.random()-.5)*base*0.2, cy+(Math.random()-.5)*base*0.2], warm:0, size:1.4+Math.random()*1.2, tw:Math.random()*6.283});
    return true;
  }

  function drama(){ // a soul begins to drift; gravity rescues it
    const orb=lights.filter(l=>l.mode==='orbit'); if(!orb.length)return;
    const l=orb[(Math.random()*orb.length)|0]; l.mode='rescue'; l.u=0;
    const p=ringPos(l.ring,l.ang);
    const dir=Math.random()*6.283;
    l.sx=p[0]; l.sy=p[1];
    l.driftX=p[0]+Math.cos(dir)*base*0.28; l.driftY=p[1]+Math.sin(dir)*base*0.22;
    l.ctrl=[cx+(Math.random()-.5)*base*0.15,cy+(Math.random()-.5)*base*0.15];
  }

  const mouse={x:-9999,y:-9999,on:false};
  addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;});
  addEventListener('pointerleave',()=>mouse.on=false);
  let pulse=0;
  addEventListener('pointerdown',()=>{pulse=1;});

  function qbez(a,c,b,t){const it=1-t;return [it*it*a[0]+2*it*t*c[0]+t*t*b[0], it*it*a[1]+2*it*t*c[1]+t*t*b[1]];}
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

  const t0=Date.now();
  setTimeout(()=>load.classList.add('gone'),650);
  setTimeout(()=>{document.getElementById('line').classList.add('show');},1100);
  setTimeout(()=>{document.getElementById('sub').classList.add('show');},1700);
  // gentle message cycle
  const LINES=[['<span class="lit">כלום</span> לא הולך לאיבוד.','כל נשמה נתפסת. כל מתנה מגיעה. אתם רק נותנים — Orbit מחזיק את השאר.'],
    ['כל משפחה — <span class="lit">במסלול</span>.','אף אחד לא נופל בין הכיסאות. הכבידה השקטה מחזיקה את כולם.'],
    ['אתם נותנים.<br><span class="lit">אנחנו מחזיקים</span> את השאר.','זה מה ש-Orbit באמת עושה — שומר שכלום, ואף אחד, לא ילך לאיבוד.']];
  let li=0;
  if(!reduce) setInterval(()=>{const line=document.getElementById('line'),sub=document.getElementById('sub');
    line.classList.remove('show');sub.classList.remove('show');
    setTimeout(()=>{li=(li+1)%LINES.length;line.innerHTML=LINES[li][0];sub.textContent='';sub.innerHTML=LINES[li][1];
      line.classList.add('show');sub.classList.add('show');},1100);},7000);

  let last=t0;
  function frame(){
    const now=Date.now(), T=(now-t0)/1000, dt=Math.min(0.05,(now-last)/1000); last=now;

    // spawn cadence (fill the system)
    spawnT+=dt; if(spawnT>0.5){spawnT=0; if(lights.filter(l=>l.mode==='orbit').length < RINGS.reduce((s,r)=>s+r.cap,0)) spawn();}
    // rescue drama once the system is fairly full
    dramaT+=dt; if(dramaT>2.4 && held>40){dramaT=0; if(Math.random()<0.7) drama();}
    pulse*=0.94;

    // trails: gentle dark wash
    x.globalCompositeOperation='source-over';
    x.fillStyle='rgba(4,6,15,0.20)'; x.fillRect(0,0,W,H);
    // deep radial ground (subtle, keeps edges dark = the "loss" zone)
    const bgg=x.createRadialGradient(cx,cy,0,cx,cy,base*0.9);
    bgg.addColorStop(0,'rgba(24,20,44,0.10)');bgg.addColorStop(1,'rgba(2,3,9,0.22)');
    x.fillStyle=bgg; x.fillRect(0,0,W,H);

    x.globalCompositeOperation='lighter';

    // faint orbit rings
    RINGS.forEach((r,i)=>{x.beginPath();x.ellipse(cx,cy,r.R,r.R*0.56,0,0,7);
      x.strokeStyle='rgba(255,207,107,'+(0.05-i*0.006)+')';x.lineWidth=1;x.stroke();});

    // core (breathing warm heart)
    const cb=1+0.08*Math.sin(T*1.4)+pulse*0.5, cs=base*0.14*cb;
    x.drawImage(spCore, cx-cs, cy-cs, cs*2, cs*2);
    x.drawImage(spCore, cx-cs*0.5, cy-cs*0.5, cs, cs);

    held=0;
    for(let k=lights.length-1;k>=0;k--){
      const l=lights[k];
      if(l.mode==='arrive'){
        l.u+=dt/2.4; const u=ease(Math.min(1,l.u));
        l.ang+=RINGS[l.ring].w*dt; // target keeps orbiting
        const tgt=ringPos(l.ring,l.ang);
        const p=qbez([l.sx,l.sy],l.ctrl,tgt,u);
        l.x=p[0]; l.y=p[1]; l.warm=u;
        // rescue thread from core (the hand of gravity)
        if(u<0.98){x.strokeStyle='rgba(255,206,120,'+(0.16*(1-u))+')';x.lineWidth=1;
          x.beginPath();x.moveTo(cx,cy);const m=qbez([cx,cy],l.ctrl,[l.x,l.y],0.6);x.lineTo(l.x,l.y);x.stroke();}
        drawLight(l, 0.5+0.5*u, u);
        if(l.u>=1){l.mode='orbit'; l.flash=1;}
      } else if(l.mode==='rescue'){
        l.u+=dt/2.8; const u=l.u;
        // out then back: 0..0.45 drift toward dark (dim), 0.45..1 pulled home
        if(u<0.45){const k2=u/0.45; l.x=l.sx+(l.driftX-l.sx)*ease(k2); l.y=l.sy+(l.driftY-l.sy)*ease(k2); l.warm=1-0.6*k2;
          drawLight(l, 0.7-0.35*k2, l.warm);
        } else {
          const k2=(u-0.45)/0.55; l.ang+=RINGS[l.ring].w*dt; const tgt=ringPos(l.ring,l.ang);
          const p=qbez([l.driftX,l.driftY],l.ctrl,tgt,ease(k2)); l.x=p[0];l.y=p[1]; l.warm=0.4+0.6*k2;
          x.strokeStyle='rgba(255,206,120,'+(0.22*k2)+')';x.lineWidth=1.2;
          x.beginPath();x.moveTo(cx,cy);x.lineTo(l.x,l.y);x.stroke();
          drawLight(l, 0.6+0.4*k2, l.warm);
        }
        if(l.u>=1){l.mode='orbit'; l.flash=1;}
      } else { // orbit
        held++;
        l.ang+=RINGS[l.ring].w*dt;
        let bx=cx+Math.cos(l.ang)*ringR(l.ring), by=cy+Math.sin(l.ang)*ringR(l.ring)*0.56;
        // your hand helps hold (gentle attract) + click pulse steadies
        if(mouse.on){const dx=mouse.x-bx,dy=mouse.y-by,d=Math.hypot(dx,dy);
          if(d<130){bx+=dx*0.06;by+=dy*0.06;}}
        l.x=bx; l.y=by; l.warm=1;
        const fl=l.flash?(l.flash*=0.9,l.flash):0;
        drawLight(l, 0.85+0.15*Math.sin(T*2+l.tw)+fl+pulse*0.3, 1);
      }
    }

    // counters
    heldEl.textContent=held; lostEl.textContent=lost; // lost stays 0 — the promise

    // vignette
    x.globalCompositeOperation='source-over';
    const vg=x.createRadialGradient(cx,cy,base*0.3,cx,cy,base*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,3,9,0.55)');
    x.fillStyle=vg;x.fillRect(0,0,W,H);

    requestAnimationFrame(frame);
  }
  function drawLight(l,bright,warm){
    const sp = warm>0.5?spWarm:spCool;
    const r=l.size*(2.6+bright*2.2);
    x.globalAlpha=Math.max(0,Math.min(1,bright));
    x.drawImage(sp, l.x-r, l.y-r, r*2, r*2);
    // bright core dot
    x.globalAlpha=Math.max(0,Math.min(1,bright))*0.9;
    x.drawImage(spWarm, l.x-l.size, l.y-l.size, l.size*2, l.size*2);
    x.globalAlpha=1;
  }
  // seed a few already-held so it opens alive
  for(let i=0;i<60;i++){let ring=i%RINGS.length; if(lights.filter(l=>l.ring===ring&&l.mode==='orbit').length>=RINGS[ring].cap)ring=0;
    lights.push({mode:'orbit',ring,ang:Math.random()*6.283,warm:1,size:1.4+Math.random()*1.2,tw:Math.random()*6.283,flash:0});}
  frame();
})();
</script>
