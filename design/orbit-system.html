<title>Orbit · המערכת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --space:#070c1e;--space2:#0b1330;--panel:#111a38;--line:#1d2a50;--line2:#2b3a68;
    --ink:#eaf0ff;--muted:#93a0c8;--faint:#5a668f;
    --core:#ffcf6b;--core2:#ffb03a;--glow:#ffd98a;--accent:#8ea2ff;
    --display:'Frank Ruhl Libre',Georgia,serif;--wm:'Sora',system-ui,sans-serif;
    --body:'Heebo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 44%,#0d1738 0%,var(--space) 62%,#04060f 100%);
    color:var(--ink);font-family:var(--body);font-weight:300;overflow:hidden;direction:rtl;position:relative}
  #bg{position:fixed;inset:0;z-index:0}
  .stage{position:fixed;inset:0;z-index:1}

  /* header overlay */
  .top{position:absolute;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:26px 34px;z-index:6}
  .brand{font-family:var(--wm);font-weight:800;letter-spacing:.14em;font-size:1.05rem;display:flex;align-items:center;gap:9px}
  .brand .o{position:relative;width:19px;height:19px}
  .brand .o::before{content:"";position:absolute;inset:0;border:1.5px solid var(--accent);border-radius:50%;opacity:.6}
  .brand .o::after{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;background:var(--core);
    border-radius:50%;box-shadow:0 0 9px var(--core);transform-origin:0 11.5px;animation:sp 5s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cta{font-family:var(--body);font-weight:600;font-size:.9rem;color:#0a0f22;padding:10px 22px;border-radius:999px;
    background:linear-gradient(120deg,var(--glow),var(--core2));text-decoration:none;transition:transform .18s,box-shadow .3s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(255,176,58,.5)}

  .headline{position:absolute;top:15%;inset-inline:0;text-align:center;z-index:6;pointer-events:none;padding:0 24px}
  .headline .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent)}
  .headline h1{font-family:var(--display);font-weight:900;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.08;margin-top:12px;text-wrap:balance;
    text-shadow:0 6px 40px rgba(0,0,0,.6)}
  .headline h1 .lit{color:var(--core)}
  .headline p{color:var(--muted);margin-top:10px;font-size:1.05rem;max-width:44ch;margin-inline:auto}

  /* core */
  .core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;
    width:150px;height:150px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 42%, #fff2d0 0%, var(--core) 30%, var(--core2) 58%, #a35f13 100%);
    box-shadow:0 0 60px -6px var(--core2),0 0 130px -20px var(--core2),inset 0 -10px 30px rgba(120,60,0,.5);
    animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{50%{box-shadow:0 0 80px -4px var(--core2),0 0 170px -18px var(--core2),inset 0 -10px 30px rgba(120,60,0,.5)}}
  .core .nm{font-family:var(--display);font-weight:900;font-size:1.15rem;color:#3a2405;line-height:1.05;padding:0 8px}
  .core .lbl{font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;color:#6e4410;margin-top:3px;text-transform:uppercase}

  /* satellites */
  .sat{position:absolute;top:0;left:0;z-index:5;transform:translate(-50%,-50%);will-change:transform;cursor:pointer}
  .sat .orb{width:var(--sz,58px);height:var(--sz,58px);border-radius:50%;display:grid;place-items:center;position:relative;
    background:linear-gradient(160deg,#16224a,#0b1430);
    border:1px solid var(--line2);box-shadow:0 8px 26px -10px #000, inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .3s, box-shadow .3s, border-color .3s;font-size:1.4rem}
  .sat .cap{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--body);font-weight:500;font-size:.82rem;color:var(--muted);transition:color .3s;pointer-events:none}
  .sat:hover{z-index:9}
  .sat:hover .orb, .sat.pin .orb{transform:scale(1.28);border-color:var(--dot,var(--accent));
    box-shadow:0 0 0 4px color-mix(in srgb, var(--dot,var(--accent)) 22%, transparent),0 12px 34px -8px #000}
  .sat:hover .cap, .sat.pin .cap{color:var(--ink)}
  .sat .ping{position:absolute;inset:0;border-radius:50%;border:1px solid var(--dot,var(--accent));opacity:0}
  .sat:hover .ping{animation:ping 1.3s ease-out infinite}
  @keyframes ping{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

  /* info panel */
  .panel{position:absolute;bottom:34px;left:50%;transform:translateX(-50%) translateY(16px);z-index:8;
    width:min(520px,calc(100% - 48px));background:linear-gradient(160deg,rgba(17,26,56,.92),rgba(9,14,34,.86));
    border:1px solid var(--line);border-radius:18px;padding:18px 22px;backdrop-filter:blur(14px);
    display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;
    box-shadow:0 30px 80px -34px #000}
  .panel.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .panel .em{font-size:2rem;width:56px;height:56px;display:grid;place-items:center;border-radius:14px;flex:none;
    background:radial-gradient(120% 120% at 30% 0%, #1a2750, #0b1430);border:1px solid var(--line2)}
  .panel .tx h3{font-family:var(--display);font-weight:700;font-size:1.2rem}
  .panel .tx p{color:var(--muted);font-size:.9rem;margin-top:2px}
  .panel .stat{margin-inline-start:auto;text-align:center;flex:none;padding-inline-start:14px;border-inline-start:1px solid var(--line)}
  .panel .stat .n{font-family:var(--wm);font-weight:800;font-size:1.5rem;color:var(--core);font-variant-numeric:tabular-nums}
  .panel .stat .l{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin-top:2px}
  .panel .hintx{position:absolute;top:-24px;right:2px;font-family:var(--mono);font-size:.66rem;color:var(--faint);letter-spacing:.06em}

  .foot{position:absolute;bottom:16px;inset-inline:0;text-align:center;z-index:6;font-family:var(--mono);
    font-size:.68rem;letter-spacing:.08em;color:var(--faint);pointer-events:none}
  @media (prefers-reduced-motion:reduce){.core,.brand .o::after{animation:none}}
  @media (max-width:640px){.headline{top:11%} .core{width:118px;height:118px} .panel .stat{display:none}}
</style>

<canvas id="bg"></canvas>
<div class="stage" id="stage">
  <div class="core"><div><div class="nm">מאור<br>החסד</div><div class="lbl">הארגון שלך</div></div></div>
</div>

<div class="top">
  <div class="brand"><span class="o"></span>ORBIT</div>
  <a class="cta" href="#" onclick="return false">פתחו אתר →</a>
</div>
<div class="headline">
  <span class="eyebrow">Orbit · פלטפורמת האתרים</span>
  <h1>כל הארגון שלך —<br><span class="lit">במסלול אחד.</span></h1>
  <p>הליבה במרכז. כל יכולת מקיפה אותה, במקומה, בהישג-יד. זו התחושה ש-Orbit נותן: הכול מסודר, ואתם רואים הכול.</p>
</div>

<div class="panel" id="panel">
  <div class="hintx">רחפו על יכולת · לחצו לנעוץ</div>
  <div class="em" id="pEm">✨</div>
  <div class="tx"><h3 id="pH">—</h3><p id="pP">—</p></div>
  <div class="stat"><div class="n" id="pN">—</div><div class="l" id="pL"></div></div>
</div>
<div class="foot">מערכת אחת · מקומית-תחילה · הנתונים שלכם · עובד גם אופליין</div>

<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const stage=document.getElementById('stage');

  const SATS=[
    {e:'👨‍👩‍👧',nm:'משפחות',d:'CRM מלא — פרטים, בני-משפחה, סטטוס וקשר',n:'186',l:'פעילות',c:'#8ea2ff',ring:0,ang:-20,sp:1},
    {e:'💛',nm:'תרומות',d:'רישום, מעקב והוראות-קבע — כל שקל במקומו',n:'₪52K',l:'החודש',c:'#ffd98a',ring:0,ang:52,sp:1},
    {e:'🧾',nm:'קבלות §46',d:'קבלות-מס רציפות, חתומות, מוכנות לרו״ח',n:'1,240',l:'השנה',c:'#7fe0c0',ring:0,ang:124,sp:1},
    {e:'📅',nm:'לוח עברי',d:'לוח עברי-לועזי מלא, אירועים ותזכורות',n:'עברי',l:'מובנה',c:'#c9a2ff',ring:0,ang:196,sp:1},
    {e:'✨',nm:'תורמים',d:'ניהול-תורמים, חלון-עבודה ומודיעין',n:'420',l:'תורמים',c:'#ffb0d0',ring:1,ang:14,sp:-0.62},
    {e:'🚚',nm:'חלוקה',d:'מתנדבים, ימי-חלוקה ומעקב-מסירות',n:'38',l:'מתנדבים',c:'#7fd0e0',ring:1,ang:110,sp:-0.62},
    {e:'📊',nm:'דוחות',d:'מבט-הנהלה, ייצוא וקבלות — הכול חוצה-מודולים',n:'∞',l:'תובנות',c:'#ffcaa0',ring:1,ang:214,sp:-0.62},
  ];

  const panel=document.getElementById('panel');
  const pEm=document.getElementById('pEm'),pH=document.getElementById('pH'),pP=document.getElementById('pP'),pN=document.getElementById('pN'),pL=document.getElementById('pL');
  let pinned=null, hovered=null;

  const els=SATS.map((s,i)=>{
    const el=document.createElement('div'); el.className='sat'; el.style.setProperty('--dot',s.c);
    el.innerHTML=`<div class="orb" style="--sz:${s.ring? 52:60}px"><span class="ping"></span>${s.e}</div><div class="cap">${s.nm}</div>`;
    el.addEventListener('pointerenter',()=>{hovered=s;show(s);});
    el.addEventListener('pointerleave',()=>{hovered=null;if(!pinned)hide();else show(pinned);});
    el.addEventListener('click',()=>{ if(pinned===s){pinned=null;el.classList.remove('pin');hide();}
      else{els.forEach(e=>e.classList.remove('pin'));pinned=s;el.classList.add('pin');show(s);} });
    stage.appendChild(el); return el;
  });
  function show(s){pEm.textContent=s.e;pH.textContent=s.nm;pP.textContent=s.d;pN.textContent=s.n;pL.textContent=s.l;
    panel.style.setProperty('--dot',s.c);panel.classList.add('show');}
  function hide(){panel.classList.remove('show');}

  /* canvas: starfield + orbit rings + connection line */
  const bg=document.getElementById('bg'),x=bg.getContext('2d');
  let W,H,cx,cy,R0,R1,DPR,stars;
  function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;bg.width=W*DPR;bg.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);
    cx=W/2;cy=H/2;const base=Math.min(W,H);R0=base*0.24;R1=base*0.38;
    stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,a:Math.random()});}
  size();addEventListener('resize',size);

  let t=0;
  function frame(){
    t+=reduce?0:0.0022;
    x.clearRect(0,0,W,H);
    // stars
    for(const s of stars){s.a+=.008;const al=.25+.3*(1+Math.sin(s.a))/2;x.fillStyle='rgba(150,165,220,'+al+')';x.fillRect(s.x,s.y,s.r,s.r);}
    // orbit rings
    [R0,R1].forEach((R,ri)=>{x.beginPath();x.arc(cx,cy,R,0,7);x.strokeStyle=ri?'rgba(142,162,255,.13)':'rgba(255,207,107,.16)';x.lineWidth=1;x.stroke();});
    // position satellites + connection line for active
    const active=hovered||pinned;
    SATS.forEach((s,i)=>{
      const R=s.ring?R1:R0; const a=(s.ang*Math.PI/180)+t*s.sp;
      const sx=cx+Math.cos(a)*R, sy=cy+Math.sin(a)*R*0.62; // slight elliptical tilt
      const el=els[i]; el.style.transform=`translate(${sx}px,${sy}px) translate(-50%,-50%)`;
      el.style.zIndex = (active===s)?9 : (5 + Math.round((sy/H)*3));
      if(active===s){ x.beginPath();x.moveTo(cx,cy);x.lineTo(sx,sy);
        x.strokeStyle=hexA(s.c,.5);x.lineWidth=1.4;x.setLineDash([3,4]);x.stroke();x.setLineDash([]);
        x.beginPath();x.arc(sx,sy,3,0,7);x.fillStyle=s.c;x.fill(); }
    });
    requestAnimationFrame(frame);
  }
  function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
  frame();
})();
</script>
