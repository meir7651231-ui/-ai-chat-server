<title>Orbit · המחולל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#070815;--bg2:#0c0e20;--panel:#12142a;--panel2:#181b36;--line:#262a4d;--line2:#333868;
    --ink:#eef0ff;--muted:#9ea3cf;--faint:#5c6094;
    --violet:#7c5cff;--violet-2:#a78bff;--cyan:#3ad0ff;--gold:#ffd24a;--gold-2:#ffe089;
    --good:#4fd1a1;--warn:#f6b95a;--crit:#ff6b8b;
    --display:'Frank Ruhl Libre',Georgia,serif;--wm:'Sora',system-ui,sans-serif;
    --body:'Heebo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.65;
    direction:rtl;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  #stars{position:fixed;inset:0;z-index:-1;opacity:.5}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  .mono{font-family:var(--mono)}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}

  header{padding:54px 0 26px;text-align:center}
  .brand{font-family:var(--wm);font-weight:800;letter-spacing:.06em;font-size:1.05rem;display:inline-flex;align-items:center;gap:9px;color:var(--muted)}
  .brand .dot{position:relative;width:18px;height:18px}
  .brand .dot::before{content:"";position:absolute;inset:0;border:1.4px solid var(--violet-2);border-radius:50%;opacity:.5}
  .brand .dot::after{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;background:var(--gold);
    border-radius:50%;box-shadow:0 0 8px var(--gold);transform-origin:0 11px;animation:sp 4s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,5.5vw,4rem);line-height:1.05;margin:18px 0 10px;text-wrap:balance}
  h1 .lit{background:linear-gradient(115deg,var(--violet-2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);font-size:1.1rem;max-width:52ch;margin:0 auto}

  /* compose panel */
  .compose{max-width:820px;margin:34px auto 0;background:linear-gradient(160deg,rgba(24,27,54,.9),rgba(12,14,32,.82));
    border:1px solid var(--line);border-radius:22px;padding:24px;backdrop-filter:blur(14px);
    box-shadow:0 30px 90px -40px rgba(0,0,0,.9)}
  .compose .lead{font-family:var(--display);font-size:1.25rem;font-weight:700;margin-bottom:4px}
  .compose .hint{color:var(--faint);font-size:.85rem;margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line2);
    background:#0e1024;color:var(--muted);cursor:pointer;font-size:.94rem;font-weight:400;
    transition:all .2s;user-select:none}
  .chip .e{font-size:1.1rem}
  .chip:hover{border-color:var(--violet);color:var(--ink)}
  .chip.on{background:linear-gradient(120deg,rgba(124,92,255,.22),rgba(58,208,255,.14));border-color:var(--violet);color:#fff}
  .chip.on .tick{color:var(--gold)}
  .chip .tick{opacity:0;transition:opacity .2s}
  .chip.on .tick{opacity:1}
  .buildrow{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
  .build{border:0;cursor:pointer;font-family:var(--body);font-weight:700;font-size:1.02rem;color:#0a0a16;padding:14px 30px;border-radius:13px;
    background:linear-gradient(120deg,var(--gold-2),var(--gold));transition:transform .18s,box-shadow .3s;position:relative;overflow:hidden}
  .build:hover{transform:translateY(-2px);box-shadow:0 16px 40px -12px rgba(255,210,74,.5)}
  .build:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
  .buildrow .cnt{color:var(--faint);font-family:var(--mono);font-size:.82rem}

  /* dashboard */
  .dash{max-width:1200px;margin:40px auto 90px;min-height:120px}
  .empty{text-align:center;color:var(--faint);padding:70px 20px;font-size:1rem;border:1px dashed var(--line);border-radius:20px}
  .empty .big{font-size:2rem;margin-bottom:8px;opacity:.7}
  .buildlog{font-family:var(--mono);font-size:.8rem;color:var(--cyan);text-align:center;height:20px;margin-bottom:14px;letter-spacing:.04em}

  .modules{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .mod{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:22px;
    opacity:0;transform:translateY(20px) scale(.98);transition:opacity .6s,transform .6s;position:relative;overflow:hidden}
  .mod.in{opacity:1;transform:none}
  .mod .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .mod .mh h3{font-family:var(--display);font-weight:700;font-size:1.15rem}
  .mod .mh .tag{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;
    border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}
  @media(max-width:900px){.col8,.col6,.col4{grid-column:span 12}}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:620px){.kpis{grid-template-columns:1fr}}
  .kpi{background:radial-gradient(120% 120% at 20% 0%, #1a1d3a, #10122600);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi .l{font-size:.82rem;color:var(--muted)}
  .kpi .v{font-family:var(--wm);font-weight:800;font-size:1.9rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-family:var(--mono);font-size:.74rem;margin-top:4px}
  .kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--crit)}

  /* chart */
  .chart-wrap{position:relative;height:220px}
  .chart-wrap canvas{width:100%;height:100%;display:block}
  .tt{position:absolute;pointer-events:none;background:#0b0c22;border:1px solid var(--line2);border-radius:8px;
    padding:6px 10px;font-family:var(--mono);font-size:.74rem;color:var(--ink);transform:translate(-50%,-130%);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}
  th{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;transition:color .2s}
  th:hover{color:var(--ink)}
  th .ar{opacity:.5;font-size:.7rem}
  tbody tr{transition:background .2s}
  tbody tr:hover{background:rgba(124,92,255,.07)}
  .pill{font-family:var(--mono);font-size:.68rem;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
  .pill.active{background:rgba(79,209,161,.15);color:var(--good)}
  .pill.risk{background:rgba(255,107,139,.15);color:var(--crit)}
  .pill.inactive{background:rgba(154,163,207,.12);color:var(--muted)}

  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .dow{font-family:var(--mono);font-size:.66rem;color:var(--faint);text-align:center;padding-bottom:4px}
  .cal .cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:.82rem;color:var(--muted);position:relative;transition:all .2s}
  .cal .cell.has{color:var(--ink);border-color:var(--violet);background:rgba(124,92,255,.1);cursor:pointer}
  .cal .cell.has:hover{background:rgba(124,92,255,.2)}
  .cal .cell .dots{display:flex;gap:2px;margin-top:3px}
  .cal .cell .dots i{width:4px;height:4px;border-radius:50%;background:var(--gold)}
  .cal .cell.today{outline:2px solid var(--gold);outline-offset:-2px}

  /* cockpit */
  .task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);transition:opacity .3s,transform .3s}
  .task .sev{width:4px;align-self:stretch;border-radius:4px;min-height:36px}
  .sev.risk{background:var(--crit)}.sev.due{background:var(--gold)}.sev.warm{background:var(--cyan)}
  .task .who{flex:1}
  .task .who .nm{font-weight:500}
  .task .who .rz{font-size:.8rem;color:var(--muted)}
  .task .kind{font-family:var(--mono);font-size:.66rem;color:var(--faint);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .task .done{border:0;cursor:pointer;background:rgba(79,209,161,.14);color:var(--good);font-family:var(--body);font-weight:500;
    padding:8px 14px;border-radius:10px;font-size:.85rem;transition:background .2s}
  .task .done:hover{background:rgba(79,209,161,.26)}
  .task.gone{opacity:0;transform:translateX(30px)}

  .theme-note{text-align:center;color:var(--faint);font-family:var(--mono);font-size:.76rem;margin-top:26px;letter-spacing:.03em}
</style>

<canvas id="stars"></canvas>

<header class="wrap">
  <div class="brand"><span class="dot"></span>ORBIT · המחולל</div>
  <h1>משפט אחד.<br><span class="lit">מערכת שלמה.</span></h1>
  <p>בחרו מה הארגון צריך — והמערכת מרכיבה מולכם דשבורד חי ומתפקד, מהקטלוג. זו לא תמונה: הכל אינטראקטיבי.</p>
</header>

<div class="wrap">
  <div class="compose">
    <div class="lead">מה תרצו שהמערכת שלכם תעשה?</div>
    <div class="hint">בחרו יכולות (אפשר כמה), ולחצו "בנה לי מערכת".</div>
    <div class="chips" id="chips"></div>
    <div class="buildrow">
      <button class="build" id="buildBtn" disabled>✦ בנה לי מערכת</button>
      <span class="cnt" id="cnt">0 יכולות נבחרו</span>
    </div>
  </div>

  <div class="dash" id="dash">
    <div class="empty" id="empty"><div class="big">🌌</div>בחרו יכולות למעלה — והמערכת תיבנה כאן.</div>
  </div>
</div>

<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ambient starfield */
  (function(){const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,st;
    function s(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);
      W=innerWidth;H=innerHeight;st=[];for(let i=0;i<90;i++)st.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,a:Math.random()});}
    s();addEventListener('resize',s);
    function g(){x.clearRect(0,0,W,H);for(const p of st){p.a+=.01;const al=.3+.35*(1+Math.sin(p.a))/2;
      x.fillStyle='rgba(160,150,230,'+al+')';x.fillRect(p.x,p.y,p.r,p.r);}if(!reduce)requestAnimationFrame(g);}g();})();

  /* deterministic sample data */
  const MONTHS=['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
  const DON=[18,22,19,27,31,26,34,29,41,38,44,52].map(v=>v*1000);
  const FAMS=[
    ['משפחת כהן','ירושלים','052-1234567','active'],['משפחת לוי','בני ברק','053-2345678','active'],
    ['משפחת מזרחי','צפת','054-3456789','risk'],['משפחת פרץ','אשדוד','050-4567890','active'],
    ['משפחת ביטון','נתניה','058-5678901','inactive'],['משפחת דהן','חיפה','052-6789012','active'],
    ['משפחת אזולאי','טבריה','053-7890123','risk'],['משפחת גבאי','מודיעין','054-8901234','active'],
  ];
  const TASKS=[
    ['hok','משפחת כהן','הו״ק החודש טרם נרשמה','due'],
    ['call','דוד לוי','5 חודשים בלי קשר — בסיכון נטישה','risk'],
    ['thanks','שרה מזרחי','תרמה אתמול ₪500 — תודה ממתינה','warm'],
    ['call','יוסי פרץ','הבטיח לחזור אחרי החג','warm'],
    ['hok','רבקה דהן','הו״ק פגה — לחדש','due'],
  ];
  const EVENTS={3:['ברית'],9:['חלוקה'],14:['אירוע התרמה'],17:['ריקון קופות'],23:['בר-מצווה'],28:['ישיבת ועד']};

  /* module catalog */
  const CAT=[
    {id:'kpi',   e:'📊', label:'סקירת-מצב', tag:'KPI', col:'col12', need:[]},
    {id:'chart', e:'📈', label:'תרומות',    tag:'גרף שנתי', col:'col8'},
    {id:'cockpit',e:'🎯', label:'חלון-העבודה', tag:'תור משימות', col:'col4'},
    {id:'families',e:'👨‍👩‍👧', label:'משפחות', tag:'טבלה', col:'col8'},
    {id:'calendar',e:'📅', label:'לוח עברי', tag:'חודש', col:'col4'},
  ];
  const sel=new Set();
  const chips=document.getElementById('chips');
  chips.innerHTML=CAT.map(m=>`<div class="chip" data-id="${m.id}"><span class="e">${m.e}</span>${m.label}<span class="tick">✓</span></div>`).join('');
  const cntEl=document.getElementById('cnt'), buildBtn=document.getElementById('buildBtn');
  chips.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    const id=ch.dataset.id; if(sel.has(id)){sel.delete(id);ch.classList.remove('on');}else{sel.add(id);ch.classList.add('on');}
    cntEl.textContent=sel.size+' יכולות נבחרו'; buildBtn.disabled=sel.size===0;
  }));

  const dash=document.getElementById('dash');

  buildBtn.addEventListener('click',build);
  function build(){
    const chosen=CAT.filter(m=>sel.has(m.id));
    const o=buildBtn.textContent; buildBtn.disabled=true; buildBtn.textContent='מרכיב… ✦';
    dash.innerHTML='<div class="buildlog" id="blog"></div><div class="modules" id="mods"></div>';
    const mods=document.getElementById('mods'), blog=document.getElementById('blog');
    const steps=['קורא קטלוג-אטומים…','מחווט מודולים…','מלביש ערכת-נושא…','מזרים נתונים…','מוכן ✓'];
    let si=0; const bt=setInterval(()=>{blog.textContent=steps[si++]||''; if(si>steps.length){clearInterval(bt);}},reduce?1:260);

    chosen.forEach((m,i)=>{
      const el=document.createElement('div'); el.className='mod '+m.col;
      el.innerHTML=`<div class="mh"><h3>${m.e} ${m.label}</h3><span class="tag">${m.tag}</span></div><div class="body"></div>`;
      mods.appendChild(el);
      const body=el.querySelector('.body');
      const delay=reduce?0:420+i*230;
      setTimeout(()=>{ el.classList.add('in'); RENDER[m.id](body); }, delay);
    });
    setTimeout(()=>{buildBtn.textContent=o; buildBtn.disabled=false;}, reduce?50:420+chosen.length*230+400);
  }

  const RENDER={
    kpi(b){
      const data=[['תרומות החודש','₪',52000,'+18%','up'],['משפחות פעילות','',186,'+4','up'],['קבלות §46 השנה','',1240,'+312','up']];
      b.innerHTML='<div class="kpis">'+data.map(d=>
        `<div class="kpi"><div class="l">${d[0]}</div><div class="v" data-to="${d[2]}" data-pre="${d[1]}">0</div><div class="d ${d[4]}">${d[3]} מהחודש שעבר</div></div>`).join('')+'</div>';
      b.querySelectorAll('.v').forEach(v=>countUp(v,+v.dataset.to,v.dataset.pre));
    },
    chart(b){
      b.innerHTML='<div class="chart-wrap"><canvas></canvas><div class="tt"></div></div>';
      drawChart(b.querySelector('canvas'), b.querySelector('.tt'));
    },
    cockpit(b){
      b.innerHTML=TASKS.map((t,i)=>`<div class="task" data-i="${i}"><div class="sev ${t[3]}"></div>
        <div class="who"><div class="nm">${t[1]}</div><div class="rz">${t[2]}</div></div>
        <span class="kind">${({hok:'הו״ק',call:'שיחה',thanks:'תודה'})[t[0]]}</span>
        <button class="done">✓ בוצע</button></div>`).join('');
      b.querySelectorAll('.done').forEach(btn=>btn.addEventListener('click',e=>{
        const row=e.target.closest('.task'); row.classList.add('gone'); setTimeout(()=>row.remove(),320);
      }));
    },
    families(b){
      let sortKey=0, asc=true;
      const cols=['שם','עיר','טלפון','סטטוס'];
      function render(){
        const rows=[...FAMS].sort((a,b2)=>{const r=(''+a[sortKey]).localeCompare(''+b2[sortKey],'he');return asc?r:-r;});
        b.innerHTML='<div style="overflow-x:auto"><table><thead><tr>'+cols.map((c,i)=>
          `<th data-k="${i}">${c} <span class="ar">${sortKey===i?(asc?'▲':'▼'):'⇅'}</span></th>`).join('')+'</tr></thead><tbody>'+
          rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="mono">${r[2]}</td>
            <td><span class="pill ${r[3]}">${({active:'פעילה',risk:'בסיכון',inactive:'לא-פעילה'})[r[3]]}</span></td></tr>`).join('')+
          '</tbody></table></div>';
        b.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
          const k=+th.dataset.k; if(k===sortKey)asc=!asc; else{sortKey=k;asc=true;} render();
        }));
      }
      render();
    },
    calendar(b){
      const dows=['א','ב','ג','ד','ה','ו','ש'];
      let html='<div class="cal">'+dows.map(d=>`<div class="dow">${d}</div>`).join('');
      const start=3; // month starts on Wed (offset)
      for(let i=0;i<start;i++)html+='<div class="cell" style="border-color:transparent"></div>';
      for(let d=1;d<=30;d++){ const ev=EVENTS[d];
        html+=`<div class="cell ${ev?'has':''} ${d===14?'today':''}" ${ev?`title="${ev.join(', ')}"`:''}>${d}${ev?'<div class="dots"><i></i></div>':''}</div>`; }
      html+='</div>';
      b.innerHTML=html;
    }
  };

  function countUp(el,to,pre){
    if(reduce){el.textContent=(pre||'')+to.toLocaleString('he-IL');return;}
    let n=0;const step=Math.max(1,Math.round(to/48));
    const t=setInterval(()=>{n+=step;if(n>=to){n=to;clearInterval(t);}el.textContent=(pre||'')+n.toLocaleString('he-IL');},20);
  }

  function drawChart(cv,tt){
    const x=cv.getContext('2d'); let W,H,DPR,prog=0;
    const pad={l:12,r:12,t:18,b:26};
    function size(){DPR=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();
      cv.width=r.width*DPR;cv.height=r.height*DPR;x.setTransform(DPR,0,0,DPR,0,0);W=r.width;H=r.height;}
    size(); addEventListener('resize',()=>{size();paint(prog);});
    const max=Math.max(...DON)*1.12;
    function pt(i){const gw=W-pad.l-pad.r,gh=H-pad.t-pad.b;
      return [pad.l+gw*(i/(DON.length-1)), pad.t+gh*(1-DON[i]/max)];}
    function paint(p){
      x.clearRect(0,0,W,H);
      // gridlines
      x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;
      for(let g=0;g<=3;g++){const y=pad.t+(H-pad.t-pad.b)*g/3;x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke();}
      const nv=Math.max(2,Math.floor((DON.length)*p));
      // area
      const grd=x.createLinearGradient(0,pad.t,0,H-pad.b);
      grd.addColorStop(0,'rgba(124,92,255,.5)');grd.addColorStop(1,'rgba(124,92,255,0)');
      x.beginPath();x.moveTo(pt(0)[0],H-pad.b);
      for(let i=0;i<nv;i++){const[px,py]=pt(i);x.lineTo(px,py);}
      x.lineTo(pt(nv-1)[0],H-pad.b);x.closePath();x.fillStyle=grd;x.fill();
      // line
      x.beginPath();for(let i=0;i<nv;i++){const[px,py]=pt(i);i?x.lineTo(px,py):x.moveTo(px,py);}
      x.strokeStyle='#a78bff';x.lineWidth=2.4;x.lineJoin='round';x.stroke();
      // endpoint
      const[ex,ey]=pt(nv-1);x.beginPath();x.arc(ex,ey,4.5,0,7);x.fillStyle='#ffd24a';x.fill();
      x.shadowColor='#ffd24a';x.shadowBlur=16;x.beginPath();x.arc(ex,ey,4.5,0,7);x.fill();x.shadowBlur=0;
      // labels
      x.fillStyle='rgba(158,163,207,.7)';x.font='10px "IBM Plex Mono",monospace';x.textAlign='center';
      for(let i=0;i<DON.length;i+=2){const[px]=pt(i);x.fillText(MONTHS[i],px,H-8);}
    }
    function anim(){prog+=.03;if(prog>1)prog=1;paint(prog);if(prog<1&&!reduce)requestAnimationFrame(anim);}
    reduce?paint(1):anim();
    // hover tooltip
    cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();const mx=e.clientX-r.left;
      let bi=0,bd=1e9;for(let i=0;i<DON.length;i++){const d=Math.abs(pt(i)[0]-mx);if(d<bd){bd=d;bi=i;}}
      const[px,py]=pt(bi);tt.style.left=px+'px';tt.style.top=py+'px';tt.style.opacity='1';
      tt.innerHTML=`${MONTHS[bi]} · ₪${DON[bi].toLocaleString('he-IL')}`;});
    cv.addEventListener('pointerleave',()=>tt.style.opacity='0');
  }
})();
</script>
