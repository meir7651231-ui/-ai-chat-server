<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שיחה עם המחולל</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@200;300;400;500;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
 --void:#050509; --ink:#F2F2F8; --ink2:#9A9AB0; --dim:#53536A;
 --rim:rgba(255,255,255,.09); --rim2:rgba(255,255,255,.045);
 --pack:#FFA033; --term:#B592FF; --schema:#2FE3F0; --said:#FFFFFF; --open:#FF5C93;
 --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
 --sans:'Rubik','Heebo',system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--sans);line-height:1.6;
 -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
 display:flex;flex-direction:column;height:100%;overflow:hidden;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#field{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
/* ══ ראש ══ */
header{position:relative;z-index:2;display:flex;align-items:center;gap:12px;
 padding:13px 16px;border-bottom:1px solid var(--rim2);background:rgba(5,5,9,.7);backdrop-filter:blur(14px)}
header .ttl{font-size:16px;font-weight:300;letter-spacing:-.01em}
header .ttl b{font-weight:800}
header .st{margin-inline-start:auto;display:flex;align-items:center;gap:7px;
 font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
header .st i{width:6px;height:6px;border-radius:50%;background:var(--dim);display:block;transition:.3s}
body[data-mode="listen"] header .st i{background:var(--open);box-shadow:0 0 12px var(--open);animation:pu 1.1s infinite}
body[data-mode="talk"] header .st i{background:var(--schema);box-shadow:0 0 12px var(--schema)}
@keyframes pu{0%,100%{opacity:.4}50%{opacity:1}}
/* ══ זרם ══ */
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding:18px 16px 8px}
.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(88%,560px);padding:13px 16px;border-radius:17px;font-size:15px;line-height:1.55;
 opacity:0;transform:translateY(9px);animation:in .4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.msg.me{align-self:flex-start;border-start-start-radius:5px;
 background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
 border:1px solid var(--rim);backdrop-filter:blur(10px)}
.msg.me.interim{opacity:.55;border-style:dashed}
.msg.it{align-self:flex-end;border-start-end-radius:5px;color:var(--ink2);
 background:linear-gradient(160deg,rgba(47,227,240,.09),rgba(255,255,255,.02));
 border:1px solid rgba(47,227,240,.2);backdrop-filter:blur(10px)}
.msg.it b{color:var(--ink);font-weight:500}
.msg .src{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);
 margin-top:8px;padding-top:7px;border-top:1px solid var(--rim2);line-height:1.7}
.msg .src code{direction:ltr;unicode-bidi:isolate;display:inline-block;color:var(--schema);opacity:.9}
.think{align-self:flex-end;display:flex;gap:5px;padding:12px 16px}
.think i{width:5px;height:5px;border-radius:50%;background:var(--schema);display:block;animation:bl 1.3s infinite}
.think i:nth-child(2){animation-delay:.18s}.think i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:1}}
/* ══ בועת-בנייה ══ */
.build{align-self:flex-end;max-width:min(94%,640px);width:100%;
 border-radius:17px;border-start-end-radius:5px;padding:15px 16px;
 background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
 border:1px solid var(--rim2);backdrop-filter:blur(12px);
 opacity:0;transform:translateY(9px);animation:in .45s cubic-bezier(.16,1,.3,1) forwards}
.build .cap{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:11px}
.ents{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.ent{border-radius:11px;padding:12px 13px;border:1px solid var(--rim2);background:rgba(0,0,0,.25)}
.ent.q{border-color:rgba(255,92,147,.35);background:rgba(255,92,147,.05)}
.ent .nm{font-size:14.5px;font-weight:400;color:var(--ink);display:flex;align-items:baseline;gap:7px}
.ent .cls{font-family:var(--mono);font-size:9.5px;color:var(--schema);direction:ltr}
.ent.q .cls{color:var(--open)}
.ent .big{font-size:25px;font-weight:200;letter-spacing:-.04em;margin-top:6px;display:block}
.ent .big u{text-decoration:none;font-size:10px;color:var(--dim);margin-inline-start:6px}
.ent .sr{font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-top:8px;line-height:1.65}
.ent .sr code{direction:ltr;unicode-bidi:isolate;display:inline-block;color:var(--term);opacity:.85}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.opt{font-family:inherit;font-size:11.5px;padding:5px 10px;border-radius:14px;cursor:pointer;
 background:rgba(255,255,255,.04);border:1px solid var(--rim);color:var(--ink2);transition:.14s}
.opt:hover{border-color:var(--open)}
.opt[aria-pressed="true"]{background:rgba(255,92,147,.16);border-color:var(--open);color:var(--open)}
.opt:focus-visible{outline:2px solid var(--open);outline-offset:2px}
.mrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mm{flex:1 1 74px;border-radius:9px;padding:9px 10px;background:rgba(0,0,0,.28);border:1px solid var(--rim2)}
.mm b{display:block;font-size:19px;font-weight:200;line-height:1;letter-spacing:-.03em;color:var(--schema)}
.mm.z b{color:var(--ink)}
.mm small{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:5px;letter-spacing:.12em}
/* ══ מרתף ══ */
footer{position:relative;z-index:2;border-top:1px solid var(--rim2);padding:14px 16px 16px;
 background:rgba(5,5,9,.75);backdrop-filter:blur(14px)}
.dock{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mic{position:relative;width:60px;height:60px;flex:none;border-radius:50%;cursor:pointer;
 border:1px solid var(--rim);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
 display:grid;place-items:center;transition:.3s;backdrop-filter:blur(10px)}
.mic:hover{border-color:var(--open)}
.mic:focus-visible{outline:2px solid var(--open);outline-offset:4px}
.mic svg{width:22px;height:22px;fill:var(--ink2);transition:.3s}
body[data-mode="listen"] .mic{border-color:var(--open);box-shadow:0 0 0 1px var(--open),0 0 44px -10px var(--open)}
body[data-mode="listen"] .mic svg{fill:var(--open)}
.mic canvas{position:absolute;inset:-18px;width:96px;height:96px;pointer-events:none}
.tb{flex:1;display:flex;align-items:center;gap:9px;border-radius:26px;padding:6px 8px 6px 16px;
 border:1px solid var(--rim);background:rgba(255,255,255,.035);backdrop-filter:blur(10px)}
.tb input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;padding:9px 0}
.tb input::placeholder{color:var(--dim)}
.tb input:focus{outline:none}
.send{flex:none;width:38px;height:38px;border-radius:50%;cursor:pointer;border:0;
 background:var(--schema);color:#04121A;display:grid;place-items:center;font-size:17px;transition:.2s}
.send:hover{filter:brightness(1.12)}
.send:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{max-width:820px;margin:9px auto 0;font-family:var(--mono);font-size:9.5px;color:var(--dim);
 letter-spacing:.1em;display:flex;gap:14px;flex-wrap:wrap}
.hint b{color:var(--ink2);font-weight:400}
.warn{color:var(--open)}
@media (max-width:520px){.mic{width:52px;height:52px}.mic canvas{inset:-15px;width:82px;height:82px}}

  for(const p of P){p.y-=p.v;p.x+=Math.sin(t*1.4+p.p)*.3;if(p.y<-12){p.y=H+12;p.x=Math.random()*W;}
   const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*11);g.addColorStop(0,p.h);g.addColorStop(1,'transparent');
   x.globalAlpha=p.a;x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*11,0,6.284);x.fill();}
  x.globalAlpha=1;requestAnimationFrame(f);})();})();

/* ══ טבעת-המיקרופון ══ */
let amp=0;
(function(){const c=$('#ring'),x=c.getContext('2d');const R=Math.min(devicePixelRatio||1,2);
 c.width=192*R;c.height=192*R;x.setTransform(R,0,0,R,0,0);let t=0;
 (function f(){t+=RM?0:.03;x.clearRect(0,0,192,192);
  if(document.body.dataset.mode==='listen'){
   for(let r=0;r<3;r++){x.beginPath();
    for(let a=0;a<=6.3;a+=.1){const n=Math.sin(a*3+t*2+r)*(3+amp*11)+Math.sin(a*6-t+r)*2;
     const rr=40+r*8+n,px=96+Math.cos(a)*rr,py=96+Math.sin(a)*rr;a?x.lineTo(px,py):x.moveTo(px,py);}
    x.closePath();x.strokeStyle='rgba(255,92,147,'+(.4-r*.11)+')';x.lineWidth=1.1;x.stroke();}}
  requestAnimationFrame(f);})();})();

/* ══ עברית ══ */
const heW=s=>[...String(s).matchAll(/[א-ת״׳']{2,}/g)].map(m=>m[0]);
// מורפולוגיה עברית מינימלית — כלל-שפה, לא מילון. אין התאמת-תחילית חופשית:
// «חללית» לא תתאים ל«חלל», «מרפאה» לא תתאים ל«מעבדה».
const PRE=/^[ובלכמשה]/;
const strip=w=>(PRE.test(w)&&w.length>3)?w.slice(1):w;
const SUF=['ים','ות','יות','ין'];
function eq(a,b){
 const A=strip(a),B=strip(b);
 if(A===B)return true;
 for(const s of SUF){ if(A===B+s||B===A+s)return true; }
 // ־ה ⇒ ־ות  (חבילה ⇐ חבילות)
 if(A.endsWith('ות')&&B.endsWith('ה')&&A.slice(0,-2)===B.slice(0,-1))return true;
 if(B.endsWith('ות')&&A.endsWith('ה')&&B.slice(0,-2)===A.slice(0,-1))return true;
 return false;}
const eqPhrase=(a,b)=>{const A=heW(a),B=heW(b);
 return A.length===B.length&&A.every((w,i)=>eq(w,B[i]));};

function detectPack(t){const ws=heW(t);let best=null;
 for(const p of DATA.packs) for(const cand of heW(p.label+' '+p.sub)){
  if(cand.length<3)continue;
  const hit=ws.find(w=>eq(w,cand));
  if(hit&&(!best||cand.length>best.on.length))best={p,on:cand,word:hit};}
 return best;}

function resolveWord(w,pack){
 // מונח דו-מילתי («חדר טיפול») חייב להתאים במלואו — לא חצי ממנו.
 if(pack) for(const [term,cls] of Object.entries(pack.p.t))
  if(eqPhrase(w,term)) return {cls,term,via:'pack',pid:pack.p.id};
 for(const p of DATA.packs) for(const [term,cls] of Object.entries(p.t))
  if(eqPhrase(w,term)) return {cls,term,via:'other',pid:p.id};
 return null;}

const STOP=new Set(['מערכת','לניהול','ניהול','אפליקציה','עם','של','את','על','או','גם','כל','יש','אין','לכל','תוכנה','מסך','פלטפורמה']);
function parse(t){
 const pack=detectPack(t);
 const raw=t.replace(/[.,;:!?]/g,' ').split(/\s+/).filter(Boolean);
 const out=[];let i=0;
 while(i<raw.length){
  const w=raw[i].replace(/^ו/,'');
  if(STOP.has(w)||STOP.has(raw[i])||w.length<2||(pack&&eq(w,pack.on))){i++;continue;}
  let hit=null,span=w;
  if(i+1<raw.length&&!STOP.has(raw[i+1])){
   const two=w+' '+raw[i+1];const h2=resolveWord(two,pack);
   if(h2){hit=h2;span=two;i++;}}
  if(!hit)hit=resolveWord(w,pack);
  out.push({word:span,hit});i++;}
 return {pack,items:out};}

/* ══ דיבור ══ */
let VOICE=null,SPEAK=true;
function pickVoice(){const vs=speechSynthesis.getVoices();
 VOICE=vs.find(v=>/^he/i.test(v.lang))||vs.find(v=>/Hebrew/i.test(v.name))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(txt,done){
 if(!SPEAK||!('speechSynthesis' in window)){done&&done();return;}
 const u=new SpeechSynthesisUtterance(txt);
 if(VOICE)u.voice=VOICE;u.lang='he-IL';u.rate=1.02;u.pitch=1.0;
 document.body.dataset.mode='talk';$('#stat').textContent='מדבר';
 u.onend=()=>{document.body.dataset.mode=listening?'listen':'idle';
  $('#stat').textContent=listening?'מקשיב':'מוכן';done&&done();};
 u.onerror=u.onend;
 try{speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){u.onend();}}

/* ══ בועות ══ */
function bubble(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;
 thread.appendChild(d);scroll();return d;}
function scroll(){requestAnimationFrame(()=>{const m=document.querySelector('main');m.scrollTop=m.scrollHeight;});}
function thinking(){const d=document.createElement('div');d.className='think';
 d.innerHTML='<i></i><i></i><i></i>';thread.appendChild(d);scroll();return d;}

/* ══ מצב ══ */
let STATE=null;
function render(){
 if(!STATE)return;
 const {pack,ents,quests,box}=STATE;
 let h='<div class="cap">נבנה · ' + (pack?pack.p.label:'תחום לא זוהה') + '</div><div class="ents">';
 for(const e of ents){
  h+='<div class="ent"><div class="nm">'+e.word+'<span class="cls">'+e.hit.cls+'</span></div>'
   +'<span class="big">'+e.n+'<u>שדות</u></span>'
   +'<div class="sr">מ<code>'+e.hit.pid+'.terms["'+e.hit.term+'"]</code> ⇐ <code>'+e.hit.cls+'</code></div></div>';}
 for(const q of quests){
  h+='<div class="ent q"><div class="nm">'+q.word+'<span class="cls">?</span></div>'
   +'<span class="big">'+q.opts.length+'<u>אפשרויות בנויות</u></span>'
   +'<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-q="'+q.word+'" data-i="'+i+'" aria-pressed="'+(q.pick===i)+'">'+o.l+'</button>').join('')+'</div>'
   +'<div class="sr">אין מונח באף מקור — לא הומצא</div></div>';}
 h+='</div>';
 let en=ents.length,fl=ents.reduce((a,b)=>a+b.n,0);
 for(const q of quests){const o=q.opts[q.pick];if(o&&o.n){en++;fl+=o.n;}}
 h+='<div class="mrow"><div class="mm"><b>'+en+'</b><small>ישויות</small></div>'
  +'<div class="mm"><b>'+fl+'</b><small>שדות</small></div>'
  +'<div class="mm"><b>'+(en*3)+'</b><small>מסכים</small></div>'
  +'<div class="mm z"><b>0</b><small>המצאות</small></div></div>';
 box.innerHTML=h;scroll();}

/* ══ העיבוד ══ */
function handle(text){
 bubble('me',text);
 const t=thinking();
 setTimeout(()=>{
  t.remove();
  const {pack,items}=parse(text);
  const ents=[],quests=[];
  for(const it of items){
   if(it.hit){const n=(DATA.F[it.hit.cls]||[]).length;if(n)ents.push({...it,n});}
   else quests.push({word:it.word,pick:0,opts:[
    {l:'ישות חדשה',n:2},{l:'טקסט בלבד',n:0},{l:'דחייה',n:0}]});}
  let line;
  if(!pack&&!ents.length&&!quests.length){
   line='לא תפסתי ישות במשפט. תנסה לנסח עם מה שיש במערכת — למשל: מערכת לניהול מרפאה עם מטופלים וחדרי טיפול.';
   bubble('it',line);say(line);return;}
  const parts=[];
  if(pack)parts.push('זיהיתי <b>'+pack.p.label+'</b>');
  if(ents.length)parts.push(ents.map(e=>'<b>'+e.word+'</b> אצלך זה <b>'+e.hit.cls+'</b> עם '+e.n+' שדות').join(', '));
  if(quests.length)parts.push(quests.map(q=>'ל<b>'+q.word+'</b> אין לי מונח — בניתי '+q.opts.length+' אפשרויות, תבחר').join('. '));
  const html=parts.join('. ')+'.';
  bubble('it',html+'<span class="src">'+(pack?'מ<code>vertical-packs</code> ⇐ <code>'+pack.p.id+'</code> · ':'')+'שדות מ<code>schema-fields.mjs</code> · אפס המצאות</span>');
  const box=document.createElement('div');box.className='build';thread.appendChild(box);
  STATE={pack,ents,quests,box};render();
  const spoken=(pack?'זיהיתי '+pack.p.label+'. ':'')
   +ents.map(e=>e.word+' אצלך זה '+e.hit.cls+', '+e.n+' שדות').join('. ')
   +(quests.length?('. ל'+quests.map(q=>q.word).join(' ו')+' אין לי מונח. בניתי שלוש אפשרויות, תבחר.'):'');
  say(spoken);
 },520);}

document.addEventListener('click',ev=>{
 const o=ev.target.closest('.opt');
 if(o&&STATE){const q=STATE.quests.find(q=>q.word===o.dataset.q);
  if(q){q.pick=+o.dataset.i;render();say(q.word+' — '+q.opts[q.pick].l);}}});

/* ══ שמיעה ══ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,interim=null;
function startRec(){
 if(!SR){say('הדפדפן הזה לא תומך בזיהוי דיבור. אפשר להקליד.');
  bubble('it','הדפדפן הזה לא תומך בזיהוי דיבור — <b>אפשר להקליד למטה</b>.');return;}
 rec=new SR();rec.lang='he-IL';rec.continuous=true;rec.interimResults=true;
 rec.onstart=()=>{listening=true;document.body.dataset.mode='listen';$('#stat').textContent='מקשיב';};
 rec.onerror=e=>{const m=e.error==='not-allowed'?'לא ניתנה גישה למיקרופון — אפשר להקליד.':'הזיהוי נעצר — אפשר להקליד.';
  bubble('it',m);stopRec();};
 rec.onend=()=>{if(listening){try{rec.start();}catch(e){}}};
 rec.onresult=e=>{
  let fin='',itm='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const r=e.results[i];r.isFinal?fin+=r[0].transcript:itm+=r[0].transcript;}
  amp=Math.min(1,(itm.length+fin.length)/40);
  if(itm){if(!interim)interim=bubble('me interim','');interim.textContent=itm;scroll();}
  if(fin.trim()){if(interim){interim.remove();interim=null;}amp=0;handle(fin.trim());}};
 try{rec.start();}catch(e){}}
function stopRec(){listening=false;amp=0;try{rec&&rec.stop();}catch(e){}
 document.body.dataset.mode='idle';$('#stat').textContent='מוכן';}
$('#mic').onclick=()=>{listening?stopRec():startRec();};

/* ══ הקלדה ══ */
function submit(){const v=$('#txt').value.trim();if(!v)return;$('#txt').value='';handle(v);}
$('#send').onclick=submit;
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});

/* ══ פתיחה ══ */
$('#hint').innerHTML='<span>'+(SR?'<b>מיקרופון פעיל</b> · עברית':'<span class="warn">אין זיהוי-דיבור בדפדפן הזה</span> · הקלד')
 +'</span><span>'+DATA.packs.length+' תחומים</span><span>'
 +Object.values(DATA.F).reduce((a,b)=>a+b.length,0)+' שדות אמיתיים</span><span>אפס המצאות</span>';
/* ── פתיחה: שיחה לדוגמה, כבר על המסך ── */
bubble('it','שלום. <b>תדבר או תקליד</b> — תגיד לי איזו מערכת אתה רוצה.<span class="src">אני לא ממציא. מה שאין לי מונח עבורו — אבנה בכמה אפשרויות ואתה תבחר.</span>');
bubble('me','מערכת לניהול קליניקה עם מטופלים, חדרי טיפול וחבילות טיפול');
bubble('it','זיהיתי <b>קליניקה</b>. <b>מטופלים</b> אצלך זה <b>Family</b> עם 25 שדות, ו<b>חדרי טיפול</b> זה <b>Room</b> עם 12. ל<b>חבילות טיפול</b> אין לי מונח — בניתי 3 אפשרויות, תבחר.<span class="src">מ<code>vertical-packs</code> ⇐ <code>clinic</code> · שדות מ<code>schema-fields.mjs</code> · אפס המצאות</span>');
(function(){
 const box=document.createElement('div');box.className='build';thread.appendChild(box);
 STATE={pack:{p:DATA.packs.find(x=>x.id==='clinic')},
  ents:[{word:'מטופלים',n:25,hit:{cls:'Family',term:'מטופל',pid:'clinic'}},
        {word:'חדרי טיפול',n:12,hit:{cls:'Room',term:'חדר טיפול',pid:'clinic'}}],
  quests:[{word:'חבילות טיפול',pick:0,opts:[{l:'Course · 39',n:39},{l:'ישות חדשה',n:2},{l:'טקסט בלבד',n:0}]}],
  box};
 render();})();
setTimeout(()=>{$('#txt').focus();},300);
</script>
