<style>
:root{--void:#04050A;--ink:#EEF1FF;--ink-2:#9AA3B8;--ink-3:#5B6478;--ink-4:#2C3140;--core:#7DF9FF;--mic:#FF5C8A;--open:#FFB454;--ok:#5CFFB0;--danger:#FF4F5E;--glass:rgba(10,12,22,.7);--edge:rgba(125,249,255,.2)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:Heebo,Arial,sans-serif;direction:rtl;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-inline:20px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));gap:18px;transition:background .4s}
#app.ring{animation:flash 1.2s infinite}
@keyframes flash{50%{background:#1a0f22}}
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:18px;font-family:Karantina;font-weight:700;font-size:30px;line-height:1;background:linear-gradient(90deg,var(--ink),var(--core));-webkit-background-clip:text;background-clip:text;color:transparent}
.st{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));inset-inline-end:18px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ink-4)}.st.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.st.warn i{background:var(--danger)}
.core{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--core) 28%,rgba(138,92,255,.4) 60%,transparent 72%);animation:breathe 4s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(125,249,255,.5));flex:none;transition:transform .3s}
#app.ring .core{background:radial-gradient(circle,#fff 0,var(--mic) 28%,rgba(255,92,138,.4) 60%,transparent 72%);animation:ringpulse .6s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(255,92,138,.7))}
#app.listen .core{background:radial-gradient(circle,#fff 0,var(--mic) 28%,rgba(255,92,138,.4) 60%,transparent 72%);filter:drop-shadow(0 0 40px rgba(255,92,138,.7));animation:none}
@keyframes breathe{50%{transform:scale(1.08)}}@keyframes ringpulse{50%{transform:scale(1.25)}}
h1{margin:0;font-family:Karantina;font-weight:700;font-size:clamp(40px,11vw,92px);line-height:.95;text-wrap:balance;max-width:16ch}
h1.q{font-weight:300}
.sub{color:var(--ink-2);font-size:16px;max-width:36ch;line-height:1.5;margin:0}
.kind{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;color:var(--ink-3)}
.kind.stuck{color:var(--open)}.kind.done{color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px}
.opts button,.big{font:500 20px Heebo;background:var(--glass);border:1px solid var(--edge);color:var(--ink);border-radius:999px;padding:14px 26px;cursor:pointer;min-width:120px}
.opts button:active,.big:active{background:rgba(125,249,255,.15)}
.big{font-size:24px;padding:18px 40px;border-color:var(--core);box-shadow:0 0 30px -8px var(--core)}
.big.mic{border-color:var(--mic);box-shadow:0 0 30px -8px var(--mic)}
.heard{font-family:Karantina;font-weight:300;font-size:clamp(30px,8vw,60px);color:var(--mic);min-height:1.1em;line-height:1}
.row{display:flex;gap:10px;align-items:center;width:100%;max-width:520px}
.row input{flex:1;min-width:0;font:400 20px Heebo;background:var(--glass);border:1px solid var(--edge);color:var(--ink);border-radius:999px;padding:12px 18px;outline:none}
.row button{font:500 18px Heebo;background:var(--core);color:#04050A;border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
.log{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline:18px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:13px;color:var(--ink-3);background:none;border:0;text-decoration:underline;cursor:pointer;font-family:inherit}
.tr{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow:auto;-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%)}
.tr div{font-size:17px;line-height:1.45;padding:8px 14px;border-radius:14px;max-width:85%}
.tr .me{align-self:flex-start;background:rgba(255,92,138,.12);color:var(--ink)}
.tr .li{align-self:flex-end;background:var(--glass);border:1px solid var(--edge);color:var(--ink-2)}
.tr .li.think{color:var(--ink-3);font-style:italic}
.tr .me[data-st]::after{content:attr(data-st);display:block;font-size:.72em;color:var(--ink-3);margin-top:2px}
.tog{font-size:13px;color:var(--ink-3);background:none;border:1px solid var(--ink-4);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit}
.tog.on{color:var(--ok);border-color:var(--ok)}
.tasks{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;text-align:right}
.tasks .t{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);color:var(--ink-2)}
.tasks .t i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.tasks .t.running i{background:var(--core);box-shadow:0 0 8px var(--core)}.tasks .t.blocked i{background:var(--open);box-shadow:0 0 8px var(--open)}.tasks .t.done i{background:var(--ok)}
.tasks .t b{font-weight:500;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tasks .t small{color:var(--ink-3);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</div>

  if(d.toDateString()===n.toDateString())return 'היום ב-'+hm;const y=new Date(n.getTime()-864e5);if(d.toDateString()===y.toDateString())return 'אתמול ב-'+hm;return ago(Date.now()-t);}
async function whyCmd(){const now=Date.now();let r;try{r=await coldGet(P.pulses(),null,10);}catch(e){fail('P_DB_READ',e,'pulse');sayLocal('לא הצלחתי לקרוא את מצב הטלפון.');return;}
  const ps=r.docs.map(d=>d.data()||{}).sort((a,b)=>(b.at||0)-(a.at||0));
  if(!ps.length){sayLocal('עוד לא קיבלתי דופק מהטלפון. זה יתחיל אחרי שהגרסה החדשה של האפליקציה תותקן.');return;}
  let past='';try{const h=await P.health().get();const x=h.exists?(h.data()||{}):null;if(x&&now-(+x.at||0)<864e5&&x.reason)past=' השתיקה האחרונה, '+ago(now-(+x.from||now))+', הייתה כי '+(HEALTH_HE[x.reason]||HEALTH_HE.unknown)+'.';}catch(e){fail('P_DB_READ',e,'channel/health');}
  sayLocal(ps.map(p=>pulseSay(p,now,ps.length>1)).join(' ')+past);}
/* heartbeat-diag: a closed vocabulary for why ליבה was silent. When a pulse comes back after a gap, the gap gets a
   reason from what the phone knew: why this life began (boot/revive), the last gasp of the previous one (the app saw
   its own end coming, or Meir turned it off), and the last pulse before the gap (no network, deep sleep, logged out).
   Written to channel/health - one document, rewritten. */
const HEALTH_HE={'phone-off':'הטלפון כבה או הופעל מחדש','app-killed':'המערכת סגרה אותי','mic-revoked':'ההרשאה למיקרופון נשללה','overlay-revoked':'ההרשאה לבועה נשללה',
  'page-logged-out':'הדף התנתק מהחשבון','network-down':'לא הייתה רשת','doze':'הטלפון נכנס לשינה עמוקה','turned-off':'כיבית אותי','unknown':'אני לא יודעת למה'};
function gapReason(prev,cur){const g=String(cur.gasp||'');
  if(/^turned-off/.test(g))return 'turned-off';if(cur.life==='boot')return 'phone-off';if(/^app-killed/.test(g)||cur.life==='revive')return 'app-killed';
  if(prev&&prev.net===false)return 'network-down';if(prev&&prev.doze===true)return 'doze';if(prev&&prev.login===true)return 'page-logged-out';
  if(prev&&prev.mic===false)return 'mic-revoked';if(prev&&prev.overlay===false)return 'overlay-revoked';return 'unknown';}
function liveReason(p,now){if(now-(+p.at||0)>PULSE_STALE)return p.net===false?'network-down':p.doze?'doze':'unknown';
  if(p.overlay===false)return 'overlay-revoked';if(p.mic===false)return 'mic-revoked';if(p.login===true)return 'page-logged-out';return 'ok';}
function healthGap(dev,prev,cur,from,to){const reason=gapReason(prev,cur);
  P.health().set({reason:reason,dev:dev,from:from,to:to,at:to}).catch(e=>fail('P_DB_WRITE',e,'channel/health'));return reason;}
/* health-console: "מה מצב הקו" - three sentences, never a report: the line now, today in numbers, the last silence */
async function lineCmd(){const now=Date.now();let p=null,h=null;
  try{const r=await coldGet(P.pulses(),null,10);p=r.docs.map(d=>d.data()||{}).sort((a,b)=>(b.at||0)-(a.at||0))[0]||null;}catch(e){fail('P_DB_READ',e,'pulse');}
  try{const g=await P.health().get();h=g.exists?(g.data()||{}):null;}catch(e){fail('P_DB_READ',e,'channel/health');}
  const live=p?liveReason(p,now):'';
  const a=!p?'הקו: עוד אין דופק מהטלפון.':live==='ok'?'הקו חי'+(+p.battery>=0?', סוללה '+p.battery+' אחוז':'')+'.':'הקו לא תקין: '+(HEALTH_HE[live]||HEALTH_HE.unknown)+'.';
  const held=Object.values(silenceDay).reduce((x,y)=>x+y,0);
  const b='היום: '+ledger.req+' בקשות, אמרתי '+ledger.said+(held?', ו-'+held+' עיכובים':'')+'.';
  const c=h&&now-(+h.at||0)<7*864e5?'השתיקה האחרונה '+ago(now-(+h.from||now))+': '+(HEALTH_HE[h.reason]||HEALTH_HE.unknown)+'.':'אין שתיקה בשבוע האחרון.';
  sayLocal(a+' '+b+' '+c);}
window.__pulse={in:pulseIn,line:lineCmd,reason:gapReason,live:liveReason,say:pulseSay,why:whyCmd,ledgerFlush:ledgerFlush,ledger:()=>Object.assign({},ledger)};
/* Step mem-core. memory/facts/items/<key>, key = slug(subject)+'.'+slug(predicate): the same fact said twice is one
   document (its uses go up), and two writes in one millisecond can no longer overwrite each other. The raw sentence is
   always kept; a sentence the parser does not understand is still stored - as kind 'note' with confidence 0.3, never
   as a wrong triple. Forget is a tomb for 30 days (the janitor clears it after), so a mistaken "תשכח" can be undone.
   memory/notes and memory/prefs move over once (MEM.migrate, under a lease), and stay behind as tombs for 30 days. */
const MEM_TOMB_DAYS=30,MEM_ONE=['הוא','זהות','גר','גרה','עובד','עובדת','לומד','לומדת'];
const slug=t=>inorm(t).replace(/[^0-9a-zא-ת ]/gi,'').trim().replace(/ /g,'_').slice(0,60)||'x';
function hash36(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36);}
/* the parser: the few shapes Meir actually uses. Anything else is a note - raw kept, low confidence */
const MEM_SHAPES=[
  [/^(.+?) (הוא|היא|הם|הן) (.+)$/,m=>({subject:m[1],predicate:'הוא',value:m[3],kind:/^(ה?בן|ה?בת|ה?אח|ה?אחות|ה?אבא|ה?אמא|ה?אשתי|ה?רואה חשבון|ה?עורך דין)/.test(m[1])||/^[א-ת]+ (הוא|היא) ה?(בן|בת|אח|אחות|אבא|אמא|אשתי|רואה|עורך|לקוח|שכן|מנהל)/.test(m[0])?'person':'fact',conf:0.8})],
  [/^יש לי (.+)$/,m=>({subject:'אני',predicate:'יש לי',value:m[1],kind:'fact',conf:0.8})],
  [/^אני (גר|גרה|עובד|עובדת|לומד|לומדת) (ב.+)$/,m=>({subject:'אני',predicate:m[1],value:m[2],kind:'fact',conf:0.8})],
  [/^(.+?) (מתגייס|מתחתן|נולד|נולדה|מגיע|מגיעה|נוסע|נוסעת|חוזר|חוזרת) (.+)$/,m=>({subject:m[1],predicate:m[2],value:m[3],kind:'event',conf:0.7})],
];
const MEM_PREF=[/^(אל תשאל|אל תשאלי) אותי (על|לגבי) (.+)$/,/^(תמיד|אף פעם) (.+)$/];
const MEM={
  parse(raw){const t=inorm(raw).replace(/^ש/,'');for(const [re,f] of MEM_SHAPES){const m=t.match(re);if(m){const x=f(m);return Object.assign(x,{raw:raw});}}
    for(const re of MEM_PREF){const m=t.match(re);if(m)return {subject:'מאיר',predicate:'העדפה',value:t,kind:'pref',conf:0.9,raw:raw};}
    return {subject:'הערה',predicate:hash36(t),value:t,kind:'note',conf:0.3,raw:raw};},
  /* single-valued predicates ("X הוא Y": one answer, a new one corrects the old) key on subject.predicate; the rest
     ("יש לי X", preferences, notes) can hold many values, so the value is part of the key - found by recall7, where
     every "יש לי" overwrote the one before */
  key(f){const one=MEM_ONE.indexOf(f.predicate)>=0||f.kind==='event';return slug(f.subject)+'.'+slug(f.predicate)+(one?'':'.'+hash36(inorm(f.value)));},
  sens(f){return f.kind==='person'||/(בן|בת|אשתי|בריאות|רופא|כסף|חוב|משכורת|סיסמה)/.test(f.raw||'')?1:0;},
  /* put: one document per key; the same fact again only counts a use; a new value for the key replaces it, and the
     old value is kept in prev so a correction is visible */
  async put(f,source){const k=MEM.key(f),ref=P.fact(k),now=Date.now();let cur=null;try{const g=await ref.get();cur=g.exists?(g.data()||{}):null;}catch(e){fail('P_DB_READ',e,'fact');}
    if(cur&&cur.state!=='tomb'&&cur.value===f.value){await ref.update({uses:(+cur.uses||0)+1,lastUsed:now,updatedAt:now});return {key:k,same:true};}
    const doc={subject:f.subject,predicate:f.predicate,value:f.value,raw:f.raw||f.value,kind:f.kind,conf:f.conf,sens:f.sens!=null?f.sens:MEM.sens(f),
      source:Object.assign({type:'said',at:now},source||{}),ts:cur&&cur.ts||now,updatedAt:now,uses:1,lastUsed:now,state:'live'};
    if(cur&&cur.state!=='tomb'&&cur.value!==f.value)doc.prev={value:cur.value,at:cur.updatedAt||cur.ts};
    await ref.set(doc);return {key:k,same:false,replaced:!!doc.prev};},
  async all(){const r=await coldGet(P.facts(),null,1000);return r.docs.map(d=>Object.assign({key:d.id},d.data()||{}));},
  /* query: every word of q (without the Hebrew prefixes ב/ל/כ/ו/ש/ה/מ) found in the fact - live ones only */
  async query(q){const w=memWords(q);const all=(await MEM.all()).filter(f=>f.state!=='tomb');if(!w.length)return all;
    return all.filter(f=>{const hay=memWords([f.subject,f.predicate,f.value,f.raw].join(' ')).join(' ');return w.every(x=>hay.indexOf(x)>=0);});},
  async recent(n){return (await MEM.all()).filter(f=>f.state!=='tomb').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,n||8);},
  async forget(q){const hits=await MEM.query(q);for(const f of hits){try{await P.fact(f.key).update({state:'tomb',tombAt:Date.now()});}catch(e){fail('P_DB_WRITE',e,'fact tomb');}}return hits;},
  /* one time: notes and prefs into facts. Under a lease on memory/meta, so two devices do not both move them */
  async migrate(){if(!db)return null;let meta={};try{const g=await P.memMeta().get();meta=(g.exists&&g.data())||{};}catch(e){return null;}
    if(+meta.schema>=2)return {skipped:true};
    try{const l=await P.memMeta().acquire({holder:PAGE_ID,ttlMs:60000});if(l&&l.acquired===false)return {busy:true};}catch(e){}
    let n=0,moved=0;for(const [col,kind] of [[P.notes(),'note'],[P.prefs(),'pref']]){const r=await coldGet(col,null,1000);
      for(const d of r.docs){const x=d.data()||{};if(x.state==='tomb'||!x.text)continue;n++;const f=kind==='pref'?{subject:'מאיר',predicate:'העדפה.'+d.id,value:x.text,kind:'pref',conf:0.9,raw:x.text}:MEM.parse(x.text);
        try{await MEM.put(f,{type:'migrated',from:col.path+'/'+d.id,at:+x.ts||Date.now()});await col.doc(d.id).update({state:'tomb',tombAt:Date.now(),movedTo:MEM.key(f)});moved++;}catch(e){fail('P_DB_WRITE',e,'migrate');}}}
    await P.memMeta().set({schema:2,migratedAt:Date.now(),found:n,moved:moved}).catch(e=>fail('P_DB_WRITE',e,'memory/meta'));return {found:n,moved:moved};}
};
/* the words of a text without Hebrew one-letter prefixes and final forms, for matching "לדני" with "דני" */
const FINAL={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function memWords(t){return inorm(t).split(' ').map(w=>w.replace(/[ךםןףץ]/g,c=>FINAL[c])).map(w=>w.length>3?w.replace(/^[בלכושהמ]{1,2}(?=[א-ת]{3})/,''):w).filter(w=>w.length>=2&&!['של','את','על','עם','זה','מה','הוא','היא'].includes(w));}
/* the commands, on top of MEM */
function memAbout(rest){const q=rest.trim();if(!q)return false;MEM.query(q).then(h=>{sayLocal(h.length?'על '+q+' אני יודעת: '+h.slice(0,5).map(f=>f.raw||f.value).join('; ')+'.':'אני לא יודעת כלום על '+q+'.');}).catch(e=>{fail('P_DB_READ',e,'facts');sayLocal('לא הצלחתי לקרוא את הזיכרון.');});return true;}
/* mem-brief: every sentence that goes out carries Meir with it - but only what is relevant, and never first.
   After the sentence (the [ליבה] tag at the start is what other sessions route on) and before the ⟦#id⟧ mark:
   "[הקשר#<hash>]" and up to six facts ranked by shared words x confidence x freshness, the identity card's line when
   it is relevant, preferences that bound the answer. Nothing sensitive (sens>=2), a hard cap of 700 characters,
   nothing at all when nothing matches, and "בלי הקשר" skips it for the next sentence. */
const BRIEF_MAX=700,BRIEF_FACTS=6;let briefSkip=false,identityCard=null;
/* a rare word (a name) weighs more than a common one ("לי" is in every "יש לי" fact): inverse document frequency */
function memIdf(all){const df={},N=all.length||1;for(const f of all)for(const x of new Set(memWords([f.subject,f.predicate,f.value,f.raw].join(' '))))df[x]=(df[x]||0)+1;
  return x=>Math.log(1+N/(df[x]||N));}
function memScore(f,w,now,idf){const hay=memWords([f.subject,f.predicate,f.value,f.raw].join(' '));let hit=0;for(const x of w)if(hay.indexOf(x)>=0)hit+=idf?idf(x):1;
  if(!hit)return 0;const age=(now-(+f.updatedAt||+f.ts||now))/864e5;return hit*(+f.conf||0.5)*Math.pow(0.5,age/30)*(f.kind==='pref'?1.2:1);}
async function brief(text){if(briefSkip){briefSkip=false;return '';}if(!db)return '';const w=memWords(text);if(!w.length)return '';
  let all=[];try{all=(await MEM.all()).filter(f=>f.state!=='tomb'&&(+f.sens||0)<2);}catch(e){return '';}
  let who=[];try{who=(await PEOPLE.resolve(text)).map(p=>p.name);}catch(e){}
  const now=Date.now(),idf=memIdf(all);const top=all.map(f=>({f,s:memScore(f,w,now,idf)*(who.some(n=>(f.raw||'').indexOf(n)>=0)?1.5:1)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,BRIEF_FACTS).map(x=>x.f);
  if(!top.length)return '';
  const lines=top.map(f=>'- '+(f.raw||f.subject+' '+f.predicate+' '+f.value).replace(/^ש/,''));
  let out='[הקשר#'+hash36(lines.join('|'))+'] '+lines.join(' ');if(out.length>BRIEF_MAX)out=out.slice(0,BRIEF_MAX-1)+'…';
  for(const f of top){P.fact(f.key).update({uses:(+f.uses||0)+1,lastUsed:now}).catch(()=>{});}
  return '\n\n'+out;}
function memNoBrief(){briefSkip=true;sayLocal('בסדר, המשפט הבא ילך בלי הקשר.');return true;}
function memIdentity(rest,m){const card=m.t.slice(0,400);P.identity().set({card:card,updatedAt:Date.now()}).then(()=>sayLocal('שמרתי את כרטיס הזהות.')).catch(e=>fail('P_DB_WRITE',e,'memory/identity'));
  MEM.put({subject:'מאיר',predicate:'זהות',value:card,kind:'fact',conf:1,raw:card},{type:'said'}).catch(()=>{});return true;}
setTimeout(()=>{if(db)MEM.migrate().catch(e=>fail('P_DB_WRITE',e,'migrate'));},15000);
window.__mem=MEM;
/* Step people. memory/people/items/<slug(name)>: {name, aliases[], relation, sens, lastMentioned, firstSeen}.
   resolve(text) finds the people a sentence talks about - "לדני", "של דני", "ודני" and a nickname Meir taught all find
   the same card. A card is never merged silently: "תאחד את X עם Y" asks first, and the merged card keeps the other
   in merged[] for 30 days. A person card is sensitive (1), and the brief gives facts about a person in the sentence a
   boost. */
const PEOPLE={
  cache:null,at:0,
  async all(){if(this.cache&&Date.now()-this.at<30000)return this.cache;const r=await coldGet(P.people(),null,500);this.cache=r.docs.map(d=>Object.assign({key:d.id},d.data()||{})).filter(x=>x.state!=='tomb');this.at=Date.now();return this.cache;},
  names(p){return [p.name].concat(p.aliases||[]).map(n=>memWords(n).join(' ')).filter(Boolean);},
  async resolve(text){const w=' '+memWords(text).join(' ')+' ';const all=await this.all();return all.filter(p=>this.names(p).some(n=>w.indexOf(' '+n+' ')>=0));},
  async find(name){const n=memWords(name).join(' ');return (await this.all()).find(p=>this.names(p).indexOf(n)>=0)||null;},
  async upsert(name,fields){const ex=await this.find(name);const k=ex?ex.key:slug(name),now=Date.now();
    const doc=Object.assign({name:ex?ex.name:name.trim(),aliases:ex&&ex.aliases||[],sens:1,firstSeen:ex&&ex.firstSeen||now,lastMentioned:now,state:'live'},ex||{},fields||{},{updatedAt:now});delete doc.key;
    await P.person(k).set(doc);this.cache=null;return Object.assign({key:k},doc);},
};
let lastPerson=null;
function peopleAdd(rest,m){const name=rest.trim(),rel=m.rel.replace(/^(הוא|היא) /,'').trim();
  PEOPLE.upsert(name,{relation:rel}).then(p=>{lastPerson=p;MEM.put({subject:name,predicate:'הוא',value:rel,kind:'person',conf:0.9,raw:name+' '+m.rel},{type:'said'}).catch(()=>{});
    sayLocal('רשמתי: '+p.name+' '+m.rel.split(' ')[0]+' '+rel+'.');}).catch(e=>{fail('P_DB_WRITE',e,'people');sayLocal('לא הצלחתי לרשום.');});return true;}
function peopleWho(rest){if(!rest.trim())return false;peopleWhoA(rest).catch(e=>fail('P_DB_READ',e,'people'));return true;}
async function peopleWhoA(rest){const q=rest.trim();const ps=await PEOPLE.resolve(q).catch(()=>[]);
  if(!ps.length){sayLocal('אני לא מכירה את '+q+'. תגיד למשל "'+q+' הוא השכן".');return true;}
  const p=ps[0];lastPerson=p;P.person(p.key).update({lastMentioned:Date.now()}).catch(()=>{});
  const facts=(await MEM.query(p.name).catch(()=>[])).filter(f=>!(f.subject===p.name&&f.predicate==='הוא')).slice(0,3).map(f=>f.raw||f.value);
  sayLocal(p.name+(p.relation?' הוא '+p.relation:'')+((p.aliases||[]).length?', קוראים לו גם '+p.aliases.join(', '):'')+'.'+(facts.length?' עוד: '+facts.join('; ')+'.':''));return true;}
function peopleAlias(rest){if(!rest.trim())return false;peopleAliasA(rest).catch(e=>fail('P_DB_WRITE',e,'people'));return true;}
async function peopleAliasA(rest){const a=rest.trim();if(!lastPerson){sayLocal('על מי? תגיד קודם מי זה.');return true;}
  const other=await PEOPLE.find(a);if(other&&other.key!==lastPerson.key){sayLocal(a+' כבר שם של '+other.name+'. תגיד תאחד את '+lastPerson.name+' עם '+other.name+' אם זה אותו אדם.');return true;}
  const al=[...new Set((lastPerson.aliases||[]).concat([a]))];await P.person(lastPerson.key).update({aliases:al,updatedAt:Date.now()});lastPerson.aliases=al;PEOPLE.cache=null;
  sayLocal('בסדר, '+lastPerson.name+' זה גם '+a+'.');return true;}
function peopleMerge(rest){if(rest.split(' עם ').length!==2)return false;peopleMergeA(rest).catch(e=>fail('P_DB_WRITE',e,'people'));return true;}
async function peopleMergeA(rest){const m=rest.split(' עם ');const a=await PEOPLE.find(m[0]),b=await PEOPLE.find(m[1]);
  if(!a||!b||a.key===b.key){sayLocal('לא מצאתי שני אנשים שונים בשמות האלה.');return true;}
  const al=[...new Set((a.aliases||[]).concat([b.name],b.aliases||[]))];await P.person(a.key).update({aliases:al,relation:a.relation||b.relation,merged:[{key:b.key,name:b.name,at:Date.now()}],updatedAt:Date.now()});
  await P.person(b.key).update({state:'tomb',tombAt:Date.now(),mergedInto:a.key});PEOPLE.cache=null;sayLocal('איחדתי: '+b.name+' הוא '+a.name+'. אם טעיתי, זה עוד שמור שלושים יום.');return true;}
window.__people=PEOPLE;
/* a person fact said any other way ("תזכור שהרואה חשבון הוא משה") also makes the card: when the subject is a role
   ("הרואה חשבון"), the value is the name */
function peopleFromFact(f){if(f.kind!=='person'||f.predicate!=='הוא')return null;const role=/^ה/.test(f.subject)&&f.value.split(' ').length<=2;
  const name=role?f.value:f.subject,rel=role?f.subject:f.value;if(name.split(' ').length>3)return null;return PEOPLE.upsert(name,{relation:rel}).then(p=>{lastPerson=p;return p;});}
</script>
