<style>

<script>
const P={
  inbox:()=>db.collection('inbox'),inboxDoc:id=>db.doc('inbox/'+id),
  tasks:()=>db.collection('tasks'),task:id=>db.doc('tasks/'+id),
  sessions:()=>db.collection('sessions'),gallery:()=>db.collection('gallery'),
  owner:()=>db.doc('channel/owner'),quiet:()=>db.doc('channel/quiet'),device:()=>db.doc('channel/device'),
  current:()=>db.doc('chat/current'),settings:()=>db.doc('memory/settings'),
  crash:id=>db.doc('crashes/'+id),
  notes:()=>db.doc('memory/notes').collection('items'),prefs:()=>db.doc('memory/prefs').collection('items'),
  turns:()=>db.doc('chat/log').collection('turns'),decisions:()=>db.doc('decisions/log').collection('items'),
  telemetry:()=>db.doc('telemetry/events').collection('items'),
  req:id=>db.doc('req/'+id),reqs:()=>db.collection('req'),
  metricsDay:day=>db.doc('metrics/daily').collection('days').doc(day),

/* req-spine: the only id minter. String(Date.now()) collided whenever two writes shared a millisecond and
   silently overwrote each other; this is 48 bits of time + a per-millisecond counter + 32 random bits, so ids
   from one page never collide and still sort by time. */
let mintLast=0,mintSeq=0;
function mintId(){const t=Date.now();if(t===mintLast)mintSeq++;else{mintLast=t;mintSeq=0;}
  let r=0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);r=a[0];}catch(e){r=Math.floor(Math.random()*4294967296);}
  return t.toString(36).padStart(9,'0')+mintSeq.toString(36).padStart(4,'0')+r.toString(36).padStart(7,'0');}
/* text from the database goes into the DOM through this, never raw: a task title is written by other
   sessions, and "<img onerror=…>" in one would otherwise run inside the page that holds the channel */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const PROTO=Object.freeze({v:1,hash:"54a74e8c27dd",caps:Object.freeze(["beat","clock","proto","spoke","state","trace"]),
  toApp:Object.freeze({"ready":"ready","say":"say","sent":"sent","error":"error","queued":"queued","outbox":"outbox","tap":"tap","cmd":"cmd","crashSaved":"crashSaved","tasks":"tasks","traceAck":"traceAck","state":"state"}),
  toPage:Object.freeze({"hello":"hello","crash":"crash","spoke":"spoke","speaking":"speaking","input":"input","trace":"trace"}),
  initial:"OFFLINE",moves:Object.freeze({"OFFLINE":["IDLE","WAKE"],"IDLE":["LISTENING","THINKING","SPEAKING","SENDING","RINGING","QUIET","DEGRADED","WAKE","OFFLINE"],"WAKE":["LISTENING","IDLE","SPEAKING","SENDING","RINGING","OFFLINE"],"LISTENING":["THINKING","SENDING","IDLE","SPEAKING","WAKE","OFFLINE"],"THINKING":["SENDING","SPEAKING","IDLE","OFFLINE"],"SENDING":["IDLE","SPEAKING","RINGING","THINKING","DEGRADED","WAKE","LISTENING","OFFLINE"],"SPEAKING":["IDLE","LISTENING","SENDING","WAKE","RINGING","OFFLINE"],"RINGING":["SPEAKING","IDLE","LISTENING","OFFLINE"],"QUIET":["IDLE","SPEAKING","OFFLINE"],"DEGRADED":["IDLE","SPEAKING","SENDING","OFFLINE"]})});
const $=id=>document.getElementById(id);
const app=$('app'),H=$('h'),SUB=$('sub'),KIND=$('kind'),OPTS=$('opts'),HEARD=$('heard'),LOG=$('log');
let db=null,comments=null,AC=null,ringTimer=null,cur=null,lastRung=null,wakeLock=null,rec=null;
const log=t=>{LOG.textContent=t;};
const setSt=(t,c='')=>{$('stt').textContent=t;$('st').className='st '+c;};
/* one state machine, one table (core-machine): the moves come from protocol/protocol.json, the same table the
   bubble is generated from. OFFLINE until the page is armed; SPEAKING and SENDING are what "busy" used to be.
   A move the table does not allow is a fault (P_STATE_ILLEGAL) and still happens - the phone is never broken
   to prove a point. Every move lands in a 200-entry log and is told to the bubble. */
let state=PROTO.initial,illegalMoves=0;const stateLog=[];
const canMove=(a,b)=>a===b||(PROTO.moves[a]||[]).indexOf(b)>=0;
function transition(to,why){const from=state;if(from===to)return;const ok=canMove(from,to);
  if(!ok){illegalMoves++;fail('P_STATE_ILLEGAL',null,from+'>'+to);}
  state=to;stateLog.push({t:Date.now(),from:from,to:to,why:why||'',ok:ok});while(stateLog.length>200)stateLog.shift();
  if(appMode)post(PROTO.toApp.state,{state:to});}
const isArmed=()=>state!=='OFFLINE',isBusy=()=>state==='SPEAKING'||state==='SENDING';
const arm=why=>{if(state==='OFFLINE')transition('IDLE',why);};
/* ---- black box (step blackbox): one table of codes, one writer ---- */
const TRACE_HE={E_OVERLAY_DENIED:'אין הרשאה לחלון צף',E_OVERLAY_UPDATE:'החלון הצף לא התעדכן',E_TTS_INIT:'הקול לא עלה',E_TTS_OP:'תקלה בדיבור',E_SR_LIFECYCLE:'סגירת המאזין נכשלה',E_SR_NONE:'אין זיהוי דיבור במכשיר',E_MIC_FGS:'המיקרופון נחסם ברקע',E_FGS_START:'השירות לא הצליח לעלות',E_MIC_INIT:'המיקרופון לא נפתח',E_MIC_READ:'ההקלטה נקטעה',E_HAPTIC:'הרטט נכשל',E_TONE:'הצליל נכשל',E_AUDIO_STREAM:'שינוי עוצמת הקול נכשל',E_MEDIA_SESSION:'כפתור האוזניה לא נרשם',E_NET:'בדיקת עדכון נכשלה ברשת',E_SYS_CB:'חיבור לאירועי המערכת נכשל',E_INSTALL_PERM:'אין הרשאה להתקין עדכון',E_INSTALL_NET:'הורדת העדכון נכשלה',E_INSTALL_SIG:'העדכון לא עבר אימות',E_INTENT_OPEN:'פתיחה של אפליקציה נכשלה',E_PAGE_LOGIN:'הבועה התנתקה מהחשבון',E_PAGE_LOAD:'הדף לא נטען',E_PAGE_TAP:'לחיצה אוטומטית החטיאה',E_CRASH_SAVE:'שמירת קריסה נכשלה',E_PREFS:'קריאת ההגדרות נכשלה',E_SHADER:'האנימציה של הבועה נכשלה',E_TRACE_ROTATE:'יומן תקלות ישן נמחק',P_BRIDGE:'הדף לא הצליח לדבר עם הבועה',P_STORE:'הזיכרון המקומי בדפדפן חסום',P_AUDIO:'הצלילים בדף לא עלו',P_SR:'המיקרופון בדף נתקע',P_MIC_DENIED:'המיקרופון בדף נחסם',P_WAKELOCK:'המסך לא נשאר דלוק',P_DB_WRITE:'כתיבה למסד נכשלה',P_DB_READ:'קריאה מהמסד נכשלה',P_SEND:'ההודעה לא הגיעה לקלוד',P_ACK:'סימון הודעה כנאמרה נכשל',P_MSG_BAD:'הודעה פגומה',P_SPEAK_LOST:'הקול בטלפון השתתק באמצע בלי לדווח',P_PROTO_APP_OLD:'האפליקציה ישנה מהדף',P_PROTO_PAGE_OLD:'הדף ישן מהאפליקציה',P_REQ_UNBOUND:'תשובה שלא מצאה את השאלה שלה',P_CLOCK_SKEW:'השעון של הדף והטלפון לא מסונכרן',P_SPEAK_GUARD:'הקול לא דיווח שסיים ונעצר בכוח',P_STATE_ILLEGAL:'מעבר מצב שלא בטבלה',E_STATE_ILLEGAL:'מעבר מצב שלא בטבלה בבועה'};
const TRACE_SR_HE={1:'זיהוי הדיבור נכשל ברשת',2:'זיהוי הדיבור נכשל ברשת',3:'ההקלטה נכשלה',4:'שרת הזיהוי סירב',5:'תקלה פנימית בזיהוי',6:'לא שמעתי כלום',7:'לא זוהו מילים',8:'המאזין היה תפוס',9:'אין הרשאת מיקרופון',11:'חסרה שפה לזיהוי',12:'העברית לא מותקנת במכשיר',13:'הזיהוי במכשיר לא זמין'};
const TRACE_FLUSH=3000,TRACE_RING=200,TRACE_BATCH=200,TRACE_QMAX=1000;
let trVer='',trBuf=new Map(),trWin=0,trCount={},trDrop={},trQ=[],trRing=[],trTimer=null,trWriting=false,trInTrace=false;
const trMin=t=>Math.floor(t/60000);
const trCol=()=>P.telemetry();
/* hot loops (syncWindows per frame, wake-mode onError every 400ms) carry the hardest cap */
const trCap=c=>c==='E_CRASH_SAVE'?1e9:(c==='E_OVERLAY_UPDATE'||/^E_SR_\d+$/.test(c))?2:5;
function trDay(ts){try{return new Date(ts).toLocaleDateString('sv-SE',{timeZone:'Asia/Jerusalem'});}catch(e){return new Date(ts).toISOString().slice(0,10);}}
function trId(t,code,ctx){let h=0;const s=code+'|'+(ctx||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return t.toString(36)+'-'+('00'+(h%46656).toString(36)).slice(-3);}
/* ctx is machine text only – this strip is the privacy boundary: no utterance, no note, no url with a token */
function trCtx(v){return String(v==null?'':(v&&v.code)||(v&&v.name)||v).replace(/[^A-Za-z0-9_\-./:=|,<>()\[\] ]/g,'').replace(/\s+/g,' ').trim().slice(0,120);}
function trHe(c){if(TRACE_HE[c])return TRACE_HE[c];const m=/^E_SR_(\d+)$/.exec(c||'');if(m)return TRACE_SR_HE[m[1]]||'זיהוי הדיבור נכשל';return 'תקלה לא מוכרת';}
function trRingPush(L){trRing.push(L);while(trRing.length>TRACE_RING)trRing.shift();}
function trQueue(L){if(!L.q){L.q=true;trQ.push(L);while(trQ.length>TRACE_QMAX)trQ.shift();}if(!trTimer)trTimer=setTimeout(trFlush,TRACE_FLUSH);}
/* window close: every code that was capped writes its own dropped line, so the box cannot lie by omission */
function trRoll(now){const w=trMin(now);if(w===trWin)return;
  for(const c in trDrop){if(trDrop[c]>0){const t=trWin*60000,L={id:trId(t,c,'dropped'),t:t,c:c,n:0,ctx:'dropped',v:trVer,s:'p',d:trDrop[c]};trRingPush(L);trQueue(L);}}
  trBuf=new Map();trCount={};trDrop={};trWin=w;}
function fail(code,e,ctx){
  try{const t=Date.now();trRoll(t);
    const cx=trCtx(ctx!=null?ctx:e);const k=code+'|'+cx;const L=trBuf.get(k);
    if(L){L.n++;trQueue(L);return;}
    if((trCount[code]||0)>=trCap(code)){trDrop[code]=(trDrop[code]||0)+1;return;}
    trCount[code]=(trCount[code]||0)+1;
    const line={id:trId(t,code,cx),t:t,c:code,n:1,ctx:cx,v:trVer,s:'p'};
    trBuf.set(k,line);trRingPush(line);trQueue(line);

function trDoc(L){return {code:L.c,ts:L.t,n:L.n,ctx:L.ctx||'',ver:L.v||'',src:L.s||'p',dropped:L.d||0,day:trDay(L.t),at:Date.now()};}
/* a telemetry write that fails is re-queued in silence – calling fail() here would feed itself */
function trFlush(){trTimer=null;if(!db||trWriting||!trQ.length)return;
  const batch=trQ.splice(0,TRACE_BATCH);batch.forEach(L=>{L.q=false;});trWriting=true;
  Promise.all(batch.map(L=>{try{return Promise.resolve(trCol().doc(L.id).set(trDoc(L))).catch(()=>trQueue(L));}catch(e){trQueue(L);return Promise.resolve();}}))
    .then(()=>{trWriting=false;if(trQ.length&&!trTimer)trTimer=setTimeout(trFlush,TRACE_FLUSH);},()=>{trWriting=false;});}
/* Kotlin -> page: short-key lines in, long-key docs out; the ids that landed are acked back */
function trBridge(batch,json){
  let arr=null;
  if(trInTrace)return;trInTrace=true;
  try{arr=JSON.parse(json);}catch(e){fail('P_DB_WRITE',e,'telemetry/events parse');}
  trInTrace=false;
  if(!Array.isArray(arr)){post(PROTO.toApp.traceAck,{batch:batch,ids:'[]'});return;}
  const ok=[];
  Promise.all(arr.slice(0,TRACE_BATCH).map(ev=>{
    const t=+ev.t||Date.now(),c=String(ev.c||'E_UNKNOWN'),cx=trCtx(ev.ctx);
    const L={id:String(ev.id||trId(t,c,cx)),t:t,c:c,n:+ev.n||0,ctx:cx,v:String(ev.v||''),s:String(ev.s||'k'),d:+ev.d||0};

    /* a rejected write is simply left out of ids – unacked, so it comes back in the next batch */
    try{return Promise.resolve(trCol().doc(L.id).set(trDoc(L))).then(()=>{ok.push(L.id);},()=>{});}catch(e){return Promise.resolve();}
  })).then(()=>post(PROTO.toApp.traceAck,{batch:batch,ids:JSON.stringify(ok)}),()=>post(PROTO.toApp.traceAck,{batch:batch,ids:JSON.stringify(ok)}));}
/* reading it back: dropped counts inside the total, so the cap changes what is stored, never what is counted */
async function trTop(day){const byId=new Map();
  try{const r=await trCol().get();r.docs.forEach(d=>{const x=d.data()||{};const dy=x.day||trDay(x.ts||0);if(dy!==day)return;byId.set(d.id,{code:String(x.code||'?'),total:(+x.n||0)+(+x.dropped||0)});});}
  catch(e){fail('P_DB_READ',e,'telemetry/events');}
  trRing.forEach(L=>{if(trDay(L.t)!==day)return;byId.set(L.id,{code:L.c,total:(L.n||0)+(L.d||0)});});
  const by={};byId.forEach(v=>{by[v.code]=(by[v.code]||0)+v.total;});
  /* the open window's drops are not written yet – count them anyway, or the answer under-reports */
  if(trDay(trWin*60000)===day)for(const c in trDrop)if(trDrop[c]>0)by[c]=(by[c]||0)+trDrop[c];

  cur=d;seen=d.id;lastIncomingAt=Date.now();try{localStorage.setItem('liba.seen',d.id);}catch(e){fail('P_STORE',e,'set seen');}
  if(rec){try{rec.abort();}catch(e){fail('P_SR',e,'abort');}}
  transition('SPEAKING','incoming '+(d.kind||'say'));try{
  TR.querySelectorAll('.think').forEach(x=>x.remove());
  const k=d.kind||'say';const age=ageOf(d),old=age>AGE_SAY;
  /* urgency does not survive an hour in the queue: an old 'urgent' is read, not rung */
  let ak=(d.priority==='urgent'&&age<3600000&&(k==='say'||k==='ask'))?'call':k;
  if((ak==='call'||ak==='stuck')){if(Date.now()-lastRingAt<60000)ak='ask';else lastRingAt=Date.now();} /* step 47: one ring per batch */
  const who=speakerOf(d);const lead=(d.again?'שוב, כי זה נקטע באמצע. ':'')+(old?heAgo(age)+': ':'');
  const spokenText=(d.priority==='urgent'&&!old?'דחוף. ':'')+prefixOf(d,who)+lead+d.text;
  if(!appMode&&(ak==='call'||ak==='stuck')){app.className='ring';KIND.textContent='ליבה מצלצלת';KIND.className='kind stuck';ringStart();await new Promise(r=>setTimeout(r,2400));ringStop();app.className='';}
  KIND.textContent=k==='done'?'סיימתי':k==='stuck'?'נתקעתי':'';KIND.className='kind '+k;
  bubble('li',prefixOf(d,who)+lead+d.text);HEARD.hidden=true;OPTS.innerHTML='';
  if(k==='ask'||k==='stuck'||(d.options&&d.options.length))lastAsk={id:d.id,text:d.text,speaker:who,topic:d.topic||'',at:Date.now()};else if(!d.local)lastAsk=null;
  try{if(memSettings.logTurns)P.turns().doc(mintId()).set({from:d.from||'liba',speaker:who,topic:d.topic||'',kind:k,text:d.text,msg:d.id,ts:Date.now()}).catch(e=>fail('P_DB_WRITE',e,'chat/log/turns'));}catch(e){fail('P_DB_WRITE',e,'chat/log/turns');}
  if(appMode)await sayApp(spokenText,{kind:ak,options:d.options||[],from:d.from||'liba',speaker:who},d.local?null:d.re);else await say(spokenText+(d.options&&d.options.length?'. '+d.options.join(', או ')+'?':''));
  if(d.legacy){try{await P.current().update({spoken:true,spokenAt:Date.now()});}catch(e){fail('P_ACK',e,'chat/current');log('legacy ack: '+(e.code||e));}}
  if(d.options&&d.options.length){OPTS.innerHTML=d.options.map(o=>`<button>${esc(o)}</button>`).join('');OPTS.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>send(b.textContent,null,'option')));}
  showTalk();$('ack').hidden=k!=='done';
  }finally{transition('IDLE','spoke');drainQ();} /* v36: a sentence said while ליבה was speaking waits in the queue – release it here */
  if(micBlocked)return;
  if(appMode)return;
  if(SR&&!d.noListen&&(handsFree||(d.options&&d.options.length)||k==='stuck')){const t=await listen();if(t&&!isBusy())return send(t,null,'voice');if(handsFree&&!isBusy())idleListen();}
}
$('talk').addEventListener('click',async()=>{if(isBusy())return;if(listening){try{rec.stop();}catch(e){fail('P_SR',e,'stop');}return;}const t=await listen();if(t)send(t,null,'voice');});
$('sendTyped').addEventListener('click',()=>{const v=$('typed').value.trim();if(v)send(v,null,'typed');});
$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=$('typed').value.trim();if(v)send(v,null,'typed');}});
let autoT=null;$('typed').addEventListener('input',()=>{if(!micBlocked)return;clearTimeout(autoT);const v=$('typed').value.trim();if(v.length<3){log('');return;}log('שולח אוטומטית בעוד 3 שניות… (הקלדה מבטלת)');autoT=setTimeout(()=>{const v2=$('typed').value.trim();if(v2&&v2===v)send(v2,null,'typed');},3000);});
$('ack').addEventListener('click',()=>send('הבנתי, תמשיך',null,'option'));
/* wal-queue: Meir's sentence is written down BEFORE it is sent, not after it failed. Before, a page that closed
   mid-send lost the sentence; and the outbox removed items by object identity, so nothing stopped a resend
   after a reload. Now every item is keyed by its request id, carries a phase and a lease:
     queued  - waiting for the next flush
     sending - someone is delivering it right now, until leaseUntil (a dead page's lease simply expires)
   and before any resend the request is checked in the database - if it already went out, it is dropped.
   localStorage and not IndexedDB: it already works inside this iframe, and each write is atomic. */
const LEASE=60000;
let outbox=[];try{outbox=JSON.parse(localStorage.getItem('liba.outbox')||'[]');}catch(e){fail('P_STORE',e,'get outbox');}
outbox=outbox.map(it=>Object.assign({phase:'queued',leaseUntil:0,attempts:0},it,{req:it.req||('legacy-'+mintId())}));
function saveOutbox(){try{localStorage.setItem('liba.outbox',JSON.stringify(outbox));}catch(e){fail('P_STORE',e,'set outbox');}}
const walFind=req=>outbox.find(x=>x.req===req);
function walPut(it){outbox=outbox.filter(x=>x.req!==it.req);outbox.push(it);saveOutbox();}
function walLease(req){const it=walFind(req);if(!it)return null;it.phase='sending';it.leaseUntil=Date.now()+LEASE;it.attempts=(it.attempts||0)+1;saveOutbox();return it;}
function walRelease(req){const it=walFind(req);if(!it)return;it.phase='queued';it.leaseUntil=0;saveOutbox();}
function walDone(req){outbox=outbox.filter(x=>x.req!==req);saveOutbox();}
const walPending=()=>outbox.filter(x=>x.phase==='queued'||(x.phase==='sending'&&x.leaseUntil<Date.now()));
let lastSent={text:'',id:'',ts:0},lastIncomingAt=0;
function drainQ(){if(sendQ.length){const nx=sendQ.shift();setTimeout(()=>send({text:nx.text,tag:nx.tag,source:nx.source,stamps:nx.stamps}),300);return true;}return false;}
const RETRYABLE=r=>/network|fetch|timeout|unavailable|rate|503|502|429|offline|aborted|internal/i.test(r);
function tagOf(o){return (o||owner)==='manager'?'[ליבה→מנהל] ':'[ליבה] ';}
async function deliver(text,tag){
  let reason='no_comments';
  if(!comments){fail('P_SEND',null,reason);return {sent:false,reason};}
  try{const can=await comments.canSendToClaude();if(can!=='available'){fail('P_SEND',null,can);return {sent:false,reason:String(can)};}
    const anchor=await comments.anchorFor(H);await comments.sendToClaude({anchor,text:(tag||tagOf())+text});return {sent:true,reason:''};}
  catch(e){fail('P_SEND',e,(e&&(e.code||e.name))||'throw');return {sent:false,reason:String(e&&e.code||e)};}
}
async function deliverWithRetry(text,tag){
  const waits=[0,2000,5000,10000];let r={sent:false,reason:'offline'};
  for(let i=0;i<waits.length;i++){
    if(waits[i])await new Promise(res=>setTimeout(res,waits[i]));
    if(!navigator.onLine){r={sent:false,reason:'offline'};continue;}
    r=await deliver(text,tag);if(r.sent)return r;
    log('שליחה נכשלה ('+r.reason+') ניסיון '+(i+1));
    if(!RETRYABLE(r.reason))return r;
  }
  return r;
}
let flushing=false;
async function flushOutbox(){
  if(flushing||!walPending().length||!navigator.onLine||!comments)return;
  flushing=true;let items=[];
  let delivered=0;
  try{items=walPending();for(const it of items){
    // a sentence whose request is already sent went out before a reload: drop it, never send it twice
    if(!/^legacy-/.test(it.req)){try{const g=await P.req(it.req).get();const st=g.exists&&(g.data()||{}).state;if(st==='sent'||st==='answered'){walDone(it.req);continue;}}catch(e){fail('P_DB_READ',e,'req before resend');}}
    if(!walLease(it.req))continue;
    const r=await deliver(it.text,it.tag);if(!r.sent){walRelease(it.req);break;}
    walDone(it.req);delivered++;
    try{P.req(it.req).update({state:'sent',sentAt:Date.now(),late:true}).catch(e=>fail('P_DB_WRITE',e,'req late'));}catch(e){}
    post(PROTO.toApp.sent,{text:it.text,late:true});bubble('li','נשלח באיחור: '+it.text);}}
  finally{flushing=false;}
  if(delivered&&!walPending().length){const m='ליבה, בנוגע לשליחה: מה שאמרת נשלח עכשיו.';if(appMode)post(PROTO.toApp.say,{text:m,kind:'say',options:[],from:'liba',speaker:'ליבה'});else say(m);}
}
window.addEventListener('online',()=>setTimeout(flushOutbox,1500));setInterval(flushOutbox,8000);
/* req-spine: the id a session puts in inbox.re to say which sentence it answers. It goes at the END of the
   text so the tag at the start stays exactly '[ליבה] ' / '[ליבה→מנהל] ' - other sessions route on it. */
const reqMark=id=>' ⟦#'+id+'⟧';
const SOURCES=['voice','typed','share','option'];
async function send(text,forcedTag,source){
  let stamps=null;if(text&&typeof text==='object'){forcedTag=text.tag;source=text.source;stamps=text.stamps||null;text=text.text;}
  source=SOURCES.indexOf(source)>=0?source:'voice';
  text=String(text||'').replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff\u0591-\u05bd\u05bf\u05c1\u05c2\u05c4\u05c5\u05c7]/g,'').replace(/\s+/g,' ').trim();if(!text)return;
  if(!forcedTag&&switchOwner(text)){post(PROTO.toApp.sent,{text,local:true});if(!isBusy())drainQ();return;}
  const tag=forcedTag||tagOf();
  if(isBusy()){sendQ.push({text,tag,source,stamps});post(PROTO.toApp.queued,{text});return;}transition('SENDING','send');const id=cur?cur.id:'free';cur=null;
  $('typed').value='';OPTS.innerHTML='';$('ack').hidden=true;HEARD.hidden=true;
  if(text===lastSent.text&&(id==='free'||id===lastSent.id)&&Date.now()-lastSent.ts<5000){log('כפילות – לא נשלח שוב');post(PROTO.toApp.sent,{text,dup:true});transition('IDLE','duplicate');drainQ();return;}
  bubble('me',text);const th=bubble('li think','ליבה חושבת…');
  /* one request per sentence: what was said, how, to whom, and what it answered - so "how many did ליבה
     close" is a query and not a feeling */
  const reqId=mintId();
  try{P.req(reqId).set({text,askedAt:Date.now(),owner,tag:tag.trim(),source,reBubble:id,device:appMode?'app':'browser',state:'sending',
    t:{voice:(stamps&&+stamps.voice)||0,heard:(stamps&&+stamps.heard)||0,asked:Date.now(),skew:clockSkew,skewBad:clockSkew!=null&&Math.abs(clockSkew)>SKEW_MAX}}).catch(e=>fail('P_DB_WRITE',e,'req'));}catch(e){fail('P_DB_WRITE',e,'req');}
  try{if(memSettings.decisions&&lastAsk&&(Date.now()-lastAsk.at<3*60*1000)){P.decisions().doc(mintId()).set({question:lastAsk.text,to:lastAsk.speaker,topic:lastAsk.topic||'',answer:text,msg:lastAsk.id,ts:Date.now()}).catch(e=>fail('P_DB_WRITE',e,'decisions/log/items'));lastAsk=null;}}catch(e){fail('P_DB_WRITE',e,'decisions/log/items');}
  try{if(memSettings.logTurns)P.turns().doc(mintId()).set({from:'user',speaker:'מאיר',to:owner,text,re:id,req:reqId,ts:Date.now()}).catch(e=>fail('P_DB_WRITE',e,'chat/log/turns'));}catch(e){fail('P_DB_WRITE',e,'chat/log/turns');}
  walPut({req:reqId,text:text+reqMark(reqId),tag,ts:Date.now(),phase:'sending',leaseUntil:Date.now()+LEASE,attempts:1});
  const r=await deliverWithRetry(text+reqMark(reqId),tag);const sent=r.sent,reason=r.reason;
  const reqState=st=>{try{P.req(reqId).update(Object.assign({state:st,at:Date.now()},st==='sent'?{sentAt:Date.now()}:{reason:String(reason||'')})).catch(e=>fail('P_DB_WRITE',e,'req state'));}catch(e){}};
  if(sent){walDone(reqId);lastSent={text,id,ts:Date.now()};reqState('sent');}
  else if(RETRYABLE(reason)||reason==='offline'){reqState('queued');walRelease(reqId);const off=!navigator.onLine||reason==='offline';th.textContent=off?'אין רשת – שמרתי, אשלח כשתחזור':'השליחה נכשלה ('+reason+') – שמרתי, אנסה שוב';post(PROTO.toApp.outbox,{text,n:outbox.length,reason});const msg=off?'ליבה, בנוגע לרשת: אין רשת. שמרתי את מה שאמרת, ואשלח כשהרשת תחזור.':'ליבה, בנוגע לשליחה: השרת לא קיבל את זה כרגע. שמרתי, ואשלח שוב בעוד רגע.';if(appMode)post(PROTO.toApp.say,{text:msg,kind:'say',options:[],from:'liba',speaker:'ליבה'});else await say(msg);}
  else{walDone(reqId);reqState('failed');th.textContent='לא הצלחתי לשלוח ('+reason+') – נסה שוב';await say('לא הצלחתי לשלוח');}
  post(sent?PROTO.toApp.sent:(outbox.length&&(RETRYABLE(reason)||reason==='offline')?PROTO.toApp.queued:PROTO.toApp.error),{text,reason});
  transition('IDLE','sent');
  if(drainQ())return;
  if(!sent&&handsFree&&!outbox.length)idleListen();
}
